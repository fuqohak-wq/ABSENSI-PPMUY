<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Jamaah PPMUY</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0fff4 0%, #c6f6d5 100%);
            color: #22543d;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(34, 84, 61, 0.15);
            border: 3px solid #38a169;
            box-sizing: border-box;
            text-align: center;
            margin-top: 10px;
        }
        .ornamen {
            font-size: 24px;
            color: #2f855a;
            margin-bottom: 5px;
        }
        h2 {
            color: #1c4532;
            font-size: 22px;
            margin: 0 0 15px 0;
            font-weight: 700;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #2f855a;
            margin-bottom: 5px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #f7fafc;
            color: #2d3748;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus, input:focus {
            border-color: #38a169;
            background-color: #ffffff;
        }
        #reader {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #38a169 !important;
            background: #edf2f7;
            margin-top: 10px;
        }
        /* Style tombol internal dari library kamera */
        #reader button {
            background-color: #38a169 !important;
            color: white !important;
            border: none !important;
            padding: 12px 20px !important;
            font-size: 14px !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            font-weight: bold !important;
            margin: 10px 0 !important;
        }
        #reader button:hover {
            background-color: #2f855a !important;
        }
        /* Modal Pop-up */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-box {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            text-align: center;
            border: 4px solid #38a169;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-icon {
            font-size: 55px;
            color: #38a169;
            margin-bottom: 12px;
        }
        .modal-title {
            font-size: 22px;
            font-weight: bold;
            color: #276749;
            margin-bottom: 10px;
        }
        .modal-body {
            font-size: 16px;
            color: #4a5568;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .modal-btn {
            background: #38a169;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(56, 161, 105, 0.2);
        }
        .modal-btn:hover {
            background: #2f855a;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #718096;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="ornamen">۞ 🕌 ۞</div>
    <h2>Absensi Jamaah PPMUY</h2>
    
    <div class="form-group">
        <label for="kegiatan">Pilih Kegiatan:</label>
        <select id="kegiatan">
            <option value="Maghrib">Maghrib</option>
            <option value="Subuh">Subuh</option>
            <option value="Dzuhur">Dzuhur</option>
            <option value="Ashar">Ashar</option>
            <option value="Isya">Isya</option>
            <option value="PDF 1">PDF 1</option>
            <option value="PDF 2">PDF 2</option>
            <option value="PDF 3">PDF 3</option>
            <option value="Quranan">Quranan</option>
            <option value="Afsahan">Afsahan</option>
            <option value="Sorogan">Sorogan</option>
            <option value="Ndalem">Ndalem</option>
            <option value="Belajar">Belajar</option>
        </select>
    </div>

    <div class="form-group">
        <label for="pengabsen">Nama Pengabsen / Petugas:</label>
        <input type="text" id="pengabsen" value="KEPALA PONDOK PPMUY">
    </div>

    <label>Arahkan Barcode NIK Santri ke Kamera:</label>
    <div id="reader"></div>
    
    <div class="footer">Mata-Mata Scanner • Aplikasi Kehadiran PPMUY</div>
</div>

<div id="successModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-icon">✅</div>
        <div class="modal-title">Alhamdulillah, Sukses!</div>
        <div class="modal-body" id="modalMessage">
            NIK ini sudah berhasil absen. Terima kasih!
        </div>
        <button class="modal-btn" onclick="closeModal()">Selesai & Scan Lagi</button>
    </div>
</div>

<script>
    // 1. SILAHKAN PASTE URL WEB APP GOOGLE APPS SCRIPT ANDA DI BAWAH INI
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx5zJ-7fSwhHqI-U7jQWfvwSaedR3XF3JZqF-x6n63hI4cdJSKIuXqQ48v2Lyc_2qvR/exec"; 
    
    let lastScannedCode = "";
    let isProcessing = false;
    let html5QrcodeScanner;

    // Fungsi suara Beep instan menggunakan browser audio generator
    function playBeep() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(900, audioCtx.currentTime); // Bunyi bip nyaring
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15);
        } catch (e) {
            console.log("Gagal memutar audio: ", e);
        }
    }

    // Menampilkan jendela pop-up penutup agar tidak double scan
    function showPopup(nik) {
        const kegiatanDipilih = document.getElementById("kegiatan").value;
        document.getElementById("modalMessage").innerHTML = `
            NIK: <strong>${nik}</strong><br>
            Kegiatan: <strong>${kegiatanDipilih}</strong><br><br>
            Sudah berhasil absen.<br>Terima kasih atas kehadirannya!
        `;
        document.getElementById("successModal").style.display = "flex";
    }

    // Menutup jendela pop-up dan membuka kunci scanner kembali
    function closeModal() {
        document.getElementById("successModal").style.display = "none";
        setTimeout(() => {
            lastScannedCode = "";
            isProcessing = false;
        }, 1500); // Jeda aman 1.5 detik sebelum siap menerima scan kartu berikutnya
    }

    // Aksi ketika barcode NIK terbaca sukses
    function onScanSuccess(decodedText, decodedResult) {
        if (decodedText === lastScannedCode || isProcessing) return;

        lastScannedCode = decodedText;
        isProcessing = true;

        // Bunyikan tanda sukses (Beep)
        playBeep();

        // Tampilkan pop up pengunci halaman segera agar tidak bisa double-scan
        showPopup(decodedText);

        const payload = {
            nik: decodedText,
            kegiatan: document.getElementById("kegiatan").value,
            status: "HADIR",
            pengabsen: document.getElementById("pengabsen").value
        };

        // Kirim data ke backend code.gs Google Sheet Anda
        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors", 
            body: JSON.stringify(payload),
            headers: { "Content-Type": "application/json" }
        })
        .then(() => {
            console.log("Data NIK " + decodedText + " berhasil masuk spreadsheet.");
        })
        .catch(err => {
            console.error("Koneksi gagal: ", err);
        });
    }

    function initScanner() {
        // Mengatur inisialisasi agar memprioritaskan kamera belakang langsung
        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 10, 
                qrbox: { width: 250, height: 250 },
                rememberLastUsedCamera: true
            },
            /* verbose= */ false
        );
        html5QrcodeScanner.render(onScanSuccess);
    }

    // Menjalankan scanner secara otomatis saat halaman web dimuat di Vercel
    window.addEventListener("DOMContentLoaded", initScanner);
</script>
</body>
</html>
