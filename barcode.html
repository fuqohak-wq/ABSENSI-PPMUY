<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Absensi Barcode - PPMUY</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f7fafc; padding: 20px; margin: 0; text-align: center; }
        .container { max-width: 480px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: #1a365d; font-size: 20px; margin-bottom: 20px; }
        label { display: block; text-align: left; font-weight: bold; margin-top: 12px; font-size: 14px; color: #4a5568; }
        select, input { width: 100%; padding: 10px; margin: 6px 0 15px 0; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #edf2f7; }
        .alert { padding: 12px; border-radius: 6px; font-weight: bold; margin-top: 15px; display: none; }
        .success { background: #c6f6d5; color: #22543d; }
        .error { background: #fed7d7; color: #742a2a; }
        .loading { background: #feebc8; color: #744210; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sistem Absensi Santri PPMUY</h2>
    
    <label for="kegiatan">Pilih Kegiatan:</label>
    <select id="kegiatan">
        <option value="Maghrib">Maghrib</option>
        <option value="Subuh">Subuh</option>
        <option value="Dzuhur">Dzuhur</option>
        <option value="Ashar">Ashar</option>
        <option value="Isya">Isya</option>
        <option value="Quranan">Quranan</option>
        <option value="Afsahan">Afsahan</option>
        <option value="Sorogan">Sorogan</option>
        <option value="Ndalem">Ndalem</option>
        <option value="Belajar">Belajar</option>
        <option value="PDF 1">PDF 1</option>
        <option value="PDF 2">PDF 2</option>
        <option value="PDF 3">PDF 3</option>
    </select>

    <label for="pengabsen">Petugas / Pengabsen:</label>
    <input type="text" id="pengabsen" value="KEPALA PONDOK PPMUY">

    <div id="reader"></div>
    <div id="statusAlert" class="alert"></div>
</div>

<script>
    // MASUKKAN URL WEB APP ANDA DI SINI SETELAH DEPLOY DI GOOGLE APPS SCRIPT
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx5zJ-7fSwhHqI-U7jQWfvwSaedR3XF3JZqF-x6n63hI4cdJSKIuXqQ48v2Lyc_2qvR/exec"; 
    
    let lastScannedCode = "";
    let isProcessing = false;

    function setAlert(message, type) {
        const alertEl = document.getElementById("statusAlert");
        alertEl.className = "alert " + type;
        alertEl.style.display = "block";
        alertEl.innerText = message;
    }

    function onScanSuccess(decodedText, decodedResult) {
        // Mencegah scanning berulang secara instan atau jika proses sebelumnya belum selesai
        if (decodedText === lastScannedCode || isProcessing) return;

        lastScannedCode = decodedText;
        isProcessing = true;
        setAlert("Mencatat NIK: " + decodedText + "...", "loading");

        const dataPayload = {
            nik: decodedText,
            kegiatan: document.getElementById("kegiatan").value,
            status: "HADIR",
            pengabsen: document.getElementById("pengabsen").value
        };

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors", // Digunakan untuk menghindari issue CORS redirect di Google Apps Script
            body: JSON.stringify(dataPayload),
            headers: { "Content-Type": "application/json" }
        })
        .then(() => {
            setAlert("Berhasil melakukan absensi untuk NIK: " + decodedText, "success");
            // Mengatur jeda 3 detik sebelum kamera bersedia melakukan scan berikutnya
            setTimeout(() => { lastScannedCode = ""; isProcessing = false; }, 3000);
        })
        .catch(error => {
            setAlert("Gagal mengirim data: " + error.message, "error");
            isProcessing = false;
        });
    }

    // Menjalankan modul kamera scanner
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
</script>
</body>
</html>
