<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Absensi Jamaah PPMUY</title>
    <!-- Library HTML5-QRCode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e6fffa 0%, #b2f5ea 100%);
            color: #234e52;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(28, 95, 82, 0.15);
            border: 3px solid #319795;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            margin-top: 20px;
        }
        .header-ornament {
            font-size: 24px;
            color: #2c7a7b;
            margin-bottom: 5px;
        }
        h2 {
            color: #234e52;
            font-size: 22px;
            margin: 0 0 10px 0;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .subtitle {
            font-size: 13px;
            color: #4a5568;
            margin-bottom: 20px;
            background: #e6fffa;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            font-weight: 500;
            border: 1px solid #b2f5ea;
        }
        #reader {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #4fd1c5 !important;
            background: #f7fafc;
        }
        /* Customizing html5-qrcode UI elements internally to fit green theme */
        #reader button {
            background-color: #319795 !important;
            color: white !important;
            border: none !important;
            padding: 10px 20px !important;
            font-size: 14px !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            font-weight: bold !important;
            margin-top: 10px !important;
        }
        #reader button:hover {
            background-color: #2c7a7b !important;
        }
        /* Popup Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-box {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
            border: 4px solid #38a169;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-icon {
            font-size: 50px;
            color: #38a169;
            margin-bottom: 15px;
        }
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #276749;
            margin-bottom: 10px;
        }
        .modal-body {
            font-size: 15px;
            color: #4a5568;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .modal-btn {
            background: #38a169;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(56, 161, 105, 0.2);
            transition: all 0.2s;
        }
        .modal-btn:hover {
            background: #2f855a;
            transform: translateY(-1px);
        }
        .footer-text {
            margin-top: 25px;
            font-size: 11px;
            color: #718096;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-ornament">۞ 🕌 ۞</div>
    <h2>Absensi Jamaah PPMUY</h2>
    <div class="subtitle" id="infoKegiatan">Mendeteksi Waktu Shalat...</div>

    <!-- Scanner Area -->
    <div id="reader"></div>
    
    <div class="footer-text">Sistem Absensi Otomatis • Pesantren PPMUY</div>
</div>

<!-- Modal Popup Sukses -->
<div id="successModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-icon">✅</div>
        <div class="modal-title">Alhamdulillah, Sukses!</div>
        <div class="modal-body" id="modalMessage">
            NIK ini sudah berhasil absen. Terima kasih atas kehadirannya!
        </div>
        <button class="modal-btn" onclick="closeModal()">Selesai & Scan Lagi</button>
    </div>
</div>

<script>
    // 1. SILAHKAN PASTE URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx5zJ-7fSwhHqI-U7jQWfvwSaedR3XF3JZqF-x6n63hI4cdJSKIuXqQ48v2Lyc_2qvR/exec"; 
    
    // Auto-detect kegiatan berdasarkan jam lokal saat ini (opsional tapi cerdas)
    function dapatkanKegiatanOtomatis() {
        const jam = new Date().getHours();
        if (jam >= 4 && jam < 6) return "Subuh";
        if (jam >= 11 && jam < 15) return "Dzuhur";
        if (jam >= 15 && jam < 17) return "Ashar";
        if (jam >= 17 && jam < 19) return "Maghrib";
        if (jam >= 19 && jam < 22) return "Isya";
        return "Belajar"; // Default jika di luar jam shalat utama
    }

    const KEGIATAN_AKTIF = dapatkanKegiatanOtomatis();
    document.getElementById("infoKegiatan").innerText = "Kegiatan Saat Ini: " + KEGIATAN_AKTIF;

    let lastScannedCode = "";
    let isProcessing = false;

    // Fungsi membunyikan suara beep secara langsung lewat audio synthesizer browser (tanpa file mp3 eksternal!)
    function playBeep() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // Frekuensi nada tinggi (A5)
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15); // Bunyi selama 0.15 detik
        } catch (e) {
            console.log("Audio beep gagal berbunyi:", e);
        }
    }

    function showPopup(nik) {
        document.getElementById("modalMessage").innerHTML = `NIK <strong>${nik}</strong> sudah berhasil absen.<br><br>Terima kasih banyak atas kehadirannya tepat waktu!`;
        document.getElementById("successModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("successModal").style.color = "#234e52";
        document.getElementById("successModal").style.display = "none";
        // Beri jeda 1 detik setelah ditutup agar tidak langsung men-scan kartu yang sama
        setTimeout(() => {
            lastScannedCode = "";
            isProcessing = false;
        }, 1000);
    }

    function onScanSuccess(decodedText, decodedResult) {
        if (decodedText === lastScannedCode || isProcessing) return;

        lastScannedCode = decodedText;
        isProcessing = true;

        // Bunyikan tanda berhasil instan
        playBeep();

        const dataPayload = {
            nik: decodedText,
            kegiatan: KEGIATAN_AKTIF,
            status: "HADIR",
            pengabsen: "SCANNER_OTOMATIS"
        };

        // Langsung tampilkan modal pop-up menghalangi double scan
        showPopup(decodedText);

        // Jalankan background push data ke Google Sheet
        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(dataPayload),
            headers: { "Content-Type": "application/json" }
        })
        .then(() => {
            console.log("Data berhasil terkirim ke Google Sheets.");
        })
        .catch(error => {
            console.error("Gagal sinkronisasi data:", error);
        });
    }

    // Konfigurasi kamera belakang langsung tanpa banyak tombol pilihan instan
    function startScanner() {
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 15, 
                qrbox: { width: 250, height: 250 },
                rememberLastUsedCamera: true,
                supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
            }
        );
        html5QrcodeScanner.render(onScanSuccess);
    }

    // Jalankan scanner saat dokumen siap
    window.addEventListener("DOMContentLoaded", startScanner);
</script>
</body>
</html>
