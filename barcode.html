<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Jamaah PPMUY</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0fff4 0%, #c6f6d5 100%);
            color: #22543d;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(34, 84, 61, 0.15);
            border: 3px solid #38a169;
            box-sizing: border-box;
            text-align: center;
            margin-top: 10px;
        }
        .ornamen { font-size: 24px; color: #2f855a; margin-bottom: 5px; }
        h2 { color: #1c4532; font-size: 22px; margin: 0 0 15px 0; font-weight: 700; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: bold; color: #2f855a; margin-bottom: 5px; }
        select, input {
            width: 100%; padding: 12px; border: 2px solid #cbd5e0; border-radius: 10px;
            font-size: 15px; box-sizing: border-box; background-color: #f7fafc; color: #2d3748; outline: none;
        }
        select:focus, input:focus { border-color: #38a169; background-color: #ffffff; }
        #reader { width: 100%; border-radius: 15px; overflow: hidden; border: 2px solid #38a169 !important; background: #edf2f7; margin-top: 10px; }
        
        /* Modal Pop-up Tanpa Tombol */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 9999;
            justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .modal-box {
            background: #ffffff; padding: 35px 25px; border-radius: 20px; max-width: 400px; width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25); text-align: center; border: 4px solid #38a169;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-box.warning { border-color: #dd6b20; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-icon { font-size: 55px; margin-bottom: 12px; }
        .modal-title { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .modal-body { font-size: 16px; color: #4a5568; line-height: 1.5; }
        .countdown { font-size: 12px; color: #a0aec0; margin-top: 15px; font-style: italic; }
        .footer { margin-top: 20px; font-size: 11px; color: #718096; }
    </style>
</head>
<body>

<div class="container">
    <div class="ornamen">۞ 🕌 ۞</div>
    <h2>Absensi Jamaah PPMUY</h2>
    
    <div class="form-group">
        <label for="kegiatan">Pilih Kegiatan:</label>
        <select id="kegiatan">
            <option value="Maghrib">Maghrib</option>
            <option value="Subuh">Subuh</option>
            <option value="Dzuhur">Dzuhur</option>
            <option value="Ashar">Ashar</option>
            <option value="Isya">Isya</option>
            <option value="PDF 1">PDF 1</option>
            <option value="PDF 2">PDF 2</option>
            <option value="PDF 3">PDF 3</option>
            <option value="Quranan">Quranan</option>
            <option value="Afsahan">Afsahan</option>
            <option value="Sorogan">Sorogan</option>
            <option value="Ndalem">Ndalem</option>
            <option value="Belajar">Belajar</option>
        </select>
    </div>

    <div class="form-group">
        <label for="pengabsen">Nama Pengabsen / Petugas:</label>
        <input type="text" id="pengabsen" value="KEPALA PONDOK PPMUY">
    </div>

    <label>Arahkan Barcode NIK Santri ke Kamera:</label>
    <div id="reader"></div>
    
    <div class="footer">Mata-Mata Scanner • PPMUY</div>
</div>

<!-- Jendela Pop-up Otomatis -->
<div id="successModal" class="modal-overlay">
    <div class="modal-box" id="modalBox">
        <div class="modal-icon" id="modalIcon">✅</div>
        <div class="modal-title" id="modalTitle">Alhamdulillah, Sukses!</div>
        <div class="modal-body" id="modalMessage">...</div>
        <div class="countdown">Melanjutkan ke santri berikutnya dalam 3 detik...</div>
    </div>
</div>

<script>
    // 1. SILAHKAN PASTE URL WEB APP GOOGLE APPS SCRIPT ANDA DI BAWAH INI
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx5zJ-7fSwhHqI-U7jQWfvwSaedR3XF3JZqF-x6n63hI4cdJSKIuXqQ48v2Lyc_2qvR/exec"; 
    
    let lastScannedCode = "";
    let isProcessing = false;
    let html5QrcodeScanner;

    // Nada Beep Berhasil (Suara Tunggal)
    function playBeepSuccess() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
            oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.15);
        } catch (e) {}
    }

    // Nada Peringatan Duplikat (Dua kali bunyi pendek)
    function playBeepWarning() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const playSound = (freq, delay, duration) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(440, audioCtx.currentTime + delay);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime + delay);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + delay); osc.stop(audioCtx.currentTime + delay + duration);
            };
            playSound(440, 0, 0.1);
            playSound(440, 0.15, 0.1);
        } catch (e) {}
    }

    // Menampilkan Jendela Informasi Status secara Otomatis
    function showPopup(nik, type, customMsg = "") {
        const modal = document.getElementById("successModal");
        const box = document.getElementById("modalBox");
        const icon = document.getElementById("modalIcon");
        const title = document.getElementById("modalTitle");
        const msg = document.getElementById("modalMessage");
        const kegiatan = document.getElementById("kegiatan").value;

        if (type === "success") {
            playBeepSuccess();
            box.className = "modal-box";
            icon.innerText = "✅";
            icon.style.color = "#38a169";
            title.innerText = "Alhamdulillah, Sukses!";
            title.style.color = "#276749";
            msg.innerHTML = `NIK: <strong>${nik}</strong><br>Kegiatan: <strong>${kegiatan}</strong><br><br>Berhasil direkam. Terima kasih atas kehadirannya!`;
        } else {
            playBeepWarning();
            box.className = "modal-box warning";
            icon.innerText = "⚠️";
            icon.style.color = "#dd6b20";
            title.innerText = "Sudah Absen!";
            title.style.color = "#7b341e";
            msg.innerHTML = `NIK: <strong>${nik}</strong><br>Kegiatan: <strong>${kegiatan}</strong><br><br><span style="color:#c53030; font-weight:bold;">Sistem Menolak!</span> Santri ini sudah absen pada kegiatan ini hari ini.`;
        }

        modal.style.display = "flex";

        // TUTUP OTOMATIS DALAM 3 DETIK (3000ms)
        setTimeout(() => {
            modal.style.display = "none";
            lastScannedCode = "";
            isProcessing = false;
        }, 3000);
    }

    function onScanSuccess(decodedText, decodedResult) {
        if (decodedText === lastScannedCode || isProcessing) return;

        lastScannedCode = decodedText;
        isProcessing = true;

        const payload = {
            nik: decodedText,
            kegiatan: document.getElementById("kegiatan").value,
            status: "HADIR",
            pengabsen: document.getElementById("pengabsen").value
        };

        // Kirim validasi cek ke Google Sheet secara real-time
        fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(res => {
            if (res.status === "duplicate") {
                showPopup(decodedText, "duplicate");
            } else {
                showPopup(decodedText, "success");
            }
        })
        .catch(err => {
            // Jika mode no-cors aktif atau terjadi error jaringan, asumsikan sukses kirim agar antrean lancar
            showPopup(decodedText, "success");
        });
    }

    function initScanner() {
        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: { width: 250, height: 250 }, rememberLastUsedCamera: true }, false
        );
        html5QrcodeScanner.render(onScanSuccess);
    }

    window.addEventListener("DOMContentLoaded", initScanner);
</script>
</body>
</html>
