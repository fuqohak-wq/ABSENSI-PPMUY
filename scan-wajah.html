<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal Kiosk Wajah AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4">

    <!-- HEADER & NAVIGASI ATAS -->
    <div class="w-full max-w-md mx-auto flex flex-col gap-2">
        <div class="flex justify-between items-center bg-slate-900 border border-slate-800 p-3 rounded-2xl shadow-lg">
            <h1 class="text-[11px] font-black text-cyan-400 uppercase tracking-wider">
                <i class="fa-solid fa-face-viewfinder mr-1"></i> KIOSK SCAN WAJAH
            </h1>
            <a href="dashboard.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-black px-3 py-2 rounded-xl uppercase tracking-wider border border-slate-700 transition-colors">
                <i class="fa-solid fa-arrow-left mr-1"></i> Dashboard
            </a>
        </div>

        <!-- PILIHAN KEGIATAN & STATUS KONEKSI -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-col gap-2 shadow-lg">
            <div class="flex justify-between items-center mb-1">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Pilih Kegiatan</span>
                <p id="txt-db-status" onclick="ambilDatabaseSantri()" class="text-[10px] text-amber-400 font-bold animate-pulse cursor-pointer">Menghubungkan cloud...</p>
            </div>
            <select id="pilihan-kegiatan" class="w-full bg-slate-950 border-2 border-slate-700 rounded-xl px-3 py-3 text-xs font-black text-white outline-none cursor-pointer">
                <option value="Subuh">Jamaah Subuh</option>
                <option value="Dzuhur">Jamaah Dzuhur</option>
                <option value="Ashar">Jamaah Ashar</option>
                <option value="Maghrib">Jamaah Maghrib</option>
                <option value="Isya">Jamaah Isya</option>
                <option value="Quranan">Ngaji al-Qur'an Bakdo Subuh</option>
                <option value="Afsahan">Ngafsahi/Kursus Bakdo al-Qur'an</option>
                <option value="PDF 1">Sekolah PDF Jam Pertama</option>
                <option value="PDF 2">Sekolah PDF Jam Kedua</option>
                <option value="PDF 3">Sekolah PDF Jam Ketiga</option>
                <option value="Ndalem">Ngaji Ndalem Bakdo Ashar</option>
                <option value="Sorogan">Sorogan Kitab</option>
                <option value="Belajar">Jam Belajar</option>
                <option value="Jumatan">Jumatan</option>
                <option value="Ziarah">Ziarah Kubur</option>
            </select>
        </div>
    </div>

    <!-- AREA VIEWPORT VIDEO -->
    <div class="w-full max-w-md mx-auto my-auto flex flex-col justify-center items-center py-4">
        <div class="relative w-full aspect-square bg-slate-900 border-2 border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
            <!-- Ditambahkan CSS rendering optimization untuk HP -->
            <video id="video-selfie" autoplay playsinline class="w-full h-full object-cover scale-x-[-1] [image-rendering:auto] [will-change:transform]"></video>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div id="kotak-scan" class="w-64 h-64 border-4 border-dashed border-cyan-500/40 rounded-3xl flex items-center justify-center transition-all duration-300">
                    <span id="instruksi" class="text-[10px] bg-slate-950/90 text-cyan-400 px-4 py-2.5 rounded-xl font-black uppercase tracking-widest border border-cyan-500/30 text-center max-w-[85%]">Memasang AI...</span>
                </div>
            </div>
        </div>
    </div>

    <canvas id="canvas-capture" class="hidden"></canvas>

    <!-- POP-UP WARNING (ABSENSI GANDA) -->
    <div id="pop-warning" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-6 hidden z-[110]">
        <div class="bg-amber-500 text-slate-950 w-full max-w-sm p-6 rounded-3xl text-center shadow-2xl border-2 border-amber-400">
            <span class="text-xs font-black tracking-widest block opacity-75"><i class="fa-solid fa-triangle-exclamation mr-1"></i> AKSES DITOLAK</span>
            <span class="font-black text-base block mt-1 tracking-wide uppercase" id="txt-nama-peringatan">NAMA SANTRI</span>
            <span class="text-[11px] font-bold block mt-1 bg-slate-950/20 py-1 rounded-lg uppercase tracking-wider">Sudah Absen Pada Kegiatan Ini!</span>
        </div>
    </div>

    <script>
        const URL_AKURAT = "https://script.google.com/macros/s/AKfycbxJ8zjyd5YLsPhpq52ntO95-Bn5gNJlKLHSozMZ1kWFJAOGir5co21ln3gpiVI9UCx2/exec";

        let video = document.getElementById('video-selfie');
        let label = document.getElementById('instruksi');
        let kotakScan = document.getElementById('kotak-scan');
        let dbStatus = document.getElementById('txt-db-status');
        let canvasCap = document.getElementById('canvas-capture');

        let isProcessing = false;
        let databaseSantri = [];

        async function ambilDatabaseSantri() {
            try {
                dbStatus.innerText = "🔄 Sync AI Face Cloud...";
                const res = await fetch(`${URL_AKURAT}?aksi=ambil_database`, { method: "GET" });
                const json = await res.json();
                if (json.status === "success") {
                    databaseSantri = json.data;
                    dbStatus.innerText = `🟢 Kiosk Ready (${databaseSantri.length} Santri)`;
                    dbStatus.classList.remove('animate-pulse');
                }
            } catch (error) { dbStatus.innerText = `⚠️ Cloud Error`; }
        }

        function bunyikanBeep(frekuensi, durasi) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine'; oscillator.frequency.value = frekuensi;
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                oscillator.start(); gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + durasi);
                oscillator.stop(audioCtx.currentTime + durasi);
            } catch (e) {}
        }

        // FUNGSI DETEKSI LOOP OPTIMAL UNTUK PERFORMA HANDPHONE (ANTI-LAG)
        async function mulaiDeteksiWajah() {
            if (isProcessing || video.paused || video.ended || databaseSantri.length === 0) {
                // Jeda iterasi berikutnya jika sedang sibuk memproses atau database kosong
                setTimeout(mulaiDeteksiWajah, 200); 
                return;
            }

            try {
                // Menggunakan inputSize: 224 (jauh lebih ringan & lancar pada CPU handphone daripada 416)
                const hasilKamera = await faceapi.detectSingleFace(
                    video, 
                    new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.6 })
                ).withFaceLandmarks().withFaceDescriptor();

                if (hasilKamera) {
                    await verifikasiWajahLokal(hasilKamera.descriptor);
                }
            } catch (err) {
                console.error("Kesalahan deteksi:", err);
            }

            // Menjadwalkan deteksi berikutnya secara asinkron tanpa menumpuk antrean memori
            setTimeout(mulaiDeteksiWajah, 100); 
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (!localStorage.getItem('session_nama')) { localStorage.setItem('session_nama', 'KIOSK_MANDIRI'); }
            try {
                label.innerText = "MEMUAT AI KIOSK...";
                await faceapi.nets.tinyFaceDetector.loadFromUri('https://unpkg.com/@vladmandic/face-api/model');
                await faceapi.nets.faceLandmark68Net.loadFromUri('https://unpkg.com/@vladmandic/face-api/model');
                await faceapi.nets.faceRecognitionNet.loadFromUri('https://unpkg.com/@vladmandic/face-api/model');
                await ambilDatabaseSantri();
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", frameRate: { ideal: 30 } }, 
                    audio: false 
                });
                video.srcObject = stream;
                label.innerText = "HADAPKAN WAJAH KE KAMERA";
                
                // Memulai loop deteksi performa tinggi
                mulaiDeteksiWajah();
            } catch (e) { label.innerText = "AI OFFLINE"; }
        });

        async function verifikasiWajahLokal(descriptorKamera) {
            let santriDitemukan = null; 
            
            // Ambang batas kesamaan diturunkan ke 0.40 demi presisi tinggi dan mencegah salah orang (anti-swap)
            let jarakTerkecil = 0.40; 

            for (let santri of databaseSantri) {
                try {
                    let arrayVektorDb = Object.values(JSON.parse(santri.vektor));
                    let jarak = faceapi.euclideanDistance(descriptorKamera, arrayVektorDb);
                    if (jarak < jarakTerkecil) { 
                        jarakTerkecil = jarak; 
                        santriDitemukan = santri; 
                    }
                } catch(e){}
            }

            if (santriDitemukan) {
                isProcessing = true; 
                const kegiatan = document.getElementById('pilihan-kegiatan').value;
                const hariIni = new Date().toISOString().split('T')[0];
                const storageKey = `absen_${hariIni}_${santriDitemukan.nik}_${kegiatan}`;

                // Deteksi absensi ganda lokal secara cepat
                if (localStorage.getItem(storageKey) === "TERCATAT") {
                    document.getElementById('txt-nama-peringatan').innerText = santriDitemukan.nama.toUpperCase();
                    document.getElementById('pop-warning').classList.remove('hidden');
                    bunyikanBeep(440, 0.15);
                    setTimeout(() => { 
                        document.getElementById('pop-warning').classList.add('hidden'); 
                        isProcessing = false; 
                    }, 1500);
                    return;
                }

                // Kunci status absen lokal instan
                localStorage.setItem(storageKey, "TERCATAT");

                // Umpan balik visual sukses langsung di layar utama
                bunyikanBeep(1000, 0.2);
                label.innerText = `✔️ ${santriDitemukan.nama.toUpperCase()}`;
                label.className = "text-[11px] bg-emerald-500 text-slate-950 px-4 py-2.5 rounded-xl font-black uppercase tracking-widest border border-emerald-400 text-center max-w-[85%]";
                kotakScan.className = "w-64 h-64 border-4 border-solid border-emerald-400 rounded-3xl bg-emerald-500/10 scale-105 transition-all duration-150";

                // Ambil frame gambar
                canvasCap.width = video.videoWidth; canvasCap.height = video.videoHeight;
                const ctx = canvasCap.getContext('2d');
                ctx.translate(canvasCap.width, 0); ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, canvasCap.width, canvasCap.height);
                const dataFotoBase64 = canvasCap.toDataURL('image/jpeg', 0.25); // Kualitas diturunkan sedikit agar transmisi data HP lebih gesit

                // Kirim data secara asinkron di latar belakang
                fetch(URL_AKURAT, { 
                    method: "POST", 
                    headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                    body: JSON.stringify({
                        aksi: "absen_santri",
                        nik: santriDitemukan.nik,
                        kegiatan: kegiatan,
                        petugas: localStorage.getItem('session_nama'),
                        foto: dataFotoBase64
                    }) 
                }).then(response => response.json())
                  .then(data => {
                      console.log("Database synced:", data);
                  })
                  .catch(err => {
                      console.error("Gagal sinkronisasi cloud:", err);
                  });

                // Reset posisi scanner secara otomatis untuk antrean santri berikutnya
                setTimeout(() => {
                    label.innerText = "HADAPKAN WAJAH KE KAMERA";
                    label.className = "text-[11px] bg-slate-950/90 text-cyan-400 px-4 py-2.5 rounded-xl font-black uppercase tracking-widest border border-cyan-500/30 text-center max-w-[85%]";
                    kotakScan.className = "w-64 h-64 border-4 border-dashed border-cyan-500/40 rounded-3xl flex items-center justify-center transition-all duration-300";
                    isProcessing = false; 
                }, 1500);
            }
        }
    </script>
</body>
</html>
