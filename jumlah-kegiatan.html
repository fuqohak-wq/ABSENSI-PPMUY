<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pengurus - E-Pesantren</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PPMU Yahyawiyyah">

    <!-- Memuat aset secara non-blocking agar halaman segera muncul -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    
    <!-- Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Terdaftar!'))
                    .catch(err => console.error('Service Worker Gagal:', err));
            });
        }
    </script>

    <script>
        // DETEKSI INSTAN SESI AKTIF (Mencegah tampilan berkedip/flash)
        (function() {
            const versiSesi = localStorage.getItem('app_session_version');
            const nama = localStorage.getItem('session_nama');
            const role = localStorage.getItem('session_role');
            
            if (versiSesi === 'v2_resmi' && nama && role) {
                window.location.replace("dashboard.html");
            }
        })();
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl flex flex-col gap-4 text-center">
        <div>
            <div class="w-14 h-14 bg-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-2 shadow-lg">
                <i class="fa-solid fa-shield-halved text-slate-950 text-2xl"></i>
            </div>
            <h1 class="text-base font-black text-amber-400 tracking-wider uppercase">E-PESANTREN CORE</h1>
            <p class="text-[11px] text-slate-400 font-bold uppercase tracking-widest mt-0.5">Otorisasi Manajemen Terpadu</p>
        </div>
        <form id="form-login" class="space-y-3 text-left">
            <div>
                <label class="text-[10px] font-black text-slate-400 tracking-wider uppercase block mb-1">Username Pengurus:</label>
                <input type="text" id="inp-user" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-xs font-bold text-white outline-none focus:border-amber-400" required>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 tracking-wider uppercase block mb-1">PIN / Password:</label>
                <input type="password" id="inp-pass" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-xs font-bold text-white outline-none focus:border-amber-400" required>
            </div>
            <button type="submit" id="btn-login" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-xl text-xs uppercase tracking-widest transition-all cursor-pointer">MASUK SISTEM</button>
        </form>
    </div>

    <!-- BANNER CUSTOM POP-UP INSTALL PWA -->
    <div id="pwa-install-banner" class="hidden fixed bottom-4 left-4 right-4 sm:left-auto sm:right-4 sm:max-w-sm bg-yellow-400 text-slate-950 p-4 rounded-xl shadow-2xl flex justify-between items-center z-50 border-2 border-yellow-300">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-slate-900 rounded-lg flex items-center justify-center text-yellow-400 text-lg flex-shrink-0">
          <i class="fa-solid fa-download"></i>
        </div>
        <div>
          <h4 class="font-black text-xs uppercase tracking-wide">Install Aplikasi PPMUY</h4>
          <p class="text-[10px] font-bold text-slate-800 leading-tight">Pasang di layar utama HP agar cepat diakses!</p>
        </div>
      </div>
      <button id="btn-install-pwa" class="bg-slate-900 hover:bg-slate-800 text-yellow-400 font-black text-xs px-3 py-2 rounded-lg cursor-pointer transition-all uppercase tracking-wider flex-shrink-0 ml-2 shadow">
        INSTALL
      </button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec";
        
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const b = document.getElementById('btn-login');
            b.disabled = true; 
            b.innerText = "VALIDASI CLOUD...";
            
            const passwordInput = document.getElementById('inp-pass').value;
            const p = new URLSearchParams();
            p.append('aksi', 'login_admin');
            p.append('username', document.getElementById('inp-user').value);
            p.append('password', passwordInput);

            try {
                let res = await fetch(API_URL, { 
                    method: "POST", 
                    headers: { "Content-Type": "application/x-www-form-urlencoded" }, 
                    body: p.toString() 
                });
                
                let r = await res.json();
                if (r.status === "success") {
                    localStorage.setItem('session_nama', r.nama);
                    localStorage.setItem('session_role', r.role);
                    localStorage.setItem('session_password', passwordInput);
                    localStorage.setItem('app_session_version', 'v2_resmi');
                    
                    if (r.otoritas) {
                        localStorage.setItem('session_otoritas', r.otoritas);
                    }
                    
                    window.location.href = "dashboard.html";
                } else { 
                    alert(r.message); 
                }
            } catch(err) { 
                alert("Koneksi gagal atau masalah CORS!"); 
            } finally { 
                b.disabled = false; 
                b.innerText = "MASUK SISTEM"; 
            }
        });

        let deferredPrompt;
        const installBanner = document.getElementById('pwa-install-banner');
        const installBtn = document.getElementById('btn-install-pwa');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installBanner) {
                installBanner.classList.remove('hidden');
            }
        });

        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    deferredPrompt = null;
                    installBanner.classList.add('hidden');
                }
            });
        }

        window.addEventListener('appinstalled', () => {
            if (installBanner) {
                installBanner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
