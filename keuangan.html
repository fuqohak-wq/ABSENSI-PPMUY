<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPMUY Central App - Pendaftaran</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <nav class="bg-green-800 text-white px-6 py-4 flex justify-between items-center shadow-md">
        <div class="font-bold text-lg tracking-wide">PPMUY Central App</div>
        <div class="space-x-6 text-sm font-medium">
            <a href="#" class="border-b-2 border-white pb-1">Pendaftaran</a>
            <a href="#" class="text-green-200 hover:text-white transition">Input Kwitansi</a>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto my-8 px-4">
        <div class="bg-white rounded-xl shadow-lg border border-slate-200 p-6 md:p-8">
            <h2 class="text-xl font-bold text-slate-800 border-b pb-3 mb-6">Formulir Santri Baru</h2>

            <form id="formData" onsubmit="prosesSebelumKirim(event)" class="space-y-5">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap *</label>
                        <input type="text" id="nama" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">NIK (KTP/KK) *</label>
                        <input type="number" id="nik" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">No. WhatsApp *</label>
                        <input type="tel" id="no_hp" required placeholder="08..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal Lahir *</label>
                        <input type="date" id="tgl_lahir" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Alamat Lengkap *</label>
                    <textarea id="alamat" required rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Gender *</label>
                        <select id="gender" required class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-600">
                            <option value="Laki-laki">Laki-laki</option>
                            <option value="Perempuan">Perempuan</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Daftar Di Kelas *</label>
                        <select id="kelas" required class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-600">
                            <option value="">-- Pilih Kelas --</option>
                            <option value="7 Wustho">7 Wustho</option>
                            <option value="8 Wustho">8 Wustho</option>
                            <option value="9 Wustho">9 Wustho</option>
                            <option value="10 Ulya">10 Ulya</option>
                            <option value="11 Ulya">11 Ulya</option>
                            <option value="12 Ulya">12 Ulya</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Pilihan Asrama *</label>
                        <input type="text" id="asrama" value="PPMUY PUSAT" required class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-slate-50 font-semibold text-slate-600 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Lulusan / Sekolah Asal</label>
                        <input type="text" id="lulusan" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Referal / Rekomendasi</label>
                        <input type="text" id="referal" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                    </div>
                </div>

                <div class="border border-dashed border-slate-300 rounded-lg p-4 bg-slate-50/50">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Foto Santri (Format PNG/JPG) *</label>
                    <input type="file" id="fotoFile" accept="image/*" required class="w-full px-2 py-1.5 text-sm border border-slate-300 rounded-lg bg-white file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-green-100 file:text-green-700 hover:file:bg-green-200">
                    <p class="text-slate-400 text-xs mt-1">Ukuran berkas disarankan di bawah 2MB.</p>
                </div>

                <div class="pt-2">
                    <button type="submit" id="btnSubmit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                        Daftarkan Santri
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // URL DEPLOY GOOGLE SCRIPT PERMANEN ANDA
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzQBNTmZT3JSEkqNuVFDMnusi2pqUiEu91fgsh3dL2qpx3LlbjP64tkFMO9Y8o_6j8_oA/exec";

        function prosesSebelumKirim(event) {
            event.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            const fileInput = document.getElementById('fotoFile');
            const file = fileInput.files[0];

            btn.innerText = "⏳ Memproses foto...";
            btn.disabled = true;

            if (file && file.size > 2 * 1024 * 1024) {
                alert("Gagal! Ukuran file foto terlalu besar (Maksimal 2MB).");
                btn.innerText = "Daftarkan Santri";
                btn.disabled = false;
                return;
            }

            if (file) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function () {
                    eksekusiKirimSemuaData(reader.result, file.name);
                };
                reader.onerror = function (error) {
                    alert("Gagal membaca file foto: " + error);
                    btn.disabled = false;
                };
            } else {
                eksekusiKirimSemuaData(null, null);
            }
        }

        function eksekusiKirimSemuaData(base64Data, namaFile) {
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "⏳ Mengirim data pendaftaran...";

            const payload = {
                nama: document.getElementById('nama').value,
                alamat: document.getElementById('alamat').value,
                nik: document.getElementById('nik').value,
                tgl_lahir: document.getElementById('tgl_lahir').value,
                no_hp: document.getElementById('no_hp').value,
                gender: document.getElementById('gender').value,
                kelas: document.getElementById('kelas').value,
                asrama: document.getElementById('asrama').value,
                lulusan: document.getElementById('lulusan').value,
                referal: document.getElementById('referal').value,
                foto_base64: base64Data,
                foto_nama: namaFile
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(hasil => {
                if(hasil.status === 'success') {
                    alert("Alhamdulillah! Data santri baru & foto sukses dikirim ke database cloud PPMUY.");
                    document.getElementById('formData').reset();
                } else {
                    alert("Gagal menyimpan: " + hasil.message);
                }
            })
            .catch(err => {
                console.error("Terjadi Hambatan:", err);
                alert("Koneksi gagal! Pastikan Web App Anda di Google Apps Script sudah diperbarui (Deploy New Deployment).");
            })
            .finally(() => {
                btn.innerText = "Daftarkan Santri";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
