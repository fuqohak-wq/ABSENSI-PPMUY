<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Input Kegiatan & Tagihan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 20px; background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: none; margin-bottom: 20px; }
    .card-header { background-color: #fff; border-bottom: 1px solid #edf2f7; font-weight: bold; color: #2d3748; }
    .alert-infaq { background-color: #fffbeb; border-left: 5px solid #d97706; color: #92400e; border-radius: 8px; display: none; }
    .alert-syahriyyah { background-color: #f0fdf4; border-left: 5px solid #16a34a; color: #166534; border-radius: 8px; display: none; }
    .btn-orange { background-color: #d97706; color: white; font-weight: bold; }
    .btn-orange:hover { background-color: #b45309; color: white; }
    .btn-green { background-color: #16a34a; color: white; font-weight: bold; }
    .btn-green:hover { background-color: #115e59; color: white; }
  </style>
</head>
<body>

  <div class="container" style="max-width: 800px;">
    
    <div id="nyaiAlertInfaq" class="alert alert-infaq p-3 shadow-sm mb-3">
      <div class="d-flex justify-content-between align-items-center flex-wrap">
        <div>
          <span class="fw-bold">📢 Infaq Pendaftaran:</span> 
          Terdeteksi <span id="jumlahInfaqText" class="fw-bold text-danger">0</span> santri baru angkatan 2026 yang belum sinkron ke Nyai. Total: <span id="totalInfaqText" class="fw-bold text-success">Rp 0</span>
        </div>
        <button id="btnSinkronInfaq" class="btn btn-orange btn-sm mt-2 mt-md-0" onclick="prosesSinkronInfaq()">Proses & Sinkron Ke Nyai</button>
      </div>
    </div>

    <div id="nyaiAlertSyahriyyah" class="alert alert-syahriyyah p-3 shadow-sm mb-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap">
        <div>
          <span class="fw-bold">🌙 Susulan Syahriyyah:</span> 
          Terdeteksi <span id="jumlahSyahriyyahText" class="fw-bold text-danger">0</span> santri baru/susulan yang belum ditarik Syahriyyah bulan ini. Total: <span id="totalSyahriyyahText" class="fw-bold text-success">Rp 0</span>
        </div>
        <button id="btnSinkronSyahriyyah" class="btn btn-green btn-sm mt-2 mt-md-0" onclick="prosesSinkronSyahriyyah()">Tarik Syahriyyah Susulan</button>
      </div>
    </div>

    <div class="card">
      <div class="card-header p-3 d-flex align-items-center">
        📅 Form Input Kegiatan & Tagihan Setor Nyai
      </div>
      <div class="card-body p-4">
        <div class="mb-3">
          <label class="form-label fw-bold">Jenis Setoran Nyai:</label>
          <select class="form-select" id="jenisSetoran">
            <option>Ketik Sendiri (Lainnya...)</option>
          </select>
        </div>
        
        <div class="mb-3">
          <input type="text" class="form-control" id="kategoriBaru" placeholder="Tulis nama kategori setoran baru...">
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Cakupan Beban Santri:</label>
          <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="cakupan" id="semuaSantri" checked>
            <label class="form-check-label" for="semuaSantri">Semua Santri</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="cakupan" id="santriKhusus">
            <label class="form-check-label" for="santriKhusus">Santri Khusus (Manual)</label>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Nominal Per Santri (Rp):</label>
          <input type="text" class="form-control" id="nominalInput" placeholder="Contoh: 10.000">
        </div>

        <button class="btn btn-primary w-100 fw-bold py-2" style="background-color: #1d4ed8;" onclick="simpanKePusat()">Simpan & Lempar Ke Pusat</button>
      </div>
    </div>

  </div>

  <script>
    // URL WEBAPP ANDA SUDAH DIKUNCI PERMANEN DI SINI (Paling Aman untuk Netlify / GitHub Pages)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydgX_DYVHmJUtNPxdryj_sbo2miXRyvC3jU_IPHogludeVPMPK4iPAnWbWu0dHU_dS/exec";

    // AUTO-RUN SAAT HALAMAN DIBUKA
    window.onload = function() {
      cekSemuaNotifikasi();
    };

    function cekSemuaNotifikasi() {
      // A. Cek Notifikasi Jalur 1 (Infaq Pendaftaran)
      panggilAPI({ action: "checkAndPreviewSantriBaru" }, function(res) {
        if (res && res.jumlahSantriBaru > 0) {
          document.getElementById("jumlahInfaqText").innerText = res.jumlahSantriBaru;
          document.getElementById("totalInfaqText").innerText = "Rp " + res.totalSetoranNyai.toLocaleString('id-ID');
          document.getElementById("nyaiAlertInfaq").style.display = "block";
        } else {
          document.getElementById("nyaiAlertInfaq").style.display = "none";
        }
      });

      // B. Cek Notifikasi Jalur 2 (Susulan Syahriyyah Bulanan)
      panggilAPI({ action: "checkAndPreviewSyahriyyahSusulan" }, function(res) {
        if (res && res.count > 0) {
          document.getElementById("jumlahSyahriyyahText").innerText = res.count;
          document.getElementById("totalSyahriyyahText").innerText = "Rp " + res.totalNominal.toLocaleString('id-ID');
          document.getElementById("nyaiAlertSyahriyyah").style.display = "block";
        } else {
          document.getElementById("nyaiAlertSyahriyyah").style.display = "none";
        }
      });
    }

    // EKSEKUSI TOMBOL KUNING (INFAQ PENDAFTARAN)
    function prosesSinkronInfaq() {
      var btn = document.getElementById("btnSinkronInfaq");
      btn.disabled = true;
      btn.innerText = "Memproses...";

      panggilAPI({ action: "executeSetoranSantriBaru" }, function(res) {
        alert("Sukses! Berhasil menyinkronkan " + res.processedCount + " santri baru angkatan 2026.");
        btn.innerText = "Proses & Sinkron Ke Nyai";
        btn.disabled = false;
        cekSemuaNotifikasi();
      });
    }

    // EKSEKUSI TOMBOL HIJAU (SUSULAN SYAHRIYYAH BULANAN)
    function prosesSinkronSyahriyyah() {
      var btn = document.getElementById("btnSinkronSyahriyyah");
      btn.disabled = true;
      btn.innerText = "Memproses...";

      panggilAPI({ action: "executeSyahriyyahSusulan" }, function(res) {
        alert(res);
        btn.innerText = "Tarik Syahriyyah Susulan";
        btn.disabled = false;
        cekSemuaNotifikasi();
      });
    }

    // FUNGSI UTAMA UNTUK JEMBATAN KE GOOGLE SCRIPT POST (doPost)
    function panggilAPI(payload, callback) {
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(result => {
        if (result.success) {
          callback(result.data);
        } else {
          console.error("Gagal API:", result.error);
        }
      })
      .catch(error => console.error("Error Koneksi:", error));
    }

    function simpanKePusat() {
      alert("Fitur simpan form utama berhasil dipanggil!");
    }
  </script>
</body>
</html>
