<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Bendahara PPMUY</title>
  <style>
    :root { --primary: #1e3a8a; --accent: #0d9488; --bg: #f8fafc; --text: #1e293b; --card-bg: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 750px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding: 20px; background: var(--primary); color: white; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .btn { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 13px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    /* ... (tambahkan CSS lainnya dari file asli Anda di sini) ... */
  </style>
</head>
<body>

<div class="container">
  <header>
    <div><h1>DASHBOARD BENDAHARA PUSAT</h1></div>
    <button class="btn btn-admin" onclick="bukaRuangAdmin()">🔐 Ruang Admin</button>
  </header>

  <div class="card">
    <h2>✍️ Input Tabungan</h2>
    <div class="form-group">
      <label>Nominal Tabungan (Rp):</label>
      <input type="text" id="nominalTabungan" placeholder="1.000.000" onkeyup="this.value = formatRupiah(this.value)">
    </div>
    <button id="btnSimpanTabungan" class="btn" onclick="simpanTabungan()">Simpan Transaksi</button>
  </div>

  <div class="card">
    <h2>📅 Input Kegiatan Setoran Nyai</h2>
    <div class="form-group">
      <label>Jenis Setoran Nyai:</label>
      <select id="dropdownKategori" onchange="handleDropdownKategori(this.value)">
        <option value="ACARA BUBUR SYURO">ACARA BUBUR SYURO</option>
        <option value="LAINNYA">Lainnya...</option>
      </select>
      <input type="text" id="customKategori" placeholder="Tulis nama kategori..." style="display:none; margin-top:8px;">
    </div>
    <div class="form-group">
      <label>Nominal Per Santri (Rp):</label>
      <input type="text" id="nominalPerAnak" placeholder="50.000" onkeyup="this.value = formatRupiah(this.value)">
    </div>
    <button class="btn btn-blue" onclick="simpanAcaraBaru()">Simpan & Lempar Ke Pusat</button>
  </div>
</div>

<script>
  // FUNGSI FORMAT RUPIAH OTOMATIS
  function formatRupiah(angka) {
    var number_string = angka.replace(/[^,\d]/g, '').toString(),
        split   = number_string.split(','),
        sisa    = split[0].length % 3,
        rupiah  = split[0].substr(0, sisa),
        ribuan  = split[0].substr(sisa).match(/\d{3}/gi);
    if (ribuan) {
      separator = sisa ? '.' : '';
      rupiah += separator + ribuan.join('.');
    }
    return rupiah;
  }

  // Fungsi simpan acara baru yang sudah disesuaikan (Tanpa Keterangan Manual)
  function simpanAcaraBaru() {
    let jenis = document.getElementById("dropdownKategori").value;
    if(jenis === "LAINNYA") jenis = document.getElementById("customKategori").value;
    const nominal = document.getElementById("nominalPerAnak").value;

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "cors",
      body: JSON.stringify({
        action: "saveAcaraBaru", 
        jenisSetorNyai: jenis, 
        nominalPerAnak: nominal,
        // Keterangan dihapus karena sudah otomatis di Apps Script
        cakupan: document.querySelector('input[name="cakupan"]:checked').value,
        santriList: listSantriKhususAcara
      })
    }).then(res => res.json()).then(res => {
      if(res.success) alert("Sukses!");
    });
  }

  // Panggil fungsi formatRupiah pada semua input nominal saat diketik
  // Pastikan ID elemen disesuaikan dengan kode Anda
</script>
</body>
</html>
