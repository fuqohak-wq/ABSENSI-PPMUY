<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Santri Baru - PPMUY</title>
  
  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            institute: {
              primary: '#00a870', /* Hijau tombol kiri */
              primaryHover: '#008f5f',
              darkBg: '#121212',
              darkCard: '#1e1e1e'
            }
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Segoe UI', 'Inter', sans-serif;
    }
    /* Meniru persis style border hitam tegas dari image_45ccae.png */
    .input-tegas {
      border: 1px solid #2d3748 !important;
      border-radius: 4px !important;
      transition: all 0.2s ease;
    }
    .input-tegas:focus {
      outline: none !important;
      border-color: #00a870 !important;
      box-shadow: 0 0 0 1px #00a870 !important;
    }
    .dark .input-tegas {
      border-color: #4a5568 !important;
      background-color: #1a202c !important;
      color: #ffffff !important;
    }
    .dark .input-tegas:focus {
      border-color: #00a870 !important;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

  <!-- TOP STATUS BAR (FUNGSI KANAN) -->
  <div class="w-full bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 shadow-sm">
    <div class="max-w-4xl mx-auto px-6 py-2 flex justify-between items-center text-xs font-semibold text-slate-600 dark:text-slate-400">
      <div class="flex items-center gap-4">
        <span class="flex items-center gap-1">
          <i class="fa-regular fa-calendar text-emerald-600"></i>
          <span id="txt-tanggal">Loading...</span>
        </span>
        <span class="text-slate-300">|</span>
        <span id="txt-jam" class="font-mono">00:00:00</span>
      </div>
      <button id="theme-toggle" class="px-2 py-1 rounded border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 hover:bg-slate-100 text-[11px] uppercase tracking-wider">
        <i id="theme-icon" class="fa-solid fa-moon"></i> Mode
      </button>
    </div>
  </div>

  <!-- CONTAINER UTAMA (GAYA BERSIH IMAGE KIRI) -->
  <main class="w-full max-w-4xl mx-auto px-4 py-8 flex-grow">
    
    <!-- CARD BOX (PERSIS SEPERTI SEBELUMNYA DI IMAGE_45CCAE.PNG) -->
    <div class="bg-white dark:bg-slate-800 rounded-lg shadow-md border border-slate-200 dark:border-slate-700 p-6 md:p-8">
      
      <!-- JUDUL UTAMA -->
      <div class="border-b border-slate-300 dark:border-slate-600 pb-3 mb-6">
        <h1 class="text-xl font-bold text-slate-800 dark:text-white">Formulir Santri Baru</h1>
      </div>

      <!-- MUTIARA KHIDMAH (FUNGSI DARI KANAN) -->
      <div class="mb-6 p-4 rounded-md border-l-4 border-emerald-600 bg-emerald-50/50 dark:bg-emerald-950/20 text-xs md:text-sm">
        <span class="block text-[10px] font-bold text-emerald-700 dark:text-emerald-400 uppercase tracking-wider mb-1">Mutiara Khidmah:</span>
        <p id="quote-khidmah" class="italic text-slate-700 dark:text-slate-300">"Memuat pesan motivasi..."</p>
      </div>

      <!-- FORMULIR INPUT -->
      <form id="pendaftaranForm" class="space-y-6">
        
        <!-- BARIS 1: NAMA & NIK -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="label-tegas">Nama Lengkap *</label>
            <input type="text" id="nama" required placeholder="Sesuai berkas ijazah" class="w-full px-3 py-2 text-sm input-tegas">
          </div>
          <div>
            <label class="label-tegas">NIK (KTP/KK) *</label>
            <input type="text" id="nik" required placeholder="16 Digit Angka Nomor KTP / KK" class="w-full px-3 py-2 text-sm input-tegas">
          </div>
        </div>

        <!-- BARIS 2: WHATSAPP & TANGGAL LAHIR -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="label-tegas">No. WhatsApp *</label>
            <input type="text" id="no_hp" required placeholder="08..." class="w-full px-3 py-2 text-sm input-tegas">
          </div>
          <div>
            <label class="label-tegas">Tanggal Lahir *</label>
            <input type="date" id="tgl_lahir" required class="w-full px-3 py-2 text-sm input-tegas dark:color-scheme-dark">
          </div>
        </div>

        <!-- BARIS 3: ALAMAT LENGKAP -->
        <div>
          <label class="label-tegas">Alamat Lengkap *</label>
          <textarea id="alamat" rows="3" required placeholder="Nama jalan, nomor rumah, RT/RW, Dusun, Kelurahan, Kecamatan" class="w-full px-3 py-2 text-sm input-tegas"></textarea>
        </div>

        <!-- BARIS 4: GENDER, KELAS, ASRAMA (DARI DATA KANAN + KELAS) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="label-tegas">Gender *</label>
            <select id="gender" required class="w-full px-3 py-2 text-sm input-tegas bg-white dark:bg-slate-900">
              <option value="LAKI-LAKI">Laki-laki</option>
              <option value="PEREMPUAN">Perempuan</option>
            </select>
          </div>
          <div>
            <label class="label-tegas">Daftar Di Kelas *</label>
            <select id="kelas" required class="w-full px-3 py-2 text-sm input-tegas bg-white dark:bg-slate-900">
              <option value="">-- Pilih Kelas --</option>
              <option value="KELAS 0 1 (ULA 1)">KELAS 0 1 (ULA 1)</option>
              <option value="KELAS 0 2 (ULA 2)">KELAS 0 2 (ULA 2)</option>
              <option value="KELAS 1 (WUSHTO 1)">KELAS 1 (WUSHTO 1)</option>
              <option value="KELAS 2 (WUSHTO 2)">KELAS 2 (WUSHTO 2)</option>
              <option value="KELAS 3 (WUSTHO 3)">KELAS 3 (WUSTHO 3)</option>
              <option value="KELAS 4 (ULYA 1)">KELAS 4 (ULYA 1)</option>
              <option value="KELAS 5 (ULYA 2)">KELAS 5 (ULYA 2)</option>
              <option value="KELAS 6 (ULYA 3)">KELAS 6 (ULYA 3)</option>
            </select>
          </div>
          <div>
            <label class="label-tegas">Pilihan Asrama *</label>
            <input type="text" id="asrama" class="w-full px-3 py-2 text-sm input-tegas bg-slate-100 text-slate-500 font-semibold cursor-not-allowed border-dashed" value="PPMUY PUSAT" readonly>
          </div>
        </div>

        <!-- BARIS 5: SEKOLAH ASAL, REFERAL, ORANG TUA, KOTA -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="label-tegas">Nama Orang Tua / Wali *</label>
            <input type="text" id="orang_tua" required placeholder="Nama lengkap penanggung jawab" class="w-full px-3 py-2 text-sm input-tegas">
          </div>
          <div>
            <label class="label-tegas">Kabupaten / Kota Asal *</label>
            <input type="text" id="kota" required placeholder="Contoh: Kabupaten Pati" class="w-full px-3 py-2 text-sm input-tegas">
          </div>
          <div>
            <label class="label-tegas">Lulusan / Sekolah Asal</label>
            <input type="text" id="sekolah_asal" placeholder="Nama sekolah sebelumnya" class="w-full px-3 py-2 text-sm input-tegas">
          </div>
          <div>
            <label class="label-tegas">Referal / Rekomendasi Pengurus</label>
            <input type="text" id="referal" placeholder="Nama perekomendasi (jika ada)" class="w-full px-3 py-2 text-sm input-tegas">
          </div>
        </div>

        <!-- BARIS 6: KEUANGAN & PETUGAS (FUNGSI INTEGRASI KANAN) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="label-tegas">Jenis Alokasi Pembayaran *</label>
            <select id="jenis_pembayaran" required class="w-full px-3 py-2 text-sm input-tegas bg-white dark:bg-slate-900">
              <option value="">-- Pilih Jenis Pembayaran --</option>
              <option value="Pendaftaran Santri Baru">Pendaftaran Santri Baru</option>
              <option value="Infaq Gedung / Sarpras">Infaq Gedung / Sarpras</option>
              <option value="Syahriah / SPP Bulanan">Syahriah / SPP Bulanan</option>
              <option value="Lunas Gelombang 1">Lunas Gelombang 1</option>
            </select>
          </div>
          <div>
            <label class="label-tegas">Nominal Uang Masuk (Rp) *</label>
            <input type="text" id="nominal" required placeholder="Contoh: 50.000" class="w-full px-3 py-2 text-sm input-tegas font-semibold text-emerald-600 dark:text-emerald-400">
          </div>
          <div class="md:col-span-2">
            <label class="label-tegas">Nama Petugas Akreditasi / Penerima *</label>
            <input type="text" id="petugas" required placeholder="Ketik nama admin pencatat transaksi keuangan" class="w-full px-3 py-2 text-sm input-tegas">
          </div>
        </div>

        <!-- BARIS 7: UPLOAD FOTO (BENTUK KOTAK DASHED DI BAWAH DARI IMAGE_45CCAE.PNG) -->
        <div class="border border-dashed border-slate-300 dark:border-slate-600 rounded p-4 bg-slate-50/50 dark:bg-slate-900/30">
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2">Foto Santri (Format PNG/JPG) *</label>
          <div class="flex items-center gap-3">
            <label for="foto" class="cursor-pointer bg-emerald-50 dark:bg-slate-700 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-slate-600 rounded px-4 py-1.5 text-xs font-semibold hover:bg-emerald-100 transition-colors">
              Choose file
            </label>
            <input id="foto" type="file" accept="image/*" required class="sr-only">
            <span id="nama-file-terpilih" class="text-xs text-slate-500">No file chosen</span>
          </div>
        </div>

        <!-- TOMBOL DAFTAR (HIJAU TEGAS FULL DARI IMAGE_45CCAE.PNG) -->
        <div>
          <button type="submit" id="submitBtn" class="w-full bg-institute-primary hover:bg-institute-primaryHover text-white font-bold py-2.5 px-4 rounded transition-colors text-sm tracking-wide">
            Daftarkan Santri
          </button>
        </div>

      </form>

      <!-- NOTIFIKASI HANDLING -->
      <div id="message" class="mt-4 p-3 rounded text-xs font-semibold hidden border text-center"></div>

    </div>
  </main>

  <!-- CSS SCRIPT UNTUK TEKS LABEL -->
  <style>
    .label-tegas {
      @apply block font-bold text-xs text-slate-800 dark:text-slate-200 mb-1.5;
    }
    .success { @apply bg-emerald-50 text-emerald-800 border-emerald-200 dark:bg-emerald-950/20 dark:text-emerald-400 dark:border-emerald-900/50; }
    .error { @apply bg-rose-50 text-rose-800 border-rose-200 dark:bg-rose-950/20 dark:text-rose-400 dark:border-rose-900/50; }
  </style>

  <!-- LOGIC CONTROLLER PROGRAM -->
  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzAI3lDT24kLujhxK_ZSvQe7O02lDfkiUU1TesLt5Gzw2yL03wQr-6qFzB-HpOIw2bl-Q/exec";

    const quotesKhidmah = [
      "Niatkan pendaftaran ini sebagai langkah awal thalabul ilmi dan berbakti kepada umat serta agama!",
      "Khidmah mboten pados panggung utawi pujian, nanging pados ridha lan sambungipun sanad ilmu.",
      "Lelahmu di pesantren akan menjadi lillah, penuntun jalan berkah dunia dan akhirat.",
      "Khidmah dumateng pondok lan kiai niku kunci berekahipun ilmu ingkang sejati."
    ];

    document.addEventListener("DOMContentLoaded", function() {
      const randomIdx = Math.floor(Math.random() * quotesKhidmah.length);
      document.getElementById("quote-khidmah").innerText = `"${quotesKhidmah[randomIdx]}"`;
      
      updateJamTanggal();
      setInterval(updateJamTanggal, 1000);
      initThemeEngine();
    });

    function updateJamTanggal() {
      const skr = new Date();
      const opsiTgl = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById("txt-tanggal").innerText = skr.toLocaleDateString('id-ID', opsiTgl);
      document.getElementById("txt-jam").innerText = skr.toLocaleTimeString('id-ID');
    }

    function initThemeEngine() {
      const btn = document.getElementById("theme-toggle");
      const icon = document.getElementById("theme-icon");
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        icon.className = "fa-solid fa-sun";
      } else {
        document.documentElement.classList.remove('dark');
        icon.className = "fa-solid fa-moon";
      }
      btn.addEventListener("click", function() {
        if (document.documentElement.classList.contains('dark')) {
          document.documentElement.classList.remove('dark');
          icon.className = "fa-solid fa-moon";
          localStorage.setItem('theme', 'light');
        } else {
          document.documentElement.classList.add('dark');
          icon.className = "fa-solid fa-sun";
          localStorage.setItem('theme', 'dark');
        }
      });
    }

    // Nama file handler
    const fotoInput = document.getElementById('foto');
    fotoInput.addEventListener('change', function() {
      const label = document.getElementById('nama-file-terpilih');
      if (this.files && this.files.length > 0) {
        label.innerText = this.files[0].name;
        label.className = "text-xs font-semibold text-emerald-600 dark:text-emerald-400";
      } else {
        label.innerText = "No file chosen";
        label.className = "text-xs text-slate-500";
      }
    });

    // Ribuan dengan titik otomatis
    const nominalInput = document.getElementById('nominal');
    nominalInput.addEventListener('keyup', function(e) {
      let value = this.value.replace(/[^0-9]/g, '');
      this.value = value ? Number(value).toLocaleString('id-ID') : '';
    });

    // Submit Action
    document.getElementById('pendaftaranForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const msgDiv = document.getElementById('message');
      const fileInput = fotoInput.files[0];
      
      submitBtn.disabled = true;
      submitBtn.innerText = "Memproses berkas foto...";
      msgDiv.style.display = "none";

      const dataObj = {
        nama: document.getElementById('nama').value,
        nik: document.getElementById('nik').value,
        no_hp: document.getElementById('no_hp').value,
        tgl_lahir: document.getElementById('tgl_lahir').value,
        alamat: document.getElementById('alamat').value,
        gender: document.getElementById('gender').value,
        kelas: document.getElementById('kelas').value,
        orang_tua: document.getElementById('orang_tua').value,
        kota: document.getElementById('kota').value,
        sekolah_asal: document.getElementById('sekolah_asal').value,
        referal: document.getElementById('referal').value,
        jenis_pembayaran: document.getElementById('jenis_pembayaran').value,
        nominal: nominalInput.value.replace(/\./g, ''),
        petugas: document.getElementById('petugas').value,
        fotoData: null, fotoNama: "", fotoType: ""
      };

      if (fileInput) {
        const reader = new FileReader();
        reader.onloadend = function() {
          dataObj.fotoData = reader.result.split(',')[1];
          dataObj.fotoNama = fileInput.name;
          dataObj.fotoType = fileInput.type;
          submitBtn.innerText = "Mengirim data ke Server...";
          kirimDataApi(dataObj);
        };
        reader.readAsDataURL(fileInput);
      } else {
        kirimDataApi(dataObj);
      }
    });

    function kirimDataApi(data) {
      const msgDiv = document.getElementById('message');
      const submitBtn = document.getElementById('submitBtn');
      
      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(data)
      })
      .then(function() {
        msgDiv.className = "mt-4 p-3 rounded text-xs font-semibold block success";
        msgDiv.innerText = "Data pendaftaran berhasil diverifikasi sistem & dikirim ke WhatsApp!";
        document.getElementById('pendaftaranForm').reset();
        document.getElementById('nama-file-terpilih').innerText = "No file chosen";
        submitBtn.disabled = false;
        submitBtn.innerText = "Daftarkan Santri";
      })
      .catch(function(err) {
        msgDiv.className = "mt-4 p-3 rounded text-xs font-semibold block error";
        msgDiv.innerText = "Gagal mengirim data: " + err.toString();
        submitBtn.disabled = false;
        submitBtn.innerText = "Daftarkan Santri";
      });
    }
  </script>
</body>
</html>
