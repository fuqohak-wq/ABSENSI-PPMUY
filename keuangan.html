<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Bendahara Pusat & Tabungan</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #0d9488;
      --bg: #f8fafc;
      --text: #1e293b;
      --card-bg: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 30px; padding: 20px; background: var(--primary); color: white; rounded-radius: 8px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    
    .alert-box { background: #fef3c7; border-left: 5px solid #d97706; padding: 15px; border-radius: 6px; margin-bottom: 25px; display: none; }
    .alert-box.active { display: block; }
    .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-orange { background: #d97706; }
    
    .grid { display: block; margin-top: 20px; }
    .card { background: var(--card-bg); padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 25px; }
    .card h2 { margin-bottom: 15px; color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; font-size: 18px; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
    
    .search-results { max-height: 200px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 6px; margin-top: 5px; background: white; }
    .search-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
    .search-item:hover { background: #f1f5f9; }
    
    .info-saldo { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 15px; border-radius: 6px; margin-top: 15px; display: none; }
    .info-saldo.active { display: block; }
    .info-saldo table { width: 100%; border-collapse: collapse; margin-top: 5px; }
    .info-saldo td { padding: 5px 0; font-size: 15px; }
    
    .status-msg { margin-top: 10px; font-weight: 600; font-size: 14px; }
    .text-success { color: #16a34a; }
    .text-danger { color: #dc2626; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>DASHBOARD BENDAHARA PUSAT</h1>
    <p>Integrasi Pendaftaran Santri Baru & Input Tabungan Santri</p>
  </header>

  <div id="nyaiAlert" class="alert-box">
    <h3 style="margin-bottom: 5px; color: #92400e;">🔔 Pemberitahuan Setoran Santri Baru (Nyai)</h3>
    <p style="margin-bottom: 10px;" id="nyaiAlertText">Sedang memeriksa data pendaftaran...</p>
    <button id="btnProsesNyai" class="btn btn-orange" onclick="prosesSetoranNyai()" style="display:none;">Proses & Setor ke Nyai Sekarang</button>
  </div>

  <div class="grid">
    <div class="card">
      <h2>✍️ Input Tabungan & Cek Saldo Santri</h2>
      
      <div class="form-group">
        <label for="searchKey">Cari Nama / Scan Barcode NIK Santri:</label>
        <input type="text" id="searchKey" placeholder="Ketik nama lengkap atau scan NIK..." oninput="cariSantri(this.value)">
        <div id="searchResults" class="search-results" style="display:none;"></div>
      </div>

      <div id="infoSaldoBox" class="info-saldo">
        <strong style="color: #166534;">📋 Profil & Tabungan Santri Terpilih:</strong>
        <table>
          <tr><td style="width: 30%; font-weight:600;">NIK:</td><td id="viewNik">-</td></tr>
          <tr><td style="font-weight:600;">Nama:</td><td id="viewNama">-</td></tr>
          <tr><td style="font-weight:600;">Gender:</td><td id="viewGender">-</td></tr>
          <tr><td style="font-weight:600; color: #15803d;">Total Saldo:</td><td id="viewSaldo" style="font-weight:bold; color: #15803d; font-size: 18px;">Rp 0</td></tr>
        </table>
      </div>

      <div class="form-group" style="margin-top: 20px;">
        <label for="nominalTabungan">Nominal Tabungan Baru (Rp):</label>
        <input type="number" id="nominalTabungan" placeholder="Contoh: 5000" disabled>
      </div>

      <button id="btnSimpanTabungan" class="btn" onclick="simpanTabungan()" disabled>Simpan Transaksi Tabungan</button>
      <div id="tabunganStatus" class="status-msg"></div>
    </div>
  </div>
</div>

<script>
  // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA SETELAH DI-DEPLOY AS WEBAPP
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbydgX_DYVHmJUtNPxdryj_sbo2miXRyvC3jU_IPHogludeVPMPK4iPAnWbWu0dHU_dS/exec";

  let santriTerpilih = null;

  // Ambil notifikasi pendaftaran santri baru saat halaman dibuka
  window.onload = function() {
    fetchNotification();
  };

  function fetchNotification() {
    const alertBox = document.getElementById("nyaiAlert");
    const alertText = document.getElementById("nyaiAlertText");
    const btnProses = document.getElementById("btnProsesNyai");

    alertBox.classList.add("active");

    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getNotificationData" })
    })
    .then(res => res.json())
    .then(response => {
      if(response.success) {
        const info = response.data;
        if(info.jumlahSantriBaru > 0) {
          alertText.innerHTML = `Terdeteksi ada <b>${info.jumlahSantriBaru} santri baru</b> di tahun 2026 yang belum disetor ke Nyai.<br>Total estimasi nilai kewajiban setoran: <b>Rp ${info.totalSetoranNyai.toLocaleString('id-ID')}</b>`;
          btnProses.style.display = "inline-block";
        } else {
          alertText.innerHTML = "Semua data pendaftaran santri baru tahun 2026 sudah sinkron & terekam di pusat Nyai.";
          btnProses.style.display = "none";
        }
      } else {
        alertText.innerText = "Gagal memuat notifikasi pendaftaran.";
      }
    }).catch(() => {
      alertText.innerText = "Gagal terhubung dengan database pusat.";
    });
  }

  function prosesSetoranNyai() {
    const btnProses = document.getElementById("btnProsesNyai");
    btnProses.innerText = "Memproses...";
    btnProses.disabled = true;

    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "processSantriBaru" })
    })
    .then(res => res.json())
    .then(response => {
      if(response.success) {
        alert("Sukses memproses " + response.data.processedCount + " data setoran santri baru ke Nyai!");
        fetchNotification();
      } else {
        alert("Terjadi kesalahan sistem saat memproses.");
        btnProses.disabled = false;
        btnProses.innerText = "Proses & Setor ke Nyai Sekarang";
      }
    });
  }

  function cariSantri(val) {
    const resDiv = document.getElementById("searchResults");
    if(val.trim().length < 2) { resDiv.style.display = "none"; return; }

    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "searchSantri", keyword: val })
    })
    .then(res => res.json())
    .then(response => {
      if(response.success && response.data.length > 0) {
        resDiv.innerHTML = "";
        resDiv.style.display = "block";
        response.data.forEach(item => {
          let div = document.createElement("div");
          div.className = "search-item";
          div.innerHTML = `<b>${item.nama}</b> - ${item.nik} (${item.gender})`;
          div.onclick = function() { pilihSantri(item); };
          resDiv.appendChild(div);
        });
      } else {
        resDiv.style.display = "none";
      }
    });
  }

  function pilihSantri(santri) {
    santriTerpilih = santri;
    document.getElementById("searchResults").style.display = "none";
    document.getElementById("searchKey").value = santri.nama;

    // Tampilkan kartu info saldo
    document.getElementById("viewNik").innerText = santri.nik;
    document.getElementById("viewNama").innerText = santri.nama;
    document.getElementById("viewGender").innerText = santri.gender;
    document.getElementById("viewSaldo").innerText = "Rp " + santri.saldo.toLocaleString('id-ID');
    document.getElementById("infoSaldoBox").classList.add("active");

    // Aktifkan input nominal
    document.getElementById("nominalTabungan").disabled = false;
    document.getElementById("btnSimpanTabungan").disabled = false;
    document.getElementById("nominalTabungan").focus();
  }

  function simpanTabungan() {
    const nominal = document.getElementById("nominalTabungan").value;
    const statusDiv = document.getElementById("tabunganStatus");
    const btn = document.getElementById("btnSimpanTabungan");

    if(!nominal || nominal <= 0) {
      statusDiv.innerHTML = "<span class='text-danger'>Masukkan nominal tabungan valid!</span>";
      return;
    }

    btn.disabled = true;
    btn.innerText = "Menyimpan...";
    statusDiv.innerHTML = "";

    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({ action: "submitTabungan", nik: santriTerpilih.nik, nominal: nominal })
    })
    .then(res => res.json())
    .then(response => {
      btn.disabled = false;
      btn.innerText = "Simpan Transaksi Tabungan";
      
      if(response.success) {
        statusDiv.innerHTML = `<span class='text-success'>Sukses! Tabungan ${response.data.nama} berhasil direkam. Saldo terbaru: Rp ${response.data.saldoAkhir.toLocaleString('id-ID')}</span>`;
        
        // Perbarui info tampilan saldo terbaru santri tersebut
        document.getElementById("viewSaldo").innerText = "Rp " + response.data.saldoAkhir.toLocaleString('id-ID');
        document.getElementById("nominalTabungan").value = "";
      } else {
        statusDiv.innerHTML = `<span class='text-danger'>Gagal menyimpan: ${response.error}</span>`;
      }
    }).catch(() => {
      btn.disabled = false;
      btn.innerText = "Simpan Transaksi Tabungan";
      statusDiv.innerHTML = "<span class='text-danger'>Masalah koneksi internet.</span>";
    });
  }
</script>
</body>
</html>
