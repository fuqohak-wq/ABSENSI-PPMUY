<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendataan Santri PPMUY</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 font-sans">

    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <header class="bg-green-700 text-white p-6 text-center">
            <h1 class="text-xl font-bold tracking-wide">Formulir Pendataan PPMUY</h1>
            <p class="text-xs text-green-100 mt-1">Sistem Otomatisasi Database Cloud Google Drive & Sheets</p>
        </header>

        <form id="formData" onsubmit="prosesSebelumKirim(event)" class="p-6 space-y-4">
            
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nama Lengkap</label>
                <input type="text" id="nama" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Alamat Rumah</label>
                <textarea id="alamat" required rows="2" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">NIK (Sesuai KTP/KK)</label>
                    <input type="number" id="nik" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Tanggal Lahir</label>
                    <input type="date" id="tgl_lahir" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">No. HP / WhatsApp</label>
                    <input type="tel" id="no_hp" required placeholder="Contoh: 08123456789" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Gender</label>
                    <select id="gender" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-green-600">
                        <option value="">-- Pilih --</option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Kelas</label>
                    <input type="text" id="kelas" required placeholder="Contoh: 10-A" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Asrama</label>
                    <input type="text" id="asrama" required placeholder="Contoh: Sunan Ampel" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Tahun Masuk</label>
                    <input type="number" id="masuk" required placeholder="Contoh: 2024" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Nama Orang Tua / Wali</label>
                <input type="text" id="orang_tua" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Upload Foto Santri (Maksimal 2MB)</label>
                <input type="file" id="fotoFile" accept="image/*" required class="w-full px-2 py-1.5 text-sm border border-slate-300 rounded-lg bg-slate-50 focus:outline-none file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-green-100 file:text-green-700 hover:file:bg-green-200">
            </div>

            <div class="pt-4">
                <button type="submit" id="btnSubmit" class="w-full bg-green-700 hover:bg-green-800 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 shadow-md">
                    🚀 Kirim Data & Upload Foto
                </button>
            </div>
        </form>
    </div>

    <script>
        // URL DEPLOY GOOGLE SCRIPT PERMANEN ANDA
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzQBNTmZT3JSEkqNuVFDMnusi2pqUiEu91fgsh3dL2qpx3LlbjP64tkFMO9Y8o_6j8_oA/exec";

        function prosesSebelumKirim(event) {
            event.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            const fileInput = document.getElementById('fotoFile');
            const file = fileInput.files[0];

            btn.innerText = "⏳ Memproses berkas gambar...";
            btn.disabled = true;

            if (file && file.size > 2 * 1024 * 1024) {
                alert("Gagal! Ukuran file foto terlalu besar (Maksimal 2MB).");
                btn.innerText = "🚀 Kirim Data & Upload Foto";
                btn.disabled = false;
                return;
            }

            if (file) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function () {
                    eksekusiKirimSemuaData(reader.result, file.name);
                };
                reader.onerror = function (error) {
                    alert("Gagal membaca file foto: " + error);
                    btn.disabled = false;
                };
            } else {
                eksekusiKirimSemuaData(null, null);
            }
        }

        function eksekusiKirimSemuaData(base64Data, namaFile) {
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "⏳ Mengunggah data ke Google Cloud...";

            const payload = {
                nama: document.getElementById('nama').value,
                alamat: document.getElementById('alamat').value,
                nik: document.getElementById('nik').value,
                tgl_lahir: document.getElementById('tgl_lahir').value,
                no_hp: document.getElementById('no_hp').value,
                gender: document.getElementById('gender').value,
                kelas: document.getElementById('kelas').value,
                asrama: document.getElementById('asrama').value,
                masuk: document.getElementById('masuk').value,
                orang_tua: document.getElementById('orang_tua').value,
                foto_base64: base64Data,
                foto_nama: namaFile
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(hasil => {
                if(hasil.status === 'success') {
                    alert("Alhamdulillah! Seluruh data beserta berkas foto pendaftaran sukses disimpan!");
                    document.getElementById('formData').reset();
                } else {
                    alert("Error Aplikasi: " + hasil.message);
                }
            })
            .catch(err => {
                console.error("Terjadi Hambatan:", err);
                alert("Koneksi gagal! Pastikan Web App Anda sudah di-deploy dengan benar.");
            })
            .finally(() => {
                btn.innerText = "🚀 Kirim Data & Upload Foto";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
