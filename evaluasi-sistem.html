<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Takziran & Poin Harian - E-Pesantren</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, header, div, section, button, table, td, th, footer, input, select {
            transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
        }
        
        /* Tema Gelap Elegan */
        .theme-dark {
            --bg-main: #0f172a;
            --bg-header: #020617;
            --bg-box: #020617;
            --bg-inner: #0f172a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --border-row: #020617;
            --text-row: #cbd5e1;
            --text-name: #ffffff;
        }

        /* PREMIUM CREATIVE MODE SIANG: Kombinasi Ocean Sapphire & Clean White */
        .theme-light {
            --bg-main: #1e40af;      /* Latar Belakang Utama: Biru Sapphire Tajam & Hidup */
            --bg-header: #0f172a;    /* Header Kontras Gelap agar Tombol & Judul Menyala */
            --bg-box: #ffffff;       /* Panel Putih Berkilau Kontras Tinggi */
            --bg-inner: #f0f6ff;     /* Background Dropdown Biru Segar Lembut */
            --text-main: #1e3a8a;    /* Teks Utama Navy Pekat */
            --text-muted: #3b82f6;   /* Label Dropdown Biru Elektrik */
            --border-color: #dbeafe; /* Pembatas Elegan */
            --border-row: #f1f5f9;   /* Baris Tabel Bersih */
            --text-row: #334155;     /* Deskripsi Sanksi Abu Gelap Nyaman Dibaca */
            --text-name: #0f172a;    /* Nama Santri Hitam Tegas */
        }

        body { background-color: var(--bg-main); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; }
        .dynamic-bg-main { background-color: var(--bg-main); }
        .dynamic-bg-header { background-color: var(--bg-header); }
        .dynamic-bg-box { background-color: var(--bg-box); }
        .dynamic-bg-inner { background-color: var(--bg-inner); }
        .dynamic-text-main { color: var(--text-main); }
        .dynamic-text-muted { color: var(--text-muted); }
        .dynamic-border { border-color: var(--border-color); }
        .dynamic-border-row { border-color: var(--border-row); }
        .dynamic-text-row { color: var(--text-row); }

        /* Efek Gradasi Estetik khusus Mode Siang agar tidak monoton flat */
        .theme-light-gradient {
            background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 50%, #1e3a8a 100%);
        }

        @media print {
            body * { visibility: hidden; background: transparent !important; color: #000 !important; }
            #area-cetak, #area-cetak * { visibility: visible; }
            #area-cetak { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
            .badge-print { border: 1px solid #000 !important; color: #000 !important; background: transparent !important; }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    </style>
</head>
<body id="body-app" class="theme-dark min-h-screen flex flex-col justify-between antialiased">

    <header class="w-full dynamic-bg-header border-b-4 border-yellow-400 px-4 sm:px-6 py-4 flex justify-between items-center shadow-md no-print">
        <div class="flex items-center gap-3">
            <a href="dashboard.html" class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-yellow-400 border border-slate-700 shadow-sm hover:bg-slate-700 transition-all">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </a>
            <div>
                <h1 class="text-xs sm:text-sm font-black tracking-wide text-yellow-500 uppercase">REKAP TAKZIRAN & POIN KEDISIPLINAN</h1>
                <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-black tracking-widest block w-max uppercase mt-0.5">SISTEM INTEGRASI</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleTema()" id="btn-tema" class="w-10 h-10 rounded-xl bg-slate-800 hover:scale-105 flex items-center justify-center cursor-pointer transition-all border border-slate-700 shadow text-amber-500">
                <i class="fa-solid fa-sun text-base"></i>
            </button>
            <button onclick="window.print()" class="w-10 h-10 rounded-xl bg-slate-800 hover:scale-105 text-sky-400 flex items-center justify-center cursor-pointer transition-all border border-slate-700 shadow" title="Cetak PDF/Kertas">
                <i class="fa-solid fa-print"></i>
            </button>
        </div>
    </header>

    <main id="area-cetak" class="w-full max-w-7xl mx-auto p-4 sm:p-6 flex flex-col gap-5 flex-1">
        
        <div class="hidden print:flex flex-col items-center text-center border-b-4 border-double border-slate-900 pb-4 mb-4">
            <h2 class="text-lg font-black tracking-wide uppercase">PONDOK PESANTREN MODERN PUSAT YOGYAKARTA (PPMUY)</h2>
            <p class="text-xs font-bold tracking-wider text-slate-600 uppercase">Laporan Rekapitulasi Poin Kedisiplinan & Takzir Edukatif Santri</p>
            <p id="print-tanggal" class="text-[10px] font-mono mt-1 text-slate-500">Tanggal Cetak: --:--:--</p>
        </div>

        <section class="dynamic-bg-box border dynamic-border rounded-2xl p-5 flex flex-col gap-4 shadow-xl no-print">
            <div class="grid grid-cols-2 md:flex md:flex-wrap items-center gap-4 w-full">
                
                <div class="flex flex-col gap-1.5 w-full md:w-auto md:flex-1 md:min-w-[150px]">
                    <label class="text-[10px] font-black tracking-wider dynamic-text-muted uppercase">Golongan</label>
                    <select id="filter-golongan" onchange="filterDanRenderData()" class="w-full dynamic-bg-inner border dynamic-border text-xs font-bold px-3 py-2.5 rounded-xl text-slate-800 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                        <option value="SEMUA">-- ALL GOLONGAN --</option>
                        <option value="SANTRI" selected>SANTRI MURNI</option>
                        <option value="USTADZ">USTADZ / PENGURUS</option>
                    </select>
                </div>

                <div class="flex flex-col gap-1.5 w-full md:w-auto md:flex-1 md:min-w-[150px]">
                    <label class="text-[10px] font-black tracking-wider dynamic-text-muted uppercase">Spesifik Kelas</label>
                    <select id="filter-kelas" onchange="filterDanRenderData()" class="w-full dynamic-bg-inner border dynamic-border text-xs font-bold px-3 py-2.5 rounded-xl text-slate-800 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                        <option value="SEMUA" selected>-- ALL KELAS --</option>
                    </select>
                </div>

                <div class="flex flex-col gap-1.5 w-full md:w-auto md:flex-1 md:min-w-[130px]">
                    <label class="text-[10px] font-black tracking-wider dynamic-text-muted uppercase">Gender / Asrama</label>
                    <select id="filter-gender" onchange="filterDanRenderData()" class="w-full dynamic-bg-inner border dynamic-border text-xs font-bold px-3 py-2.5 rounded-xl text-slate-800 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                        <option value="SEMUA" selected>-- ALL GENDER --</option>
                        <option value="LAKI-LAKI">PUTRA (Banin)</option>
                        <option value="PEREMPUAN">PUTRI (Banat)</option>
                    </select>
                </div>

                <div class="flex flex-col gap-1.5 w-full md:w-auto md:flex-1 md:min-w-[160px] col-span-2">
                    <label class="text-[10px] font-black tracking-wider dynamic-text-muted uppercase">Status Sanksi Harian</label>
                    <select id="filter-status" onchange="filterDanRenderData()" class="w-full dynamic-bg-inner border dynamic-border text-xs font-bold px-3 py-2.5 rounded-xl text-slate-800 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                        <option value="SEMUA" selected>-- ALL STATUS --</option>
                        <option value="AMAN">🟢 AMAN</option>
                        <option value="TEGURAN RINGAN">🟡 TEGURAN RINGAN</option>
                        <option value="TAKZIR SEDANG">🟠 TAKZIR SEDANG</option>
                        <option value="PERINGATAN KERAS">🔴 PERINGATAN KERAS</option>
                        <option value="PELANGGARAN BERAT">🚨 PELANGGARAN BERAT</option>
                        <option value="DARURAT / EVALUASI">⚫ DARURAT / EVALUASI</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-col gap-1.5 w-full">
                <label class="text-[10px] font-black tracking-wider dynamic-text-muted uppercase">Cari Nama / NIK</label>
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400"><i class="fa-solid fa-magnifying-glass text-xs"></i></span>
                    <input type="text" id="cari-nama" oninput="filterDanRenderData()" placeholder="Ketik nama atau NIK santri..." class="w-full dynamic-bg-inner border dynamic-border text-xs font-bold pl-10 pr-4 py-2.5 rounded-xl text-slate-800 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
        </section>

        <section class="dynamic-bg-box border dynamic-border rounded-2xl p-2 sm:p-5 shadow-xl flex-1 flex flex-col">
            <div class="overflow-x-hidden flex-1">
                <table class="w-full text-left border-collapse">
                    <tbody id="tbl-rekap-body" class="divide-y dynamic-border-row font-bold dynamic-text-row">
                        <tr>
                            <td class="py-12 text-center text-slate-400 uppercase font-bold tracking-widest text-xs italic">
                                <i class="fa-solid fa-spinner animate-spin text-lg text-yellow-500 block mb-2"></i>
                                Menyinkronkan Data Matang Akademik Server...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer class="w-full text-center py-3 text-[9px] dynamic-text-muted font-extrabold tracking-widest border-t dynamic-border dynamic-bg-header no-print">
        SISTEM VALIDASI TAKZIR OTOMATIS HUB • @2026
    </footer>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyc_0bhZqj8hJrlsbAUGVEwuG8SQPIsoULYXHPFN81CyUdWsVy0i2xI2Gf_0pzGWV4A6Q/exec";
        let masterDataMentah = [];

        window.addEventListener('DOMContentLoaded', () => {
            const nama = localStorage.getItem('session_nama');
            const role = localStorage.getItem('session_role');
            if (!nama || !role) { window.location.href = "index.html"; return; }

            const temaSimpanan = localStorage.getItem('dashboard_theme') || 'theme-dark';
            setTemaAplikasi(temaSimpanan);

            const opsiWaktu = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('print-tanggal').innerText = `Tanggal Cetak Dokumen: ${new Date().toLocaleDateString('id-ID', opsiWaktu)} WIB`;

            ambilDataRekapSheet();
        });

        async function ambilDataRekapSheet() {
            try {
                let res = await fetch(`${API_URL}?aksi=ambil_rekap_takziran_harian`);
                let r = await res.json();
                
                if (Array.isArray(r)) {
                    masterDataMentah = r;
                } else if (r.status === "success" || r.data) {
                    masterDataMentah = r.data;
                } else {
                    throw new Error(r.message || "Gagal memproses struktur data json.");
                }

                inisialisasiFilterKelasDinamis();
                filterDanRenderData();

            } catch (err) {
                console.error(err);
                document.getElementById('tbl-rekap-body').innerHTML = `<tr><td class="py-10 text-center text-red-500 font-black uppercase text-xs tracking-wider">Gagal Menyinkronkan Log Rekap Takziran Server.</td></tr>`;
            }
        }

        function dapatkanWarnaBadge(status) {
            const s = String(status).toUpperCase();
            if (s.includes("AMAN")) return "bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 font-black";
            if (s.includes("TEGURAN")) return "bg-amber-500/15 text-amber-600 dark:text-amber-400 font-black";
            if (s.includes("SEDANG")) return "bg-orange-500/15 text-orange-600 dark:text-orange-400 font-black";
            if (s.includes("KERAS")) return "bg-rose-500/15 text-rose-600 dark:text-rose-400 font-black";
            if (s.includes("BERAT")) return "bg-red-600 text-white font-black";
            return "bg-slate-900 text-yellow-400 border border-yellow-500"; 
        }

        function inisialisasiFilterKelasDinamis() {
            const selectKelas = document.getElementById('filter-kelas');
            if (!selectKelas) return;

            const nilaiSekarang = selectKelas.value;
            selectKelas.innerHTML = '<option value="SEMUA">-- ALL KELAS --</option>';

            if (!masterDataMentah || masterDataMentah.length === 0) return;

            let daftarKelasUnik = [];
            masterDataMentah.forEach(item => {
                let kelasRaw = String(item["Kelas/Golongan"] || item.kelas || "").trim();
                let kelasUpper = kelasRaw.toUpperCase();
                
                if (kelasRaw) {
                    if (!daftarKelasUnik.includes(kelasUpper)) {
                        daftarKelasUnik.push(kelasUpper);
                    }
                }
            });

            daftarKelasUnik.sort((a, b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'}));

            daftarKelasUnik.forEach(kls => {
                let opt = document.createElement('option');
                opt.value = kls;
                // Jika data mengandung kata USTADZ/PENGURUS, tidak perlu ditambah embel-embel tulisan "KELAS" di depannya
                if (kls.includes("USTADZ") || kls.includes("PENGURUS")) {
                    opt.textContent = kls;
                } else {
                    opt.textContent = `KELAS ${kls}`;
                }
                selectKelas.appendChild(opt);
            });

            if (nilaiSekarang) selectKelas.value = nilaiSekarang;
        }

        function filterDanRenderData() {
            const tblBody = document.getElementById('tbl-rekap-body');
            const golSelected = document.getElementById('filter-golongan').value;
            const kelasSelected = document.getElementById('filter-kelas') ? document.getElementById('filter-kelas').value : "SEMUA";
            const genSelected = document.getElementById('filter-gender').value;
            const statusSelected = document.getElementById('filter-status').value;
            const cariKeyword = document.getElementById('cari-nama').value.toUpperCase();

            if (!tblBody) return;
            tblBody.innerHTML = '';

            if (!masterDataMentah || masterDataMentah.length === 0) {
                tblBody.innerHTML = `<tr><td class="py-10 text-center text-slate-400 uppercase font-black text-[10px] tracking-wider">Data kosong atau belum tersinkronisasi dari server.</td></tr>`;
                return;
            }

            let dataTersaring = masterDataMentah.filter(item => {
                const itemGolongan = String(item["Kelas/Golongan"] || item.kelas || "").toUpperCase();
                const itemGender = String(item.gender || item.Gender || "").toUpperCase();
                const itemNama = String(item.nama || item.Nama || "").toUpperCase();
                const itemNik = String(item.nik || item.NIK || "");
                const itemStatus = String(item["Status (Harian)"] || item.status || "").toUpperCase();

                let matchGol = false;
                if (golSelected === "SEMUA") {
                    matchGol = true;
                } else if (golSelected === "SANTRI") {
                    matchGol = (!itemGolongan.includes("USTADZ") && !itemGolongan.includes("PENGURUS"));
                } else if (golSelected === "USTADZ") {
                    matchGol = (itemGolongan.includes("USTADZ") || itemGolongan.includes("PENGURUS"));
                }

                let matchKelas = (kelasSelected === "SEMUA" || itemGolongan === kelasSelected);
                let matchGen = (genSelected === "SEMUA" || itemGender === genSelected);
                let matchCari = (itemNama.includes(cariKeyword) || itemNik.includes(cariKeyword));
                let matchStatus = (statusSelected === "SEMUA" || itemStatus.includes(statusSelected));

                return matchGol && matchKelas && matchGen && matchCari && matchStatus;
            });

            if (dataTersaring.length === 0) {
                tblBody.innerHTML = `<tr><td class="py-10 text-center text-slate-400 uppercase font-black text-[10px] tracking-wider">Tidak ada data santri yang cocok dengan filter.</td></tr>`;
                return;
            }

            dataTersaring.forEach(item => {
                const nama = item.nama || item.Nama || "-";
                const poinHarian = item["Poin Harian"] !== undefined ? item["Poin Harian"] : (item.poin_harian !== undefined ? item.poin_harian : 0);
                const poinMingguanStr = item["Poin Mingguan + Status"] || item.poin_mingguan || "0 (AMAN)";
                const isiTakziran = item["Isi Takziran (Harian)"] || item.isi_takziran_harian || "Pertahankan kedisiplinan.";
                const statusStr = item["Status (Harian)"] || item.status || "AMAN";

                let tr = document.createElement('tr');
                tr.className = "border-b dynamic-border-row hover:bg-blue-500/5 transition-colors";
                
                let warnaBadge = dapatkanWarnaBadge(statusStr);

                tr.innerHTML = `
                    <td class="py-4 px-3 sm:px-5 block w-full">
                        <div class="flex items-center justify-between gap-3 w-full">
                            <div class="truncate max-w-[50%]">
                                <span class="font-black text-sm tracking-wide uppercase block truncate" style="color: var(--text-name);">${nama}</span>
                            </div>
                            <div class="flex items-center gap-2 sm:gap-4 shrink-0">
                                <div class="text-right">
                                    <span class="block text-[8px] tracking-wider uppercase opacity-60 text-slate-400 dark:text-slate-400 font-extrabold">Hari Ini</span>
                                    <span class="text-xs font-black ${parseInt(poinHarian) > 0 ? 'text-rose-500' : 'text-emerald-500'}">${poinHarian} Pts</span>
                                </div>
                                <div class="h-6 w-[1px] bg-slate-300 dark:bg-slate-700"></div>
                                <div class="text-left">
                                    <span class="block text-[8px] tracking-wider uppercase opacity-60 text-slate-400 dark:text-slate-400 font-extrabold">Mingguan</span>
                                    <span class="text-xs font-black text-blue-600 dark:text-blue-400">${poinMingguanStr}</span>
                                </div>
                                <span class="badge-print px-2 py-1 rounded-lg text-[8px] font-black tracking-wider inline-block ${warnaBadge} uppercase shrink-0 ml-1 shadow-sm">
                                    ${statusStr.replace('AMN', 'AMAN').toUpperCase()}
                                </span>
                            </div>
                        </div>
                        
                        <div class="text-[11px] font-medium leading-relaxed mt-2 pl-0.5 flex items-start gap-1.5 opacity-90" style="color: var(--text-row);">
                            <span class="text-amber-500 shrink-0 font-bold">❯</span>
                            <span class="italic break-words w-full font-semibold">${isiTakziran}</span>
                        </div>
                    </td>
                `;
                tblBody.appendChild(tr);
            });
        }

        function toggleTema() {
            const currentTheme = document.body.classList.contains('theme-dark') ? 'theme-dark' : 'theme-light';
            const newTheme = (currentTheme === 'theme-dark') ? 'theme-light' : 'theme-dark';
            setTemaAplikasi(newTheme);
        }

        function setTemaAplikasi(tema) {
            const btnTema = document.getElementById('btn-tema');
            const bodyApp = document.getElementById('body-app');
            
            if (tema === 'theme-light') {
                document.body.classList.remove('theme-dark');
                document.body.classList.add('theme-light');
                if(bodyApp) bodyApp.classList.add('theme-light-gradient'); // Tambah gradasi mewah
                if(btnTema) btnTema.innerHTML = `<i class="fa-solid fa-moon text-blue-400"></i>`;
                localStorage.setItem('dashboard_theme', 'theme-light');
            } else {
                document.body.classList.remove('theme-light');
                document.body.classList.remove('theme-light-gradient');
                document.body.classList.add('theme-dark');
                if(btnTema) btnTema.innerHTML = `<i class="fa-solid fa-sun text-amber-400"></i>`;
                localStorage.setItem('dashboard_theme', 'theme-dark');
            }
            filterDanRenderData();
        }
    </script>
</body>
</html>
