<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Takziran & Poin Harian - E-Pesantren</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, header, div, section, button, table, td, th, footer, input, select {
            transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
        }
        
        .theme-dark {
            --bg-main: #0f172a;
            --bg-header: #020617;
            --bg-box: #020617;
            --bg-inner: #0f172a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --border-row: #020617;
            --text-row: #cbd5e1;
        }

        .theme-light {
            --bg-main: #f0f4f8;
            --bg-header: #ffffff;
            --bg-box: #ffffff;
            --bg-inner: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --border-row: #f1f5f9;
            --text-row: #334155;
        }

        body { background-color: var(--bg-main); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; }
        .dynamic-bg-main { background-color: var(--bg-main); }
        .dynamic-bg-header { background-color: var(--bg-header); }
        .dynamic-bg-box { background-color: var(--bg-box); }
        .dynamic-bg-inner { background-color: var(--bg-inner); }
        .dynamic-text-main { color: var(--text-main); }
        .dynamic-text-muted { color: var(--text-muted); }
        .dynamic-border { border-color: var(--border-color); }
        .dynamic-border-row { border-color: var(--border-row); }
        .dynamic-text-row { color: var(--text-row); }

        /* Batasi tinggi teks takziran agar seragam dan rapi di layar hp */
        .truncate-two-lines {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media print {
            body * { visibility: hidden; background: transparent !important; color: #000 !important; }
            #area-cetak, #area-cetak * { visibility: visible; }
            #area-cetak { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
            .badge-print { border: 1px solid #000 !important; color: #000 !important; background: transparent !important; }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="theme-dark min-h-screen flex flex-col justify-between antialiased">

    <header class="w-full dynamic-bg-header border-b-4 border-yellow-400 px-4 sm:px-6 py-4 flex justify-between items-center shadow-sm no-print">
        <div class="flex items-center gap-3">
            <a href="dashboard.html" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-yellow-400 border dynamic-border shadow-sm">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </a>
            <div>
                <h1 class="text-xs sm:text-sm font-black tracking-wide text-yellow-500 uppercase">REKAP TAKZIRAN & POIN KEDISIPLINAN</h1>
                <span class="text-[9px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded-full font-black tracking-widest block w-max uppercase mt-0.5">SISTEM INTEGRASI</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleTema()" id="btn-tema" class="w-10 h-10 rounded-xl bg-slate-800 hover:scale-105 flex items-center justify-center cursor-pointer transition-all border dynamic-border shadow text-amber-400">
                <i class="fa-solid fa-sun text-base"></i>
            </button>
            <button onclick="window.print()" class="w-10 h-10 rounded-xl bg-slate-800 hover:scale-105 text-sky-400 flex items-center justify-center cursor-pointer transition-all border dynamic-border shadow" title="Cetak PDF/Kertas">
                <i class="fa-solid fa-print"></i>
            </button>
        </div>
    </header>

    <main id="area-cetak" class="w-full max-w-7xl mx-auto p-4 sm:p-6 flex flex-col gap-4 flex-1">
        
        <div class="hidden print:flex flex-col items-center text-center border-b-4 border-double border-slate-900 pb-4 mb-4">
            <h2 class="text-lg font-black tracking-wide uppercase">PONDOK PESANTREN MODERN PUSAT YOGYAKARTA (PPMUY)</h2>
            <p class="text-xs font-bold tracking-wider text-slate-600 uppercase">Laporan Rekapitulasi Poin Kedisiplinan & Takzir Edukatif Santri</p>
            <p id="print-tanggal" class="text-[10px] font-mono mt-1 text-slate-500">Tanggal Cetak: --:--:--</p>
        </div>

        <section class="dynamic-bg-box border dynamic-border rounded-2xl p-4 flex flex-col gap-3 justify-between shadow-sm no-print">
            <div class="grid grid-cols-2 md:flex md:flex-wrap items-center gap-3 w-full">
                
                <div class="flex flex-col gap-1 w-full md:w-auto md:flex-1 md:min-w-[150px]">
                    <label class="text-[9px] font-black tracking-wider text-slate-400 uppercase">Golongan</label>
                    <select id="filter-golongan" onchange="filterDanRenderData()" class="w-full dynamic-bg-inner border dynamic-border text-xs font-bold px-3 py-2 rounded-xl text-slate-300 focus:outline-none focus:border-yellow-500 cursor-pointer">
                        <option value="SEMUA">-- ALL GOLONGAN --</option>
                        <option value="SANTRI" selected>SANTRI MURNI</option>
                        <option value="USTADZ">USTADZ / PENGURUS</option>
                    </select>
                </div>

                <div class="flex flex-col gap-1 w-full md:w-auto md:flex-1 md:min-w-[150px]">
                    <label class="text-[9px] font-black tracking-wider text-slate-400 uppercase">Spesifik Kelas</label>
                    <select id="filter-kelas" onchange="filterDanRenderData()" class="w-full dynamic-bg-inner border dynamic-border text-xs font-bold px-3 py-2 rounded-xl text-slate-300 focus:outline-none focus:border-yellow-500 cursor-pointer">
                        <option value="SEMUA" selected>-- ALL KELAS --</option>
                    </select>
                </div>

                <div class="flex flex-col gap-1 w-full md:w-auto md:flex-1 md:min-w-[130px]">
                    <label class="text-[9px] font-black tracking-wider text-slate-400 uppercase">Gender / Asrama</label>
                    <select id="filter-gender" onchange="filterDanRenderData()" class="w-full dynamic-bg-inner border dynamic-border text-xs font-bold px-3 py-2 rounded-xl text-slate-300 focus:outline-none focus:border-yellow-500 cursor-pointer">
                        <option value="SEMUA" selected>-- ALL GENDER --</option>
                        <option value="L">LAKI-LAKI</option>
                        <option value="P">PEREMPUAN</option>
                    </select>
                </div>

                <div class="flex flex-col gap-1 w-full md:w-auto md:flex-1 md:min-w-[160px] col-span-2">
                    <label class="text-[9px] font-black tracking-wider text-slate-400 uppercase">Status Sanksi Harian</label>
                    <select id="filter-status" onchange="filterDanRenderData()" class="w-full dynamic-bg-inner border dynamic-border text-xs font-bold px-3 py-2 rounded-xl text-slate-300 focus:outline-none focus:border-yellow-500 cursor-pointer">
                        <option value="SEMUA" selected>-- ALL STATUS --</option>
                        <option value="AMAN">🟢 AMAN</option>
                        <option value="TEGURAN RINGAN">🟡 TEGURAN RINGAN</option>
                        <option value="TAKZIR SEDANG">🟠 TAKZIR SEDANG</option>
                        <option value="PERINGATAN KERAS">🔴 PERINGATAN KERAS</option>
                        <option value="PELANGGARAN BERAT">🚨 PELANGGARAN BERAT</option>
                        <option value="DARURAT / EVALUASI">⚫ DARURAT / EVALUASI</option>
                    </select>
                </div>
            </div>

            <div class="flex flex-col gap-1 w-full">
                <label class="text-[9px] font-black tracking-wider text-slate-400 uppercase">Cari Nama / NIK</label>
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-magnifying-glass text-xs"></i></span>
                    <input type="text" id="cari-nama" oninput="filterDanRenderData()" placeholder="Ketik nama atau NIK santri..." class="w-full dynamic-bg-inner border dynamic-border text-xs font-bold pl-9 pr-4 py-2 rounded-xl text-slate-200 placeholder-slate-500 focus:outline-none focus:border-yellow-500">
                </div>
            </div>
        </section>

        <section class="dynamic-bg-box border dynamic-border rounded-2xl p-2 sm:p-4 shadow-sm flex-1 flex flex-col">
            <div class="overflow-x-hidden flex-1">
                <table class="w-full text-left border-collapse">
                    <tbody id="tbl-rekap-body" class="divide-y dynamic-border-row font-bold dynamic-text-row">
                        <tr>
                            <td class="py-12 text-center text-slate-400 uppercase font-bold tracking-widest text-xs italic">
                                <i class="fa-solid fa-spinner animate-spin text-lg text-yellow-500 block mb-2"></i>
                                Menyinkronkan Data Matang Akademik Server...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer class="w-full text-center py-3 text-[9px] dynamic-text-muted font-extrabold tracking-widest border-t dynamic-border dynamic-bg-header no-print">
        SISTEM VALIDASI TAKZIR OTOMATIS HUB • @2026
    </footer>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec";
        let masterDataMentah = [];

        window.addEventListener('DOMContentLoaded', () => {
            const nama = localStorage.getItem('session_nama');
            const role = localStorage.getItem('session_role');
            if (!nama || !role) { window.location.href = "index.html"; return; }

            const temaSimpanan = localStorage.getItem('dashboard_theme') || 'theme-dark';
            setTemaAplikasi(temaSimpanan);

            const opsiWaktu = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('print-tanggal').innerText = `Tanggal Cetak Dokumen: ${new Date().toLocaleDateString('id-ID', opsiWaktu)} WIB`;

            ambilDataRekapSheet();
        });

        async function ambilDataRekapSheet() {
            try {
                let res = await fetch(`${API_URL}?aksi=ambil_rekap_takziran_harian`);
                let r = await res.json();
                
                if (Array.isArray(r)) {
                    masterDataMentah = r;
                } else if (r.status === "success" || r.data) {
                    masterDataMentah = r.data;
                } else {
                    throw new Error(r.message || "Gagal memproses struktur data json.");
                }

                // Jalankan deteksi dropdown kelas otomatis & render
                inisialisasiFilterKelasDinamis();
                filterDanRenderData();

            } catch (err) {
                console.error(err);
                document.getElementById('tbl-rekap-body').innerHTML = `<tr><td class="py-10 text-center text-red-500 font-black uppercase text-xs tracking-wider">Gagal Menyinkronkan Log Rekap Takziran Server.</td></tr>`;
            }
        }

        function dapatkanWarnaBadge(status) {
            const s = String(status).toUpperCase();
            if (s.includes("AMAN")) return "bg-emerald-500/15 text-emerald-600 dark:text-emerald-400";
            if (s.includes("TEGURAN")) return "bg-amber-500/15 text-amber-600 dark:text-amber-400";
            if (s.includes("SEDANG")) return "bg-orange-500/15 text-orange-600 dark:text-orange-400";
            if (s.includes("KERAS")) return "bg-rose-500/15 text-rose-600 dark:text-rose-400";
            if (s.includes("BERAT")) return "bg-red-600 text-white dark:bg-red-950 dark:text-red-300";
            return "bg-slate-950 text-yellow-400 border border-yellow-500"; 
        }

        // Fungsi otomatis mendeteksi seluruh kelas unik yang ada di data server
        function inisialisasiFilterKelasDinamis() {
            const selectKelas = document.getElementById('filter-kelas');
            if (!selectKelas) return;

            const nilaiSekarang = selectKelas.value;
            selectKelas.innerHTML = '<option value="SEMUA">-- ALL KELAS --</option>';

            if (!masterDataMentah || masterDataMentah.length === 0) return;

            let daftarKelasUnik = [];
            masterDataMentah.forEach(item => {
                let kelasRaw = String(item["Kelas/Golongan"] || item.kelas || "").trim();
                let kelasUpper = kelasRaw.toUpperCase();
                
                if (kelasRaw && !kelasUpper.includes("USTADZ") && !kelasUpper.includes("PENGURUS")) {
                    if (!daftarKelasUnik.includes(kelasUpper)) {
                        daftarKelasUnik.push(kelasUpper);
                    }
                }
            });

            // Urutkan alfabet nama kelas agar rapi
            daftarKelasUnik.sort((a, b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'}));

            daftarKelasUnik.forEach(kls => {
                let opt = document.createElement('option');
                opt.value = kls;
                opt.textContent = `KELAS ${kls}`;
                selectKelas.appendChild(opt);
            });

            if (nilaiSekarang) selectKelas.value = nilaiSekarang;
        }

        // Fungsi utama filter dan render menggunakan struktur layout "Satu Baris, Dua Lantai" (Compact Screen)
        function filterDanRenderData() {
            const tblBody = document.getElementById('tbl-rekap-body');
            const golSelected = document.getElementById('filter-golongan').value;
            const kelasSelected = document.getElementById('filter-kelas') ? document.getElementById('filter-kelas').value : "SEMUA";
            const genSelected = document.getElementById('filter-gender').value;
            const statusSelected = document.getElementById('filter-status').value;
            const cariKeyword = document.getElementById('cari-nama').value.toUpperCase();

            if (!tblBody) return;
            tblBody.innerHTML = '';

            if (!masterDataMentah || masterDataMentah.length === 0) {
                tblBody.innerHTML = `<tr><td class="py-10 text-center text-slate-400 uppercase font-black text-[10px] tracking-wider">Data kosong atau belum tersinkronisasi dari server.</td></tr>`;
                return;
            }

            let dataTersaring = masterDataMentah.filter(item => {
                const itemGolongan = String(item["Kelas/Golongan"] || item.kelas || "").toUpperCase();
                const itemGender = String(item.gender || item.Gender || "L").toUpperCase();
                const itemNama = String(item.nama || item.Nama || "").toUpperCase();
                const itemNik = String(item.nik || item.NIK || "");
                const itemStatus = String(item["Status (Harian)"] || item.status || "").toUpperCase();

                // 1. Filter Golongan (Santri vs Ustadz)
                let matchGol = false;
                if (golSelected === "SEMUA") {
                    matchGol = true;
                } else if (golSelected === "SANTRI") {
                    matchGol = (!itemGolongan.includes("USTADZ") && !itemGolongan.includes("PENGURUS"));
                } else if (golSelected === "USTADZ") {
                    matchGol = (itemGolongan.includes("USTADZ") || itemGolongan.includes("PENGURUS"));
                }

                // 2. Filter Spesifik Kelas
                let matchKelas = (kelasSelected === "SEMUA" || itemGolongan === kelasSelected);

                // 3. Filter Gender, Pencarian Kata Kunci, dan Status Sanksi
                let matchGen = (genSelected === "SEMUA" || itemGender === genSelected || (genSelected === "L" && itemGender === "PUTRA") || (genSelected === "P" && itemGender === "PUTRI"));
                let matchCari = (itemNama.includes(cariKeyword) || itemNik.includes(cariKeyword));
                let matchStatus = (statusSelected === "SEMUA" || itemStatus.includes(statusSelected));

                return matchGol && matchKelas && matchGen && matchCari && matchStatus;
            });

            if (dataTersaring.length === 0) {
                tblBody.innerHTML = `<tr><td class="py-10 text-center text-slate-400 uppercase font-black text-[10px] tracking-wider">Tidak ada data santri yang cocok dengan filter.</td></tr>`;
                return;
            }

            // Loop rendering baris tabel ringkas "Satu Baris, Dua Lantai"
            dataTersaring.forEach(item => {
                const nama = item.nama || item.Nama || "-";
                const gender = String(item.gender || item.Gender || "L").toUpperCase();
                const kelas = String(item["Kelas/Golongan"] || item.kelas || "-").toUpperCase();
                const poinHarian = item["Poin Harian"] !== undefined ? item["Poin Harian"] : (item.poin_harian !== undefined ? item.poin_harian : 0);
                const poinMingguanStatus = item["Poin Mingguan + Status"] || item.poin_mingguan_status || "0 (AMAN)";
                const isiTakziran = item["Isi Takziran (Harian)"] || item.isi_takziran_harian || "Pertahankan kedisiplinan.";
                const statusStr = item["Status (Harian)"] || item.status || "AMAN";

                let tr = document.createElement('tr');
                tr.className = "border-b dynamic-border-row hover:bg-slate-500/5 transition-colors";
                
                // Badge Gender Mini
                let badgeGender = (gender === "L" || gender === "PUTRA" || gender === "LPA") 
                    ? `<span class="text-sky-500 bg-sky-500/10 px-1 rounded text-[9px] font-black shrink-0">LPA</span>` 
                    : `<span class="text-pink-500 bg-pink-500/10 px-1 rounded text-[9px] font-black shrink-0">LPI</span>`;

                let warnaBadge = dapatkanWarnaBadge(statusStr);

                // EKSTRASI ANGKA POIN MINGGUAN SAJA UNTUK POP-UP MINI SEJAJAR
                let angkaMingguan = poinMingguanStatus.split(' ')[0] || "0";

                // LAYOUT SATU BARIS DUA LANTAI
                tr.innerHTML = `
                    <td class="py-2.5 px-2 sm:px-3 block w-full">
                        <div class="flex items-center justify-between gap-1 w-full">
                            <div class="truncate flex items-center gap-1.5 max-w-[60%]">
                                ${badgeGender}
                                <span class="font-black text-xs tracking-wide uppercase truncate text-slate-200 dark:text-slate-100">${nama}</span>
                                <span class="text-[9px] font-bold text-slate-400 shrink-0">(${kelas})</span>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <div class="flex flex-col items-end leading-none">
                                    <span class="text-xs font-black ${parseInt(poinHarian) > 0 ? 'text-rose-500' : 'text-emerald-500'}">${poinHarian} Pts</span>
                                    <span class="text-[9px] text-slate-400 font-mono mt-0.5">Wk: ${angkaMingguan} Pts</span>
                                </div>
                                <span class="badge-print px-2 py-0.5 rounded text-[8px] sm:text-[9px] font-black tracking-wider inline-block ${warnaBadge} uppercase shrink-0">
                                    ${statusStr.replace('AMAN', 'AMN').replace('TEGURAN RINGAN', 'TEGURAN RGN').toUpperCase()}
                                </span>
                            </div>
                        </div>
                        
                        <div class="text-[10px] text-slate-400 font-medium leading-relaxed mt-1 pl-1 flex items-start gap-1">
                            <span class="text-amber-500 shrink-0 font-bold">❯</span>
                            <span class="truncate-two-lines italic">${isiTakziran}</span>
                        </div>
                    </td>
                `;
                tblBody.appendChild(tr);
            });
        }

        function toggleTema() {
            const currentTheme = document.body.classList.contains('theme-dark') ? 'theme-dark' : 'theme-light';
            const newTheme = (currentTheme === 'theme-dark') ? 'theme-light' : 'theme-dark';
            setTemaAplikasi(newTheme);
        }

        function setTemaAplikasi(tema) {
            const btnTema = document.getElementById('btn-tema');
            if (tema === 'theme-light') {
                document.body.classList.remove('theme-dark');
                document.body.classList.add('theme-light');
                if(btnTema) btnTema.innerHTML = `<i class="fa-solid fa-moon text-indigo-950"></i>`;
                localStorage.setItem('dashboard_theme', 'theme-light');
            } else {
                document.body.classList.remove('theme-light');
                document.body.classList.add('theme-dark');
                if(btnTema) btnTema.innerHTML = `<i class="fa-solid fa-sun text-amber-400"></i>`;
                localStorage.setItem('dashboard_theme', 'theme-dark');
            }
            filterDanRenderData();
        }
    </script>
</body>
</html>
