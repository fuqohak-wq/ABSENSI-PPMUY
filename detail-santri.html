<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Manajemen Limit Santri</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; color: #333; }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"], input[type="number"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background-color: #0056b3; }
    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .result-table th, .result-table td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }
    .result-table th { background-color: #f8f9fa; }
    .edit-section {
      background: #e9ecef;
      padding: 15px;
      margin-top: 15px;
      border-radius: 4px;
      display: none;
    }
    .loading { text-align: center; display: none; color: #666; font-style: italic; font-weight: bold; margin: 15px 0; }
  </style>
</head>
<body>

<div class="container">
  <h2>Cari Santri & Kelola Limit</h2>
  
  <div class="search-box">
    <input type="text" id="searchQuery" placeholder="Masukkan Nama Lengkap Santri...">
    <button onclick="cariSantri()">Cari</button>
  </div>

  <div id="loading" class="loading">Sedang memproses ke Google Sheet... Silakan tunggu...</div>

  <table class="result-table" id="tableHasil" style="display:none;">
    <thead>
      <tr>
        <th>Nama Lengkap</th>
        <th>Kelas</th>
        <th>Sisa Saku</th>
        <th>Limit (Kolom G)</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="bodyHasil"></tbody>
  </table>

  <div id="editSection" class="edit-section">
    <h3>Ubah Limit untuk: <span id="editNama" style="color:#007bff;"></span></h3>
    <p>NIK: <span id="editNik" style="font-weight: bold;"></span></p>
    <div class="search-box">
      <input type="number" id="newLimitValue" placeholder="Masukkan limit baru (contoh: -15000)">
      <button onclick="simpanLimit()" style="background-color: #28a745;">Simpan Perubahan</button>
    </div>
  </div>
</div>

<script>
  // Menggunakan URL Web App Apps Script Anda yang sudah aktif
  const API_URL = "https://script.google.com/macros/s/AKfycbynNkuYVcO3lOrmyzISODEP5BCYfkeueXwEe3MR36prfuFsrK-dz2FrQAA7ze9mphU7/exec";

  let selectedNik = "";

  function toggleLoading(show) {
    document.getElementById('loading').style.display = show ? 'block' : 'none';
  }

  // FUNGSI UTAMA: MENCARI DATA SANTRI (MENGGUNAKAN POST AGAR TERBEBAS DARI CORS REDIRECT)
  async function cariSantri() {
    const query = document.getElementById('searchQuery').value;
    if (!query) return alert('Silakan masukkan nama terlebih dahulu');
    
    toggleLoading(true);
    document.getElementById('tableHasil').style.display = 'none';
    document.getElementById('editSection').style.display = 'none';
    
    try {
      const response = await fetch(API_URL, {
        method: "POST",
        mode: "cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          action: "search",
          query: query
        })
      });
      
      const data = await response.json();
      const tbody = document.getElementById('bodyHasil');
      tbody.innerHTML = "";
      
      if (!data || data.length === 0) {
        alert('Data santri tidak ditemukan.');
        toggleLoading(false);
        return;
      }
      
      data.forEach(santri => {
        const row = `<tr>
          <td>${santri.nama}</td>
          <td>${santri.kelas}</td>
          <td>${santri.sisaSaku}</td>
          <td>${santri.limit}</td>
          <td><button onclick="bukaFormEdit('${santri.nama}', '${santri.nik}', ${santri.limit})">Pilih</button></td>
        </tr>`;
        tbody.innerHTML += row;
      });
      
      document.getElementById('tableHasil').style.display = 'table';
    } catch (error) {
      console.error(error);
      alert('Gagal mengambil data dari Google Sheet. Pastikan Apps Script Anda sudah di-deploy dengan benar sebagai "Anyone".');
    }
    toggleLoading(false);
  }

  function bukaFormEdit(nama, nik, limit) {
    selectedNik = nik;
    document.getElementById('editNama').innerText = nama;
    document.getElementById('editNik').innerText = nik;
    document.getElementById('newLimitValue').value = limit;
    document.getElementById('editSection').style.display = 'block';
  }

  // FUNGSI UTAMA: MENYIMPAN NILAI LIMIT BARU (KOLOM G)
  async function simpanLimit() {
    const newLimit = document.getElementById('newLimitValue').value;
    if (!newLimit) return alert('Masukkan nilai limit baru terlebih dahulu!');
    
    toggleLoading(true);
    
    try {
      const response = await fetch(API_URL, {
        method: "POST",
        mode: "cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          action: "updateLimit",
          nik: selectedNik,
          newLimit: newLimit
        })
      });
      
      const hasil = await response.json();
      
      if (hasil.success) {
        alert(hasil.message);
        document.getElementById('editSection').style.display = 'none';
        cariSantri(); // Memperbarui isi tabel secara otomatis setelah sukses update
      } else {
        alert('Gagal memperbarui data: ' + hasil.message);
      }
    } catch (error) {
      console.error(error);
      alert('Terjadi kesalahan koneksi saat mencoba menyimpan data limit.');
    }
    toggleLoading(false);
  }
</script>
</body>
</html>
