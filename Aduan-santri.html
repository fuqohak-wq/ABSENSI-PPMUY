<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Aduan Santri - PPMUY</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --dark: #1f2937;
            --light: #f9fafb;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light); color: var(--dark); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Header */
        header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid var(--border); }
        header h1 { font-size: 24px; color: var(--dark); }
        header p { color: #6b7280; font-size: 14px; margin-top: 5px; }

        /* Area Kamera Scan */
        .scan-section { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 4px; text-align: center; }
        .video-container { max-width: 400px; margin: 0 auto 15px; border-radius: 8px; overflow: hidden; background: #000; position: relative; aspect-ratio: 4/3; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; }
        
        .btn { background-color: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.2s; width: 100%; max-width: 400px; }
        .btn:hover { background-color: var(--primary-hover); }
        .btn:disabled { background-color: #9ca3af; cursor: not-allowed; }
        
        #status-message { margin-top: 10px; font-size: 14px; font-weight: 500; }
        .text-success { color: #10b981; }
        .text-loading { color: #3b82f6; }
        .text-error { color: #ef4444; }

        /* Area Dashboard Tabel Satu Baris */
        .dashboard-section { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-top: 25px; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .dashboard-header h2 { font-size: 18px; }
        .btn-refresh { background: none; border: 1px solid #d1d5db; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .btn-refresh:hover { background: #f3f4f6; }

        .table-responsive { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; min-width: 800px; }
        th { background-color: #f3f4f6; padding: 12px; font-weight: 600; border-bottom: 2px solid var(--border); }
        td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.5; }
        tr:hover { background-color: #f9fafb; }
        
        .badge { background-color: #fef3c7; color: #92400e; padding: 4px 8px; border-radius: 50px; font-size: 12px; font-weight: 500; display: inline-block; white-space: nowrap; }
        .empty-row { text-align: center; color: #9ca3af; padding: 30px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Manajemen Aduan Santri PPMUY</h1>
        <p>Divisi Humas Internal • manajemen.ppmuy.com</p>
    </header>

    <div class="scan-section">
        <div class="video-container">
            <video id="video" autoplay playsinline></video>
        </div>
        <button id="snap-btn" class="btn">📸 Ambil Foto & Analisis AI</button>
        <div id="status-message"></div>
    </div>

    <div class="dashboard-section">
        <div class="dashboard-header">
            <h2>Data Aspirasi & Strategi Solusi</h2>
            <button class="btn-refresh" onclick="muatDataDashboard()">🔄 Refresh Data</button>
        </div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 120px;">Tanggal</th>
                        <th>Masalah Utama</th>
                        <th>Usulan Penanganan (Solusi Cepat)</th>
                        <th>Strategi Jangka Panjang</th>
                        <th style="width: 100px;">Status</th>
                    </tr>
                </thead>
                <tbody id="dashboard-tbody">
                    <tr>
                        <td colspan="5" class="empty-row">Sedang memuat data aduan...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<canvas id="canvas" width="640" height="480"></canvas>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzlYJ7O5FDseh0pxoGouw4yIx0fdDwlqxiYo6Xwn8LHd7pepKgZQBFq-9R6DNst0fgI/exec";
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const snapBtn = document.getElementById('snap-btn');
    const statusMsg = document.getElementById('status-message');
    const tbody = document.getElementById('dashboard-tbody');

    // 1. Jalankan Kamera otomatis saat halaman dibuka
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
        .then(stream => {
            video.srcObject = stream;
        })
        .catch(err => {
            console.error("Gagal akses kamera: ", err);
            statusMsg.innerHTML = "<span class='text-error'>Gagal membuka kamera. Pastikan izin kamera aktif.</span>";
        });

    // 2. Logika ketika pengurus klik tombol "Ambil Foto"
    snapBtn.addEventListener('click', () => {
        const context = canvas.getContext('2d');
        // Gambar video ke dalam canvas
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // Ubah gambar menjadi format Base64 teks murni
        const imageData = canvas.toDataURL('image/jpeg');
        const base64Bytes = imageData.split(',')[1];

        // Efek Loading
        snapBtn.disabled = true;
        statusMsg.innerHTML = "<span class='text-loading'>🔄 AI sedang membaca tulisan tangan & menyusun strategi... Mohon tunggu.</span>";

        // Kirim data ke Google Apps Script
        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ imageBytes: base64Bytes })
        })
        .then(res => res.json())
        .then(result => {
            if(result.status === "success") {
                statusMsg.innerHTML = "<span class='text-success'>✅ Berhasil! Data aduan dan solusi satu baris telah ditambahkan.</span>";
                muatDataDashboard(); // Refresh isi tabel secara otomatis
            } else {
                statusMsg.innerHTML = `<span class='text-error'>❌ Gagal: ${result.message}</span>`;
            }
        })
        .catch(err => {
            statusMsg.innerHTML = "<span class='text-error'>❌ Terjadi kesalahan jaringan saat mengirim data.</span>";
            console.error(err);
        })
        .finally(() => {
            snapBtn.disabled = false;
        });
    });

    // 3. Fungsi Ambil Data dari Google Sheets untuk Dashboard
    function muatDataDashboard() {
        fetch(GAS_URL)
            .then(res => res.json())
            .then(data => {
                tbody.innerHTML = "";
                if (data.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='5' class='empty-row'>Belum ada data aduan masuk.</td></tr>";
                    return;
                }
                
                // Tampilkan data terbalik (Aduan terbaru paling atas)
                data.reverse().forEach(item => {
                    const dateFormatted = item.tanggal ? new Date(item.tanggal).toLocaleDateString('id-ID', {day: 'numeric', month: 'short', year: 'numeric'}) : '-';
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${dateFormatted}</td>
                        <td><b>${item.masalah || '-'}</b></td>
                        <td>${item.solusi || '-'}</td>
                        <td>${item.strategi || '-'}</td>
                        <td><span class="badge">${item.status || '⏳ Proses'}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                tbody.innerHTML = "<tr><td colspan='5' class='empty-row text-error'>Gagal memuat data dari database Google Sheets.</td></tr>";
                console.error(err);
            });
    }

    // Jalankan fungsi muat data dashboard saat pertama kali web dibuka
    window.onload = muatDataDashboard;
</script>

</body>
</html>
