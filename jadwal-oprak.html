<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQ Special Patrol System - PPMUY</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --accent-color: #3b82f6;
      --rose-danger: #f43f5e;
    }

    body, header, div, section, button, h1, h3, p {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* MODE GELAP: Deep Cyber Sapphire */
    .theme-dark {
      --bg-main: #020617;
      --bg-header: rgba(15, 23, 42, 0.75);
      --bg-card: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --blob-color: rgba(59, 130, 246, 0.06);
    }

    /* MODE TERANG: Luxury Soft Sky Blue (Sesuai Request Latar Belakang Biru) */
    .theme-light {
      --bg-main: #f0f7ff;
      --bg-header: rgba(255, 255, 255, 0.8);
      --bg-card: #ffffff;
      --text-main: #1e3a8a;
      --text-muted: #60a5fa;
      --border-color: #dbeafe;
      --blob-color: rgba(96, 165, 250, 0.15);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow-x: hidden;
    }

    .blob {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--blob-color) 0%, rgba(59, 130, 246, 0) 70%);
      border-radius: 50%;
      z-index: -1;
      filter: blur(80px);
    }

    .header-glass {
      background-color: var(--bg-header);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
    }

    /* Kartu Ultra Kecil & Compact (Hanya Nama) */
    .card-oprak {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 14px 10px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      position: relative;
      min-height: 55px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .card-oprak:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: var(--accent-color);
      box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.4);
    }

    .card-oprak h3 {
      font-size: 11px;
      font-weight: 800;
      line-height: 1.3;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .vanish {
      opacity: 0 !important;
      transform: scale(0.6) !important;
      filter: blur(8px);
      pointer-events: none;
    }

    .clock-font {
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-filter-active {
      background-color: var(--accent-color) !important;
      color: white !important;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 10px; }
  </style>
</head>
<body class="theme-dark min-h-screen pb-32">

  <div class="blob" style="top: -150px; left: -150px;"></div>
  <div class="blob" style="bottom: -150px; right: -150px;"></div>

  <div class="w-full bg-blue-500/10 border-b border-blue-500/10 py-1.5 px-4 text-center">
    <p id="kata-bijak" class="text-[10px] font-semibold tracking-wider text-blue-400 uppercase animate-pulse">
      "Mata yang terjaga demi keamanan saudaranya, haram tersentuh api neraka."
    </p>
  </div>

  <header class="header-glass sticky top-0 z-50 px-6 py-3">
    <div class="max-w-[1600px] mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
        
      <div class="flex items-center gap-4 w-full lg:w-auto">
        <a href="dashboard.html" class="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-500 hover:bg-blue-500 hover:text-white transition-all shadow-sm">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </a>
        <div class="h-8 w-px bg-slate-700/30"></div>
        <div>
          <h1 class="text-base font-black tracking-tight flex items-center gap-2">
            <i class="fa-solid fa-shield-halved text-blue-500 text-sm"></i> RADAR SECURITY <span class="text-blue-500">OPRAK</span>
          </h1>
          <div class="flex items-center gap-2 mt-0.5">
            <span id="live-date" class="text-[9px] font-bold uppercase tracking-widest text-slate-500">12 JUNI 2026</span>
            <span class="w-1 h-1 rounded-full bg-slate-600"></span>
            <span id="live-clock" class="text-[9px] font-bold clock-font text-blue-500">12:44:00</span>
          </div>
        </div>
      </div>

      <div id="info-putaran-screen" class="text-center px-4 py-1.5 bg-blue-500/5 rounded-xl border border-blue-500/10 text-[11px] font-bold text-slate-400">
        Menghubungkan ke satelit jadwal...
      </div>

      <div class="flex items-center gap-2 bg-slate-900/40 p-1 rounded-xl border border-slate-700/30 shadow-inner">
        <button id="btnSemua" onclick="setGender('semua')" class="px-4 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider text-slate-400 cursor-pointer transition-all">Semua</button>
        <button id="btnL" onclick="setGender('laki-laki')" class="px-4 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider text-slate-400 cursor-pointer transition-all">Putra</button>
        <button id="btnP" onclick="setGender('perempuan')" class="px-4 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider text-slate-400 cursor-pointer transition-all">Putri</button>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="toggleTema()" class="w-9 h-9 rounded-xl bg-slate-800/40 border border-slate-700/50 text-amber-400 flex items-center justify-center cursor-pointer shadow-sm"><i class="fa-solid fa-sun text-xs"></i></button>
        <div class="h-6 w-px bg-slate-700/30"></div>
        <div class="text-right">
          <p class="text-[8px] font-black text-slate-500 uppercase tracking-widest">Patrol System</p>
          <p class="text-[10px] font-extrabold text-blue-500 uppercase">v2.0 Dynamic</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-[1600px] mx-auto px-6 mt-8">
    
    <div id="statusArea" class="flex flex-col items-center justify-center py-28 text-center">
      <div class="w-12 h-12 border-4 border-slate-800 border-t-blue-500 rounded-full animate-spin mb-4"></div>
      <p class="text-xs font-bold tracking-widest text-slate-500 uppercase animate-pulse">Menyelaraskan Siklus Patroli Keamanan...</p>
    </div>

    <div id="gridOprak" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10 gap-3 hidden">
    </div>

    <div id="panelAksi" class="fixed bottom-8 left-1/2 -translate-x-1/2 hidden z-50">
      <button onclick="kunciSesiAlpaMassal()" class="px-8 py-3.5 bg-rose-500 hover:bg-rose-600 text-white rounded-xl font-black text-xs uppercase tracking-widest shadow-xl shadow-rose-500/30 active:scale-95 transition-all flex items-center gap-2.5 cursor-pointer">
        <i class="fa-solid fa-lock text-sm"></i> Kunci Radar & Alpa Massal (Poin 5)
      </button>
    </div>
  </main>

  <script>
    const urlScript = "https://script.google.com/macros/s/AKfycby0wyCx83Kf8XFpxaLiRy96noe0jaTlWBLg-M2XnfG0YqeZytE0vaR9QPzFWP7mpk_rlQ/exec";
    
    let dataSantriLokal = [];
    let sisaDisaringlP = [];
    let filterSekarang = "semua";
    let infoPutaranAktif = 1;
    let infoPutaranMaksimal = 1;

    // Kumpulan kata bijak penyemangat ronda/oprak keamanan
    const quotesOprak = [
      "Keamanan pesantren ada di ketukan langkah patrolimu malam ini.",
      "Mata yang berjaga demi kenyamanan saudaranya menuntut ridho Allah Swt.",
      "Disiplin adalah fondasi utama tegaknya keamanan bumi PPMUY.",
      "Satu putaran patrolimu, seribu ketenangan bagi santri yang menuntut ilmu.",
      "Pengabdianmu di lini keamanan tidak akan pernah sia-sia di mata-Nya."
    ];

    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('oprak_theme') || 'theme-dark';
      setTemaAplikasi(savedTheme);
      mulaiJam();
      acakKataBijak();
      muatDaftarOprak();
    });

    function mulaiJam() {
      setInterval(() => {
        const n = new Date();
        document.getElementById('live-clock').innerText = n.toLocaleTimeString('id-ID');
      }, 1000);
      const opt = { year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('live-date').innerText = new Date().toLocaleDateString('id-ID', opt).toUpperCase();
    }

    function acakKataBijak() {
      const acak = quotesOprak[Math.floor(Math.random() * quotesOprak.length)];
      document.getElementById('kata-bijak').innerText = `"${acak}"`;
    }

    function setTemaAplikasi(tema) {
      document.body.className = tema + " min-h-screen pb-32";
      localStorage.setItem('oprak_theme', tema);
    }

    function toggleTema() {
      const current = document.body.classList.contains('theme-dark') ? 'theme-light' : 'theme-dark';
      setTemaAplikasi(current);
    }

    function muatDaftarOprak() {
      fetch(`${urlScript}?aksi=ambil_petugas_oprak`)
        .then(response => response.json())
        .then(res => {
          if(res.status === "error" || !res.data) {
            dataSantriLokal = [];
            renderGrid();
            return;
          }
          dataSantriLokal = res.data;
          infoPutaranAktif = res.putaran_aktif || 1;
          infoPutaranMaksimal = res.putaran_maksimal || 1;
          
          document.getElementById('info-putaran-screen').innerHTML = `
            RADAR AKTIF: <span class="text-blue-500 font-extrabold">PUTARAN ${infoPutaranAktif}</span> 
            <span class="opacity-30 mx-1">|</span> Siklus Maks: ${infoPutaranMaksimal}
          `;
          
          document.getElementById('statusArea').classList.add('hidden');
          document.getElementById('gridOprak').classList.remove('hidden');
          document.getElementById('panelAksi').classList.remove('hidden');
          renderGrid();
        })
        .catch(err => {
          console.error(err);
          document.getElementById("statusArea").innerHTML = `<p class="text-sm font-bold text-rose-500">Gagal terhubung dengan server cloud.</p>`;
        });
    }

    function setGender(g) { 
      filterSekarang = g; 
      renderGrid(); 
    }

    function renderGrid() {
      document.getElementById('btnSemua').className = `px-4 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider cursor-pointer transition-all ${filterSekarang === 'semua' ? 'btn-filter-active' : 'text-slate-400'}`;
      document.getElementById('btnL').className = `px-4 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider cursor-pointer transition-all ${filterSekarang === 'laki-laki' ? 'btn-filter-active' : 'text-slate-400'}`;
      document.getElementById('btnP').className = `px-4 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider cursor-pointer transition-all ${filterSekarang === 'perempuan' ? 'btn-filter-active' : 'text-slate-400'}`;

      const container = document.getElementById('gridOprak');
      container.innerHTML = '';

      sisaDisaringlP = dataSantriLokal.filter(s => {
        if (filterSekarang === "semua") return true;
        return (s.gender || "").toString().toLowerCase().trim() === filterSekarang;
      });

      if (sisaDisaringlP.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-16 text-xs font-bold uppercase tracking-widest opacity-40">
            <i class="fa-solid fa-circle-check text-2xl text-blue-500 mb-2 block"></i> Kelompok ini sudah bersih / dikunci
          </div>
        `;
        return;
      }

      sisaDisaringlP.forEach(santri => {
        const card = document.createElement('div');
        card.id = `card-${santri.nik}`;
        card.className = 'card-oprak';
        card.setAttribute('onclick', `eksekusiHadirKilat(\`${santri.nik}\`, \`${santri.nama.replace(/"/g, '&quot;')}\`, \`${santri.gender}\`, \`${santri.status}\`, \`${santri.jadwal}\`)`);
        
        card.innerHTML = `<h3>${santri.nama}</h3>`;
        container.appendChild(card);
      });
    }

    function eksekusiHadirKilat(nik, nama, gender, status, jadwal) {
      const card = document.getElementById(`card-${nik}`);
      if(card) card.classList.add('vanish');
      
      dataSantriLokal = dataSantriLokal.filter(s => s.nik !== nik);
      setTimeout(() => { if(card) card.remove(); renderGrid(); }, 300);

      fetch(urlScript, {
        method: 'POST',
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          aksi: "konfirmasi_hadir_oprak",
          nik: nik,
          nama: nama,
          gender: gender,
          status: status,
          jadwal: jadwal
        })
      }).catch(e => console.error("Error background sync:", e));
    }

    function kunciSesiAlpaMassal() {
      if (!confirm(`Kunci Sesi Putaran ${infoPutaranAktif}? ${sisaDisaringlP.length} santri aktif di layar akan dicatat ALPA (Denda Poin 5). Sesi besok otomatis maju.`)) return;

      const panel = document.getElementById('panelAksi');
      panel.style.opacity = "0.5";
      panel.style.pointerEvents = "none";

      fetch(urlScript, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          aksi: "kunci_alpa_oprak_massal",
          putaran_aktif: infoPutaranAktif,
          putaran_maksimal: infoPutaranMaksimal,
          data_alpa: sisaDisaringlP
        })
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          alert(res.message);
          location.reload();
        }
      })
      .catch(e => {
        alert("Gangguan koneksi.");
        panel.style.opacity = "1";
        panel.style.pointerEvents = "auto";
      });
    }
  </script>
</body>
</html>
