<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQ Santri Penggerak - PPMUY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --accent-color: #0ea5e9;
      --bg-main: #020617;
      --bg-header: rgba(15, 23, 42, 0.75);
      --bg-card: #0f172a;
      --text-main: #f8fafc;
      --border-color: #1e293b;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }
    .header-glass {
      background-color: var(--bg-header);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
    }
    .card-penggerak {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 16px 12px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      min-height: 70px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-penggerak:hover {
      transform: translateY(-4px);
      border-color: var(--accent-color);
      box-shadow: 0 10px 20px -10px rgba(14, 165, 233, 0.4);
    }
    .card-penggerak h3 {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .vanish {
      opacity: 0 !important;
      transform: scale(0.7) !important;
      filter: blur(8px);
      pointer-events: none;
    }
    .clock-font {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="min-h-screen pb-32">

  <header class="header-glass sticky top-0 z-50 px-6 py-4">
    <div class="max-w-[1600px] mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-base font-black tracking-tight flex items-center gap-2">
          <i class="fa-solid fa-bolt text-sky-400"></i> RADAR SANTRI <span class="text-sky-400">PENGGERAK</span>
        </h1>
        <div class="flex items-center gap-2 mt-0.5">
          <span id="live-date" class="text-[9px] font-bold uppercase tracking-widest text-slate-500">-</span>
          <span class="w-1 h-1 rounded-full bg-slate-600"></span>
          <span id="live-clock" class="text-[9px] font-bold clock-font text-sky-400">00:00:00</span>
        </div>
      </div>

      <div id="info-hari-screen" class="text-center px-4 py-1.5 bg-sky-500/5 rounded-xl border border-sky-500/10 text-[11px] font-bold text-slate-400">
        Menghubungkan ke satelit jadwal...
      </div>
    </div>
  </header>

  <main class="max-w-[1600px] mx-auto px-6 mt-8">
    <div id="statusArea" class="flex flex-col items-center justify-center py-28 text-center">
      <div class="w-12 h-12 border-4 border-slate-800 border-t-sky-500 rounded-full animate-spin mb-4"></div>
      <p class="text-xs font-bold tracking-widest text-slate-500 uppercase animate-pulse">Memindai Database Harian Santri...</p>
    </div>

    <div id="gridPenggerak" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10 gap-3 hidden"></div>

    <div id="panelAksi" class="fixed bottom-8 left-1/2 -translate-x-1/2 hidden z-50">
      <button onclick="kunciSesiGaibMassal()" class="px-8 py-3.5 bg-rose-500 hover:bg-rose-600 text-white rounded-xl font-black text-xs uppercase tracking-widest shadow-xl shadow-rose-500/30 active:scale-95 transition-all flex items-center gap-2.5 cursor-pointer">
        <i class="fa-solid fa-lock text-sm"></i> Kunci Radar & Absen Gaib (Poin 5)
      </button>
    </div>
  </main>

  <script>
    // PASTI KAN DIKASIH URL DEPLOYMENT SCRIPT BARU ANDA DI SINI
    const urlScript = "https://script.google.com/macros/s/AKfycby0wyCx83Kf8XFpxaLiRy96noe0jaTlWBLg-M2XnfG0YqeZytE0vaR9QPzFWP7mpk_rlQ/exec"; 
    
    let dataSantriLokal = [];

    window.addEventListener('DOMContentLoaded', () => {
      mulaiJam();
      muatDaftarJadwal();
    });

    function mulaiJam() {
      setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('id-ID');
      }, 1000);
      document.getElementById('live-date').innerText = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
    }

    function muatDaftarJadwal() {
      fetch(`${urlScript}?aksi=ambil_jadwal_hari_ini`)
        .then(res => res.json())
        .then(res => {
          if(res.status === "error") {
            document.getElementById("statusArea").innerHTML = `<p class="text-sm font-bold text-rose-500">${res.message}</p>`;
            return;
          }
          
          dataSantriLokal = res.data;
          
          document.getElementById('info-hari-screen').innerHTML = `RADAR OPERASIONAL: <span class="text-sky-400 font-extrabold">${res.hari}</span>`;
          document.getElementById('statusArea').classList.add('hidden');
          document.getElementById('gridPenggerak').classList.remove('hidden');
          document.getElementById('panelAksi').classList.remove('hidden');
          
          renderGrid();
        })
        .catch(err => {
          document.getElementById("statusArea").innerHTML = `<p class="text-sm font-bold text-rose-500">Gagal Sinkronisasi Cloud Server.</p>`;
        });
    }

    function renderGrid() {
      const container = document.getElementById('gridPenggerak');
      container.innerHTML = '';

      if (dataSantriLokal.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-16 text-xs font-bold uppercase tracking-widest opacity-40">
            <i class="fa-solid fa-circle-check text-2xl text-sky-400 mb-2 block"></i> Tidak Ada Jadwal Hari Ini / Sesi Selesai
          </div>
        `;
        return;
      }

      dataSantriLokal.forEach(santri => {
        const card = document.createElement('div');
        card.id = `card-${santri.nik}`;
        card.className = 'card-penggerak';
        
        // Escape nama jika mengandung tanda petik tunggal/ganda
        const namaEsc = (santri.nama || "").replace(/`/g, "\\`").replace(/"/g, "&quot;");
        card.setAttribute('onclick', `eksekusiHadir(\`${santri.nik}\`, \`${namaEsc}\`, \`${santri.gender}\`, \`${santri.status}\`, \`${santri.hari}\`)`);
        
        card.innerHTML = `
          <h3>${santri.nama}</h3>
          <span class="text-[9px] text-slate-500 mt-1 font-semibold">${santri.status}</span>
        `;
        container.appendChild(card);
      });
    }

    function eksekusiHadir(nik, nama, gender, status, hari) {
      const card = document.getElementById(`card-${nik}`);
      if(card) card.classList.add('vanish');
      
      // Kurangi dari data lokal agar sinkron dengan grid
      dataSantriLokal = dataSantriLokal.filter(s => s.nik !== nik);
      setTimeout(() => { if(card) card.remove(); renderGrid(); }, 300);

      // Kirim data ke backend (Hadir tunggal = 0 Poin)
      fetch(urlScript, {
        method: 'POST',
        body: JSON.stringify({
          aksi: "simpan_absen",
          data: [{ nik: nik, nama: nama, gender: gender, status: status, hari: hari, kehadiran: "HADIR", poin: 0 }]
        })
      }).catch(e => console.error("Sync error:", e));
    }

    function kunciSesiGaibMassal() {
      if (dataSantriLokal.length === 0) return alert("Tidak ada data santri tersisa.");
      if (!confirm(`Kunci Sesi Hari Ini? Sisa ${dataSantriLokal.length} santri akan otomatis dicatat GAIB dengan denda Pelanggaran 5 Poin.`)) return;

      const panel = document.getElementById('panelAksi');
      panel.style.opacity = "0.5";
      panel.style.pointerEvents = "none";

      // Petakan sisa data lokal menjadi status GAIB (5 Poin)
      const dataGaibMassal = dataSantriLokal.map(s => {
        return { nik: s.nik, nama: s.nama, gender: s.gender, status: s.status, hari: s.hari, kehadiran: "GAIB", poin: 5 };
      });

      fetch(urlScript, {
        method: "POST",
        body: JSON.stringify({
          aksi: "simpan_absen",
          data: dataGaibMassal
        })
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          alert("Sesi berhasil dikunci! Semua sanksi GAIB berhasil masuk Log.");
          location.reload();
        }
      })
      .catch(() => {
        alert("Gangguan koneksi cloud.");
        panel.style.opacity = "1";
        panel.style.pointerEvents = "auto";
      });
    }
  </script>
</body>
</html>
