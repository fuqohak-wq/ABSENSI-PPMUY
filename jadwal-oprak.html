<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQ Special Patrol System - PPMUY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --accent-color: #3b82f6;
      --rose-danger: #f43f5e;
    }
    body, header, div, section, button, h1, h3, p {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .theme-dark {
      --bg-main: #020617;
      --bg-header: rgba(15, 23, 42, 0.75);
      --bg-card: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --blob-color: rgba(59, 130, 246, 0.06);
    }
    body { background-color: var(--bg-main); color: var(--text-main); overflow-x: hidden; }
    .blob {
      position: fixed; width: 600px; height: 600px;
      background: radial-gradient(circle, var(--blob-color) 0%, rgba(59, 130, 246, 0) 70%);
      border-radius: 50%; z-index: -1; filter: blur(80px);
    }
    .header-glass { background-color: var(--bg-header); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-color); }
    .card-oprak {
      background-color: var(--bg-card); border: 1px solid var(--border-color);
      padding: 14px 10px; border-radius: 14px; display: flex; align-items: center;
      justify-content: center; text-align: center; cursor: pointer; min-height: 55px;
    }
    .card-oprak:hover { transform: translateY(-3px); border-color: var(--accent-color); }
    .card-oprak h3 { font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .vanish { opacity: 0 !important; transform: scale(0.6) !important; filter: blur(8px); pointer-events: none; }
    .clock-font { font-family: 'JetBrains Mono', monospace; }
    .btn-filter-active { background-color: var(--accent-color) !important; color: white !important; }
  </style>
</head>
<body class="theme-dark min-h-screen pb-32">

  <div class="blob" style="top: -150px; left: -150px;"></div>
  <div class="blob" style="bottom: -150px; right: -150px;"></div>

  <header class="header-glass sticky top-0 z-50 px-6 py-3">
    <div class="max-w-[1600px] mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-4 w-full lg:w-auto">
        <div class="h-8 w-px bg-slate-700/30"></div>
        <div>
          <h1 class="text-base font-black tracking-tight flex items-center gap-2">
            <i class="fa-solid fa-shield-halved text-blue-500 text-sm"></i> RADAR SECURITY <span class="text-blue-500">OPRAK</span>
          </h1>
          <div class="flex items-center gap-2 mt-0.5">
            <span id="live-date" class="text-[9px] font-bold uppercase tracking-widest text-slate-500">-</span>
            <span class="w-1 h-1 rounded-full bg-slate-600"></span>
            <span id="live-clock" class="text-[9px] font-bold clock-font text-blue-500">00:00:00</span>
          </div>
        </div>
      </div>

      <div id="info-putaran-screen" class="text-center px-4 py-1.5 bg-blue-500/5 rounded-xl border border-blue-500/10 text-[11px] font-bold text-slate-400">
        Menghubungkan ke satelit jadwal...
      </div>

      <div class="flex items-center gap-2 bg-slate-900/40 p-1 rounded-xl border border-slate-700/30 shadow-inner">
        <button id="btnSemua" onclick="setGender('semua')" class="px-4 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider text-slate-400 cursor-pointer transition-all">Semua</button>
        <button id="btnL" onclick="setGender('laki-laki')" class="px-4 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider text-slate-400 cursor-pointer transition-all">Putra</button>
        <button id="btnP" onclick="setGender('perempuan')" class="px-4 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider text-slate-400 cursor-pointer transition-all">Putri</button>
      </div>
    </div>
  </header>

  <main class="max-w-[1600px] mx-auto px-6 mt-8">
    <div id="statusArea" class="flex flex-col items-center justify-center py-28 text-center">
      <div class="w-12 h-12 border-4 border-slate-800 border-t-blue-500 rounded-full animate-spin mb-4"></div>
      <p class="text-xs font-bold tracking-widest text-slate-500 uppercase animate-pulse">Menyelaraskan Siklus Patroli Keamanan...</p>
    </div>

    <div id="gridOprak" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10 gap-3 hidden"></div>

    <div id="panelAksi" class="fixed bottom-8 left-1/2 -translate-x-1/2 hidden z-50">
      <button onclick="kunciSesiAlpaMassal()" class="px-8 py-3.5 bg-rose-500 hover:bg-rose-600 text-white rounded-xl font-black text-xs uppercase tracking-widest shadow-xl shadow-rose-500/30 active:scale-95 transition-all flex items-center gap-2.5 cursor-pointer">
        <i class="fa-solid fa-lock text-sm"></i> Kunci Radar & Alpa Massal (Poin 5)
      </button>
    </div>
  </main>

  <script>
    // TEMPELKAN URL SCRIPT WEB APP ANDA DI SINI
    const urlScript = "https://script.google.com/macros/s/AKfycby0wyCx83Kf8XFpxaLiRy96noe0jaTlWBLg-M2XnfG0YqeZytE0vaR9QPzFWP7mpk_rlQ/exec"; 
    
    let dataSantriLokal = [];
    let filterSekarang = "semua";
    let infoPutaranAktif = 1;

    window.addEventListener('DOMContentLoaded', () => {
      mulaiJam();
      muatDaftarOprak();
    });

    function mulaiJam() {
      setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('id-ID');
      }, 1000);
      document.getElementById('live-date').innerText = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
    }

    function muatDaftarOprak() {
      fetch(`${urlScript}?aksi=ambil_petugas_oprak`)
        .then(res => res.json())
        .then(res => {
          if(res.status === "error") {
            document.getElementById("statusArea").innerHTML = `<p class="text-sm font-bold text-rose-500">${res.message}</p>`;
            return;
          }
          dataSantriLokal = res.data;
          infoPutaranAktif = res.putaran_aktif || 1;
          
          document.getElementById('info-putaran-screen').innerHTML = `RADAR AKTIF: <span class="text-blue-500 font-extrabold">PUTARAN ${infoPutaranAktif}</span> <span class="opacity-30 mx-1">|</span> Maks Siklus: 7`;
          document.getElementById('statusArea').classList.add('hidden');
          document.getElementById('gridOprak').classList.remove('hidden');
          document.getElementById('panelAksi').classList.remove('hidden');
          renderGrid();
        })
        .catch(err => {
          document.getElementById("statusArea").innerHTML = `<p class="text-sm font-bold text-rose-500">Gagal Sinkronisasi Cloud Server.</p>`;
        });
    }

    function setGender(g) { filterSekarang = g; renderGrid(); }

    function renderGrid() {
      document.getElementById('btnSemua').className = `px-4 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider cursor-pointer transition-all ${filterSekarang === 'semua' ? 'btn-filter-active' : 'text-slate-400'}`;
      document.getElementById('btnL').className = `px-4 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider cursor-pointer transition-all ${filterSekarang === 'laki-laki' ? 'btn-filter-active' : 'text-slate-400'}`;
      document.getElementById('btnP').className = `px-4 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider cursor-pointer transition-all ${filterSekarang === 'perempuan' ? 'btn-filter-active' : 'text-slate-400'}`;

      const container = document.getElementById('gridOprak');
      container.innerHTML = '';

      let dataDisaring = dataSantriLokal.filter(s => {
        if (filterSekarang === "semua") return true;
        return (s.gender || "").toString().toLowerCase().trim() === filterSekarang;
      });

      if (dataDisaring.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-16 text-xs font-bold uppercase tracking-widest opacity-40"><i class="fa-solid fa-circle-check text-2xl text-blue-500 mb-2 block"></i> Kelompok ini sudah bersih / dikunci</div>`;
        return;
      }

      dataDisaring.forEach(santri => {
        const card = document.createElement('div');
        card.id = `card-${santri.nik}`;
        card.className = 'card-oprak';
        const namaEsc = (santri.nama || "").replace(/`/g, "\\`").replace(/"/g, "&quot;");
        card.setAttribute('onclick', `eksekusiHadirKilat(\`${santri.nik}\`, \`${namaEsc}\`, \`${santri.gender}\`, \`${santri.status}\`, \`${santri.putaran}\`)`);
        card.innerHTML = `<h3>${santri.nama}</h3>`;
        container.appendChild(card);
      });
    }

    function eksekusiHadirKilat(nik, nama, gender, status, putaran) {
      const card = document.getElementById(`card-${nik}`);
      if(card) card.classList.add('vanish');
      dataSantriLokal = dataSantriLokal.filter(s => s.nik !== nik);
      setTimeout(() => { if(card) card.remove(); renderGrid(); }, 300);

      fetch(urlScript, {
        method: 'POST',
        body: JSON.stringify({ aksi: "konfirmasi_hadir_oprak", nik: nik, nama: nama, gender: gender, status: status, putaran: putaran })
      }).catch(e => console.error(e));
    }

    function kunciSesiAlpaMassal() {
      if (dataSantriLokal.length === 0) return alert("Tidak ada santri tersisa.");
      if (!confirm(`Kunci Sesi Putaran ${infoPutaranAktif}? Sisa ${dataSantriLokal.length} orang dicatat Alpa.`)) return;

      document.getElementById('panelAksi').style.opacity = "0.5";
      fetch(urlScript, {
        method: "POST",
        body: JSON.stringify({ aksi: "kunci_alpa_oprak_massal", putaran_aktif: infoPutaranAktif, data_alpa: dataSantriLokal })
      })
      .then(r => r.json())
      .then(res => { if (res.status === "success") { alert(res.message); location.reload(); } })
      .catch(() => { alert("Gangguan koneksi."); location.reload(); });
    }
  </script>
</body>
</html>
