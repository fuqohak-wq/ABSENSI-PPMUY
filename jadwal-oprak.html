<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrol Radar - Santri Penggerak PPMUY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    .clock-font {
      font-family: 'JetBrains Mono', monospace;
    }
    
    /* VARIANT THEME 1: THEME DARK (DEFAULT) */
    .theme-dark {
      background-color: #020617;
      color: #f8fafc;
    }
    .theme-dark .header-glass {
      background-color: rgba(15, 23, 42, 0.75);
      border-bottom: 1px solid #1e293b;
    }
    .theme-dark .nav-btn {
      background-color: #1e293b;
      color: #94a3b8;
    }
    .theme-dark .nav-btn:hover {
      background-color: #334155;
      color: #f8fafc;
    }

    /* VARIANT THEME 2: THEME LIGHT (KUNING CERAH / SENJA) */
    .theme-light {
      background: linear-gradient(135deg, #fef08a 0%, #fef9c3 50%, #ffedd5 100%);
      color: #1e293b;
    }
    .theme-light .header-glass {
      background-color: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(234, 179, 8, 0.3);
      box-shadow: 0 4px 20px -10px rgba(234, 179, 8, 0.2);
    }
    .theme-light .nav-btn {
      background-color: rgba(255, 255, 255, 0.8);
      color: #a16207;
      border: 1px solid rgba(234, 179, 8, 0.4);
    }
    .theme-light .nav-btn:hover {
      background-color: #fef08a;
      color: #713f12;
    }
    .theme-light #info-hari-screen {
      background-color: rgba(234, 179, 8, 0.1);
      border-color: rgba(234, 179, 8, 0.2);
      color: #a16207;
    }
    .theme-light #statusArea p {
      color: #a16207;
    }

    /* ANIMASI HILANG */
    .vanish {
      opacity: 0 !important;
      transform: scale(0.7) !important;
      filter: blur(8px);
      pointer-events: none;
    }
  </style>
</head>
<body class="theme-dark min-h-screen pb-36">

  <!-- HEADER UTAMA -->
  <header class="header-glass sticky top-0 z-50 px-4 py-3 backdrop-filter backdrop-blur-md transition-all">
    <div class="max-w-[1600px] mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
      
      <!-- Sisi Kiri: Logo + Jam -->
      <div class="flex items-center justify-between w-full sm:w-auto gap-4">
        <div class="flex items-center gap-2.5">
          <i class="fa-solid fa-bolt text-sky-500 text-lg"></i>
          <div>
            <h1 class="text-sm font-black tracking-tight uppercase">
              Radar <span class="text-sky-500">Penggerak</span>
            </h1>
            <div class="flex items-center gap-2 mt-0.5">
              <span id="live-date" class="text-[9px] font-bold tracking-wider opacity-60">-</span>
              <span class="w-1 h-1 rounded-full bg-current opacity-40"></span>
              <span id="live-clock" class="text-[9px] font-bold clock-font text-sky-500">00:00:00</span>
            </div>
          </div>
        </div>
        
        <!-- Toggle Mode Kecil di HP -->
        <button onclick="toggleTema()" class="sm:hidden w-8 h-8 rounded-lg flex items-center justify-center text-sm bg-slate-800/10 hover:bg-slate-800/20 transition-all">
          <i id="theme-icon-mobile" class="fa-solid fa-sun text-amber-500"></i>
        </button>
      </div>

      <!-- Sisi Kanan: Panel Navigasi & Kontrol -->
      <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-2">
        <!-- Tombol Kembali Ke Dashboard -->
        <a href="https://manajemen.ppmuy.com/dashboard.html" class="nav-btn px-4 py-1.5 rounded-xl text-[10px] font-bold uppercase tracking-wider transition-all flex items-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-arrow-left"></i> Dashboard
        </a>

        <!-- Status Indikator Hari -->
        <div id="info-hari-screen" class="px-4 py-1.5 bg-sky-500/5 rounded-xl border border-sky-500/10 text-[10px] font-bold tracking-wide text-slate-400">
          Sinkronisasi satelit...
        </div>

        <!-- Tombol Switch Tema Desktop -->
        <button onclick="toggleTema()" class="hidden sm:flex nav-btn h-8 w-8 rounded-xl items-center justify-center transition-all shadow-sm cursor-pointer">
          <i id="theme-icon-desktop" class="fa-solid fa-sun text-amber-500"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- SEKSI JENDELA MOTIVASI RANDOM -->
  <section class="max-w-[1200px] mx-auto px-6 mt-6">
    <div class="w-full px-5 py-3 rounded-2xl border bg-opacity-50 transition-all flex items-start gap-3 shadow-inner text-xs font-semibold
      theme-dark:bg-slate-900/40 theme-dark:border-slate-800/80 theme-dark:text-slate-300
      theme-light:bg-white/60 theme-light:border-yellow-300/40 theme-light:text-yellow-950">
      <i class="fa-solid fa-quote-left text-sky-500 text-sm mt-0.5 shrink-0"></i>
      <p id="box-motivasi" class="italic animate-pulse">Memanggil gelombang motivasi harian dari cloud server...</p>
    </div>
  </section>

  <!-- KONTEN UTAMA RADAR GRID -->
  <main class="max-w-[1600px] mx-auto px-6 mt-6">
    
    <!-- Animasi Loading -->
    <div id="statusArea" class="flex flex-col items-center justify-center py-24 text-center">
      <div class="w-10 h-10 border-4 border-slate-700/40 border-t-sky-500 rounded-full animate-spin mb-4"></div>
      <p class="text-[10px] font-bold tracking-widest text-slate-500 uppercase">Memetakan Personel Penggerak...</p>
    </div>

    <!-- Grid Kartu Mini Warna-Warni -->
    <div id="gridPenggerak" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-12 gap-2.5 hidden"></div>

    <!-- Panel Tombol Kunci -->
    <div id="panelAksi" class="fixed bottom-6 left-1/2 -translate-x-1/2 hidden z-50">
      <button onclick="kunciSesiGaibMassal()" class="px-6 py-3 bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white rounded-xl font-black text-[11px] uppercase tracking-widest shadow-lg shadow-rose-500/20 hover:shadow-rose-500/40 active:scale-95 transition-all flex items-center gap-2 cursor-pointer">
        <i class="fa-solid fa-lock"></i> Kunci Radar & Absen Gaib (Poin 5)
      </button>
    </div>

  </main>

  <script>
    // PASTI KAN MASUKKAN URL EXEC DEPLOYMENT APPS SCRIPT ANDA DI SINI
    const urlScript = "https://script.google.com/macros/s/AKfycby0wyCx83Kf8XFpxaLiRy96noe0jaTlWBLg-M2XnfG0YqeZytE0vaR9QPzFWP7mpk_rlQ/exec"; 
    
    let dataSantriLokal = [];

    // Daftar Gradasi Warna Kartu Estetis Ringan (Lolos kontras teks putih/gelap)
    const daftarWarnaKartu = [
      "from-emerald-500 to-teal-600 text-white shadow-emerald-500/10",
      "from-blue-500 to-indigo-600 text-white shadow-blue-500/10",
      "from-purple-500 to-fuchsia-600 text-white shadow-purple-500/10",
      "from-cyan-500 to-blue-600 text-white shadow-cyan-500/10",
      "from-violet-500 to-purple-600 text-white shadow-violet-500/10",
      "from-sky-500 to-cyan-600 text-white shadow-sky-500/10"
    ];

    window.addEventListener('DOMContentLoaded', () => {
      mulaiJam();
      muatDaftarJadwal();
    });

    function mulaiJam() {
      setInterval(() => {
        document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('id-ID');
      }, 1000);
      document.getElementById('live-date').innerText = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();
    }

    function toggleTema() {
      const b = document.body;
      const iconD = document.getElementById('theme-icon-desktop');
      const iconM = document.getElementById('theme-icon-mobile');
      
      if (b.classList.contains('theme-dark')) {
        b.className = 'theme-light min-h-screen pb-36';
        iconD.className = 'fa-solid fa-moon text-indigo-600';
        iconM.className = 'fa-solid fa-moon text-indigo-600';
      } else {
        b.className = 'theme-dark min-h-screen pb-36';
        iconD.className = 'fa-solid fa-sun text-amber-500';
        iconM.className = 'fa-solid fa-sun text-amber-500';
      }
    }

    function muatDaftarJadwal() {
      fetch(`${urlScript}?aksi=ambil_jadwal_hari_ini`)
        .then(res => res.json())
        .then(res => {
          if(res.status === "error") {
            document.getElementById("statusArea").innerHTML = `<p class="text-xs font-bold text-rose-500">${res.message}</p>`;
            return;
          }
          
          dataSantriLokal = res.data;
          
          // Suntik kata motivasi ke dalam boks
          const boxMoti = document.getElementById('box-motivasi');
          boxMoti.innerText = `"${res.motivasi}"`;
          boxMoti.classList.remove('animate-pulse');

          document.getElementById('info-hari-screen').innerHTML = `HARI INI: <span class="font-extrabold text-sky-500">${res.hari}</span>`;
          document.getElementById('statusArea').classList.add('hidden');
          document.getElementById('gridPenggerak').classList.remove('hidden');
          document.getElementById('panelAksi').classList.remove('hidden');
          
          renderGrid();
        })
        .catch(() => {
          document.getElementById("statusArea").innerHTML = `<p class="text-xs font-bold text-rose-500">Gagal Sinkronisasi Cloud Server.</p>`;
        });
    }

    function renderGrid() {
      const container = document.getElementById('gridPenggerak');
      container.innerHTML = '';

      if (dataSantriLokal.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-12 text-[10px] font-bold uppercase tracking-widest opacity-50">
            <i class="fa-solid fa-circle-check text-xl text-sky-500 mb-1.5 block"></i> Sesi Telah Bersih / Dikunci Luar Radar
          </div>
        `;
        return;
      }

      dataSantriLokal.forEach((santri, indeks) => {
        const card = document.createElement('div');
        card.id = `card-${santri.nik}`;
        
        // Memilih varian warna secara acak dari palet berdasarkan urutan indeks data
        const skemaWarna = daftarWarnaKartu[indeks % daftarWarnaKartu.length];
        
        // Ukuran dikecilkan (padding mini 10px 8px, tinggi minimum 52px, text 11px)
        card.className = `bg-gradient-to-br ${skemaWarna} p-2.5 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer min-height-[52px] shadow-sm transform transition-all duration-300 hover:-translate-y-1 hover:scale-[1.02] active:scale-95`;
        
        const namaEsc = (santri.nama || "").replace(/`/g, "\\`").replace(/"/g, "&quot;");
        card.setAttribute('onclick', `eksekusiHadir(\`${santri.nik}\`, \`${namaEsc}\`, \`${santri.gender}\`, \`${santri.status}\`, \`${santri.hari}\`)`);
        
        card.innerHTML = `
          <h3 class="text-[11px] font-bold tracking-wide uppercase truncate max-w-full">${santri.nama}</h3>
          <span class="text-[8px] opacity-80 font-medium tracking-wider mt-0.5">${santri.status}</span>
        `;
        container.appendChild(card);
      });
    }

    function eksekusiHadir(nik, nama, gender, status, hari) {
      const card = document.getElementById(`card-${nik}`);
      if(card) card.classList.add('vanish');
      
      dataSantriLokal = dataSantriLokal.filter(s => s.nik !== nik);
      setTimeout(() => { if(card) card.remove(); renderGrid(); }, 250);

      fetch(urlScript, {
        method: 'POST',
        body: JSON.stringify({
          aksi: "simpan_absen",
          data: [{ nik: nik, nama: nama, gender: gender, status: status, hari: hari, kehadiran: "HADIR", poin: 0 }]
        })
      }).catch(e => console.error(e));
    }

    function kunciSesiGaibMassal() {
      if (dataSantriLokal.length === 0) return alert("Tidak ada data santri tersisa.");
      if (!confirm(`Kunci Sesi Hari Ini? Sisa ${dataSantriLokal.length} santri dimasukkan status GAIB (Pelanggaran Poin 5).`)) return;

      const panel = document.getElementById('panelAksi');
      panel.style.opacity = "0.5";
      panel.style.pointerEvents = "none";

      const dataGaibMassal = dataSantriLokal.map(s => {
        return { nik: s.nik, nama: s.nama, gender: s.gender, status: s.status, hari: s.hari, kehadiran: "GAIB", poin: 5 };
      });

      fetch(urlScript, {
        method: "POST",
        body: JSON.stringify({ aksi: "simpan_absen", data: dataGaibMassal })
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          alert("Radar dikunci! Status GAIB berhasil didistribusikan.");
          location.reload();
        }
      })
      .catch(() => {
        alert("Gangguan transmisi awan.");
        panel.style.opacity = "1";
        panel.style.pointerEvents = "auto";
      });
    }
  </script>
</body>
</html>
