<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADAR PATROLI KETERTIBAN - PENGURUS PPMUY</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cyber: #0a0f1d;
      --card-cyber: #131c33;
      --neon-green: #39ff14;
      --neon-cyan: #00f3ff;
      --neon-red: #ff3131;
      --text-main: #e2e8f0;
      --border-neon: rgba(0, 243, 255, 0.2);
    }
    .light-theme {
      --bg-cyber: #f0f4f8;
      --card-cyber: #ffffff;
      --neon-green: #2b6cb0;
      --neon-cyan: #319795;
      --neon-red: #e53e3e;
      --text-main: #2d3748;
      --border-neon: rgba(49, 151, 149, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: var(--bg-cyber);
      color: var(--text-main);
      overflow-x: hidden;
      transition: background-color 0.4s ease;
    }
    header {
      background: linear-gradient(180deg, rgba(19,28,51,0.8) 0%, rgba(10,15,29,0) 100%);
      padding: 25px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-neon);
      position: relative;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 10px var(--neon-cyan);
    }
    .light-theme h1 { color: var(--text-main); text-shadow: none; }
    .sub-title {
      font-size: 1rem;
      color: var(--neon-cyan);
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 4px;
    }
    .controls-container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    .dashboard-panel {
      background: var(--card-cyber);
      border: 1px solid var(--border-neon);
      border-radius: 8px;
      padding: 12px 20px;
      display: flex;
      gap: 30px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    .stat-box { display: flex; flex-direction: column; }
    .stat-val { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: var(--neon-cyan); font-weight: bold; }
    .stat-lbl { font-size: 0.8rem; text-transform: uppercase; opacity: 0.7; }
    .filter-btn-group { display: flex; gap: 10px; }
    .btn-cyber {
      background: rgba(19,28,51,0.6);
      border: 1px solid var(--neon-cyan);
      color: var(--text-main);
      padding: 8px 16px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      border-radius: 4px;
      transition: all 0.3s;
    }
    .btn-cyber:hover, .btn-cyber.active {
      background: var(--neon-cyan);
      color: #0a0f1d;
      box-shadow: 0 0 10px var(--neon-cyan);
    }
    .theme-toggle {
      background: transparent;
      border: 1px solid var(--text-main);
      color: var(--text-main);
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 20px;
      font-size: 0.8rem;
    }
    .grid-radar {
      max-width: 1200px;
      margin: 0 auto 50px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }
    .card-cyber {
      background: var(--card-cyber);
      border: 1px solid var(--border-neon);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-cyber:hover {
      transform: translateY(-5px);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px rgba(0,243,255,0.3);
    }
    .card-cyber::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: var(--neon-cyan);
    }
    .card-cyber.gender-P::before { background: #ff007f; }
    .card-header-info { display: flex; justify-content: space-between; margin-bottom: 15px; }
    .badge-kelas {
      background: rgba(0,243,255,0.1);
      color: var(--neon-cyan);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      text-transform: uppercase;
      border: 1px solid rgba(0,243,255,0.3);
    }
    .card-cyber.gender-P .badge-kelas {
      background: rgba(255,0,127,0.1);
      color: #ff007f;
      border-color: rgba(255,0,127,0.3);
    }
    .nik-tag { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; opacity: 0.6; }
    .petugas-name { font-size: 1.4rem; font-weight: bold; margin-bottom: 20px; line-height: 1.2; letter-spacing: 0.5px; }
    .action-area { display: flex; justify-content: flex-end; }
    .btn-hadir-kilat {
      background: linear-gradient(90deg, #00f3ff 0%, #00a3ff 100%);
      color: #0a0f1d;
      border: none;
      padding: 10px 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0,243,255,0.4);
      transition: all 0.2s;
    }
    .btn-hadir-kilat:hover {
      filter: brightness(1.2);
      box-shadow: 0 4px 25px rgba(0,243,255,0.6);
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px;
      border: 2px dashed var(--border-neon);
      border-radius: 12px;
      font-size: 1.2rem;
      opacity: 0.7;
    }
    @media(max-width: 600px) {
      .controls-container { flex-direction: column; align-items: stretch; }
      .dashboard-panel { justify-content: space-around; }
      .filter-btn-group { justify-content: center; }
    }
  </style>
</head>
<body>

  <header>
    <h1>RADAR PATROLI KETERTIBAN</h1>
    <div class="sub-title">Sistem Oprak Massal Kolom K PPMUY</div>
  </header>

  <div class="controls-container">
    <div class="dashboard-panel">
      <div class="stat-box">
        <span class="stat-val" id="total-radar">0</span>
        <span class="stat-lbl">On Radar</span>
      </div>
      <div class="stat-box">
        <span class="stat-val" id="tgl-realtime">--/--</span>
        <span class="stat-lbl">Hari Ini</span>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()">MODE TEMA</button>
    </div>

    <div class="filter-btn-group">
      <button class="btn-cyber active" id="btn-all" onclick="setFilter('semua')">SEMUA</button>
      <button class="btn-cyber" id="btn-l" onclick="setFilter('L')">PUTRA</button>
      <button class="btn-cyber" id="btn-p" onclick="setFilter('PUTRI')">PUTRI</button>
    </div>
  </div>

  <main class="grid-radar" id="container-grid">
    <div class="empty-state">Menghubungkan jaringan cloud satelit...</div>
  </main>

  <script>
    // URL Deployment Web App Utama dari code1.gs Anda
    const urlScript = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec"; 
    let dataSantriLokal = [];
    let filterSekarang = "semua";

    document.getElementById("tgl-realtime").innerText = new Date().toLocaleDateString('id-ID', {day: 'numeric', month: 'short'});

    function toggleTheme() {
      document.body.classList.toggle("light-theme");
    }

    function setFilter(gender) {
      filterSekarang = gender;
      document.querySelectorAll(".filter-btn-group .btn-cyber").forEach(b => b.classList.remove("active"));
      if(gender === 'semua') document.getElementById("btn-all").classList.add("active");
      if(gender === 'L') document.getElementById("btn-l").classList.add("active");
      if(gender === 'PUTRI') document.getElementById("btn-p").classList.add("active");
      renderGrid();
    }

    function muatDaftarOprak() {
      // Menembak aksi "get_initial_data_oprak" agar lolos gerbang utama code1.gs
      fetch(`${urlScript}?aksi=get_initial_data_oprak`)
        .then(response => response.json())
        .then(res => {
          if(res.status === "error" || !res.data || res.data.length === 0) {
            dataSantriLokal = [];
            renderGrid();
            return;
          }
          dataSantriLokal = res.data;
          renderGrid();
        })
        .catch(err => {
          console.error(err);
          document.getElementById("container-grid").innerHTML = `<div class="empty-state" style="border-color:#ff3131; color:#ff3131;">Gagal terhubung dengan radar cloud pondok.</div>`;
        });
    }

    function renderGrid() {
      const container = document.getElementById("container-grid");
      container.innerHTML = "";

      let dataFilter = dataSantriLokal.filter(s => {
        if (filterSekarang === "semua") return true;
        return s.gender === filterSekarang;
      });

      document.getElementById("total-radar").innerText = dataFilter.length;

      if(dataFilter.length === 0) {
        container.innerHTML = `<div class="empty-state">Radar Senyap. Semua petugas di kategori ini sudah absen atau data Kolom K kosong.</div>`;
        return;
      }

      dataFilter.forEach(santri => {
        const card = document.createElement("div");
        card.className = `card-cyber gender-${santri.gender}`;
        card.id = `card-${santri.nik}`;
        card.innerHTML = `
          <div class="card-header-info">
            <span class="badge-kelas">${santri.kelas} (Putaran ${santri.putaran})</span>
            <span class="nik-tag">ID-${santri.nik.substring(0,5)}</span>
          </div>
          <div class="petugas-name">${santri.nama}</div>
          <div class="action-area">
            <button class="btn-hadir-kilat" onclick="eksekusiHadirKilat('${santri.nik}', '${santri.nama.replace(/'/g, "\\'")}', this.closest('.card-cyber'))">KONFIRMASI HADIR</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function eksekusiHadirKilat(nik, nama, elemen) {
      elemen.style.transform = "scale(0)";
      elemen.style.opacity = "0";
      
      setTimeout(() => {
        dataSantriLokal = dataSantriLokal.filter(s => s.nik !== nik);
        elemen.remove();
        
        const container = document.getElementById("container-grid");
        if (!container.querySelector('.card-cyber')) {
          renderGrid();
        } else {
          let currentVal = parseInt(document.getElementById("total-radar").innerText);
          document.getElementById("total-radar").innerText = currentVal > 0 ? currentVal - 1 : 0;
        }
      }, 300);

      // Mengirimkan data via POST resmi menuju gerbang utama
      fetch(`${urlScript}?aksi=konfirmasi_hadir_oprak&nik=${nik}&nama=${encodeURIComponent(nama)}`, {
        method: 'POST'
      })
      .then(r => r.json())
      .then(respon => {
        if(respon.status !== "success") {
          console.error("Gagal update status cloud: " + respon.message);
        }
      })
      .catch(e => {
        console.error("Gagal menggapai server pusat", e);
      });
    }

    window.onload = muatDaftarOprak;
  </script>
</body>
</html>
