<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presensi Kedatangan Santri</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background-color: #ffffff;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border-left: 5px solid #007bff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    .card .nama {
      font-weight: bold;
      font-size: 16px;
      color: #2c3e50;
      margin-bottom: 5px;
    }
    .card .kelas {
      font-size: 13px;
      color: #6c757d;
      margin-bottom: 12px;
    }
    .card .info-badge {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      background-color: #eef2f7;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .card .telat {
      color: #d9534f;
      font-weight: bold;
    }
    .card .denda {
      color: #28a745;
      font-weight: bold;
    }
    .loading {
      text-align: center;
      font-size: 18px;
      color: #666;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <h1>Presensi Kedatangan Santri</h1>
  <div id="loading" class="loading">Memuat data santri...</div>
  <div class="grid-container" id="santriContainer"></div>

  <script>
    // URL Google Apps Script milik Anda
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyl6D9exf7nhrFE_K7Jcmt2dNOn0_Dw0BKgauu627xBpibZHk-Z01wEnMjnlX4Kgt-8/exec";

    async function loadSantriData() {
      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getData" })
        });
        const result = await response.json();

        document.getElementById("loading").style.display = "none";
        const container = document.getElementById("santriContainer");
        container.innerHTML = "";

        if (!result.data || result.data.length === 0) {
          container.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>Semua santri telah dicatat kedatangannya!</p>";
          return;
        }

        result.data.forEach(santri => {
          const card = document.createElement("div");
          card.className = "card";
          card.id = `santri-${santri.rowIndex}`;
          card.onclick = () => tandaiHadir(santri.rowIndex, card);

          card.innerHTML = `
            <div>
              <div class="nama">${santri.nama}</div>
              <div class="kelas">${santri.kelas}</div>
            </div>
            <div class="info-badge">
              <span class="telat">Telat: ${santri.jumlahTelat}</span>
              <span class="denda">Denda: ${typeof santri.denda === 'number' ? 'Rp' + santri.denda.toLocaleString('id-ID') : santri.denda}</span>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (error) {
        document.getElementById("loading").innerText = "Gagal memuat data. Pastikan Apps Script sudah di-deploy dengan akses 'Anyone'.";
        console.error(error);
      }
    }

    async function tandaiHadir(rowIndex, cardElement) {
      // Hilangkan kartu secara instan dari tampilan aplikasi
      cardElement.style.display = "none";

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "catat",
            rowIndex: rowIndex
          })
        });
      } catch (error) {
        alert("Gagal memperbarui data di Google Sheets!");
        cardElement.style.display = "flex"; // Kembalikan tampilan kartu jika ada error
      }
    }

    // Panggil fungsi saat halaman dibuka
    loadSantriData();
  </script>
</body>
</html>
