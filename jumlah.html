<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Jumlah - E-Pesantren</title>
    
    <!-- Memuat aset Tailwind & FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-5xl bg-slate-900/90 border border-slate-800/80 p-6 sm:p-8 rounded-3xl shadow-2xl flex flex-col gap-6">
        
        <!-- SECTION 1: REKAP JAMAAH SHALAT -->
        <div>
            <div class="flex items-center gap-2 mb-4">
                <i class="fa-solid fa-chart-simple text-cyan-400 text-lg"></i>
                <h2 class="text-sm font-black text-cyan-400 tracking-wider uppercase">REKAP JAMAAH SHALAT (SIKLUS OPERASIONAL)</h2>
            </div>
            
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">SUBUH</p>
                    <p id="val-subuh" class="text-2xl font-black text-white">0</p>
                </div>
                <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">DZUHUR</p>
                    <p id="val-dzuhur" class="text-2xl font-black text-white">0</p>
                </div>
                <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">ASHAR</p>
                    <p id="val-ashar" class="text-2xl font-black text-white">0</p>
                </div>
                <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">MAGHRIB</p>
                    <p id="val-maghrib" class="text-2xl font-black text-white">0</p>
                </div>
                <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-center col-span-2 sm:col-span-1">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">ISYA</p>
                    <p id="val-isya" class="text-2xl font-black text-white">0</p>
                </div>
            </div>
        </div>

        <!-- SECTION 2: REKAP KEGIATAN KEPESANTRENAN -->
        <div>
            <div class="flex items-center gap-2 mb-4">
                <i class="fa-solid fa-book-bookmark text-emerald-400 text-lg"></i>
                <h2 class="text-sm font-black text-emerald-400 tracking-wider uppercase">REKAP KEGIATAN KEPESANTRENAN</h2>
            </div>
            
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">QURANAN</p>
                    <p id="val-quranan" class="text-2xl font-black text-white">0</p>
                </div>
                <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">AFSAHAN</p>
                    <p id="val-afsahan" class="text-2xl font-black text-white">0</p>
                </div>
                <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">BELAJAR</p>
                    <p id="val-belajar" class="text-2xl font-black text-white">0</p>
                </div>
                <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">NDALEM</p>
                    <p id="val-ndalem" class="text-2xl font-black text-white">0</p>
                </div>
                <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">SOROGAN</p>
                    <p id="val-sorogan" class="text-2xl font-black text-white">0</p>
                </div>
                <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">PDF 1</p>
                    <p id="val-pdf1" class="text-2xl font-black text-white">0</p>
                </div>
                <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">PDF 2</p>
                    <p id="val-pdf2" class="text-2xl font-black text-white">0</p>
                </div>
                <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">PDF 3</p>
                    <p id="val-pdf3" class="text-2xl font-black text-white">0</p>
                </div>
                <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">ZIARAH</p>
                    <p id="val-ziarah" class="text-2xl font-black text-white">0</p>
                </div>
                <div class="bg-slate-950/80 border border-slate-800/80 p-4 rounded-2xl text-center">
                    <p class="text-[11px] font-black text-slate-300 uppercase tracking-wider mb-2">JUMATAN</p>
                    <p id="val-jumatan" class="text-2xl font-black text-white">0</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz_N9_agDmK4FqGBRxg53tlS7b8x2atP6yGIpj_LCvWa3CxWwOoRACDQeIpMtvZMshi/exec";

        async function muatDataRekap() {
            try {
                let response = await fetch(API_URL);
                let result = await response.json();

                if (result && result.rekap) {
                    const data = result.rekap;

                    // Mengisi angka Jamaah Shalat
                    if (data["SUBUH"] !== undefined) document.getElementById('val-subuh').innerText = data["SUBUH"];
                    if (data["DZUHUR"] !== undefined) document.getElementById('val-dzuhur').innerText = data["DZUHUR"];
                    if (data["ASHAR"] !== undefined) document.getElementById('val-ashar').innerText = data["ASHAR"];
                    if (data["MAGHRIB"] !== undefined) document.getElementById('val-maghrib').innerText = data["MAGHRIB"];
                    if (data["ISYA"] !== undefined) document.getElementById('val-isya').innerText = data["ISYA"];

                    // Mengisi angka Kegiatan Kepesantrenan
                    if (data["QURANAN"] !== undefined) document.getElementById('val-quranan').innerText = data["QURANAN"];
                    if (data["AFSAHAN"] !== undefined) document.getElementById('val-afsahan').innerText = data["AFSAHAN"];
                    if (data["BELAJAR"] !== undefined) document.getElementById('val-belajar').innerText = data["BELAJAR"];
                    if (data["NDALEM"] !== undefined) document.getElementById('val-ndalem').innerText = data["NDALEM"];
                    if (data["SOROGAN"] !== undefined) document.getElementById('val-sorogan').innerText = data["SOROGAN"];
                    if (data["PDF 1"] !== undefined) document.getElementById('val-pdf1').innerText = data["PDF 1"];
                    if (data["PDF 2"] !== undefined) document.getElementById('val-pdf2').innerText = data["PDF 2"];
                    if (data["PDF 3"] !== undefined) document.getElementById('val-pdf3').innerText = data["PDF 3"];
                    if (data["ZIARAH"] !== undefined) document.getElementById('val-ziarah').innerText = data["ZIARAH"];
                    if (data["JUMATAN"] !== undefined) document.getElementById('val-jumatan').innerText = data["JUMATAN"];
                }
            } catch (err) {
                console.error("Gagal memuat rekap:", err);
            }
        }

        // Jalankan saat halaman dibuka
        window.addEventListener('DOMContentLoaded', muatDataRekap);
    </script>
</body>
</html>
