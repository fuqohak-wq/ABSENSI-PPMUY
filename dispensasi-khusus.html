<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Otorisasi Dispensasi Khusus - PPMUY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Transisi Halus Global */
    * { transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease; }
    
    /* Kustomisasi Skema Warna Menggunakan Variabel CSS Murni */
    body {
      --bg-main: #09090b;       --bg-panel: #18181b;     --bg-input: #09090b;
      --border-color: #27272a;  --text-main: #f4f4f5;    --text-muted: #71717a;
      --bg-card: #09090b;       --bg-card-hover: #27272a;
    }
    
    body.light-mode {
      --bg-main: #f1f5f9;       --bg-panel: #ffffff;     --bg-input: #f8fafc;
      --border-color: #cbd5e1;  --text-main: #0f172a;    --text-muted: #64748b;
      --bg-card: #f8fafc;       --bg-card-hover: #e2e8f0;
    }

    /* Menggunakan Variabel Pada Struktur CSS */
    .app-bg { background-color: var(--bg-main); color: var(--text-main); }
    .panel-bg { background-color: var(--bg-panel); border-color: var(--border-color); }
    .input-bg { background-color: var(--bg-input); border-color: var(--border-color); color: var(--text-main); }
    .card-bg { background-color: var(--bg-card); border-color: var(--border-color); color: var(--text-main); }
    .card-bg:hover { background-color: var(--bg-card-hover); }
    .text-muted-custom { color: var(--text-muted); }
    .border-custom { border-color: var(--border-color); }

    /* Animasi Kartu Saat Hilang */
    .fade-out-card {
      opacity: 0;
      transform: scale(0.9) translateY(-10px);
      transition: all 0.3s ease;
    }

    /* Custom Checkbox Style */
    .kegiatan-checkbox:checked + label {
      border-color: #3b82f6 !important;
      background-color: rgba(59, 130, 246, 0.15) !important;
      color: #3b82f6 !important;
    }
  </style>
</head>
<body class="app-bg min-h-screen font-sans antialiased pb-12">

  <nav class="panel-bg border-b shadow-sm py-4 px-6 mb-8 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="bg-blue-600/10 p-2 rounded-lg text-blue-500 border border-blue-500/20">
        <i class="fa-solid fa-shield-cat text-xl"></i>
      </div>
      <div>
        <h1 class="text-md font-bold tracking-wide uppercase">Gateway Dispensasi</h1>
        <p class="text-[10px] text-muted-custom font-mono">NODE KONTROL REGISTRASI - PPMUY</p>
      </div>
    </div>
    
    <button onclick="toggleTheme()" class="panel-bg border text-xs font-mono px-4 py-2 rounded-lg flex items-center gap-2 hover:opacity-80 shadow-sm">
      <i id="themeIcon" class="fa-solid fa-sun text-amber-500"></i> <span id="themeText">MODE TERANG</span>
    </button>
  </nav>

  <main class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <section class="lg:col-span-5 space-y-6">
      <div class="panel-bg border rounded-2xl p-6 shadow-sm space-y-5">
        <h2 class="text-sm font-bold uppercase tracking-wider border-b border-custom pb-3 font-mono">
          <i class="fa-solid fa-file-signature text-blue-500 mr-1"></i> Form Validasi Otorisasi
        </h2>
        
        <form id="formDispensasi" onsubmit="ajukanDispensasi(event)">
          <div class="space-y-4">
            
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider mb-1.5 text-muted-custom font-mono">Personel Terpilih</label>
              <div class="relative">
                <input type="text" id="inputNama" readonly required placeholder="Klik kartu santri di deck kanan..." 
                  class="input-bg w-full px-4 py-2.5 text-sm rounded-xl border outline-none focus:border-blue-500 font-semibold shadow-inner placeholder-gray-500">
                <button type="button" onclick="resetTerpilih()" id="btnResetTerpilih" class="hidden absolute right-3 top-3 text-xs text-rose-500 hover:underline font-mono">
                  <i class="fa-solid fa-rotate-left"></i> Batal
                </button>
              </div>
              <input type="hidden" id="inputNIK" required>
            </div>

            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider mb-1.5 text-muted-custom font-mono">Kategori Dispensasi</label>
              <select id="selectKategori" onchange="aturLimitEksklusif()" class="input-bg w-full px-4 py-2.5 text-sm rounded-xl border outline-none focus:border-blue-500 font-medium">
                <option value="Khidmah">🛡️ Kategori Khidmah (Maks. 6 Kegiatan)</option>
                <option value="Melekan">☕ Kategori Melekan (Maks. 3 Kegiatan)</option>
              </select>
            </div>

            <div>
              <div class="flex justify-between items-center mb-1.5">
                <label class="block text-[11px] font-bold uppercase tracking-wider text-muted-custom font-mono">Daftar Kegiatan Bebas</label>
                <span id="counterLimit" class="text-[10px] font-mono text-blue-500 font-bold bg-blue-500/10 border border-blue-500/20 px-2 py-0.5 rounded-md">0 / 6</span>
              </div>
              
              <div class="grid grid-cols-2 gap-2 input-bg p-3 rounded-xl border max-h-44 overflow-y-auto shadow-inner">
                <div class="relative">
                  <input type="checkbox" id="keg1" value="Kajian Sore" class="kegiatan-checkbox hidden" onchange="hitungChecked()">
                  <label for="keg1" class="block text-center text-xs py-2 px-1 card-bg border rounded-lg cursor-pointer truncate font-medium">📚 Kajian Sore</label>
                </div>
                <div class="relative">
                  <input type="checkbox" id="keg2" value="Madrasah Diniyah" class="kegiatan-checkbox hidden" onchange="hitungChecked()">
                  <label for="keg2" class="block text-center text-xs py-2 px-1 card-bg border rounded-lg cursor-pointer truncate font-medium">🕌 Madin</label>
                </div>
                <div class="relative">
                  <input type="checkbox" id="keg3" value="Tahfidz" class="kegiatan-checkbox hidden" onchange="hitungChecked()">
                  <label for="keg3" class="block text-center text-xs py-2 px-1 card-bg border rounded-lg cursor-pointer truncate font-medium">📖 Tahfidz</label>
                </div>
                <div class="relative">
                  <input type="checkbox" id="keg4" value="Jamaah Maktubah" class="kegiatan-checkbox hidden" onchange="hitungChecked()">
                  <label for="keg4" class="block text-center text-xs py-2 px-1 card-bg border rounded-lg cursor-pointer truncate font-medium">🧎 Maktubah</label>
                </div>
                <div class="relative">
                  <input type="checkbox" id="keg5" value="Piket Kebersihan" class="kegiatan-checkbox hidden" onchange="hitungChecked()">
                  <label for="keg5" class="block text-center text-xs py-2 px-1 card-bg border rounded-lg cursor-pointer truncate font-medium">🧹 Piket Bersih</label>
                </div>
                <div class="relative">
                  <input type="checkbox" id="keg6" value="Rapat Organisasi" class="kegiatan-checkbox hidden" onchange="hitungChecked()">
                  <label for="keg6" class="block text-center text-xs py-2 px-1 card-bg border rounded-lg cursor-pointer truncate font-medium">💼 Rapat Org</label>
                </div>
              </div>
            </div>

            <button type="submit" id="btnSubmit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold font-mono text-xs tracking-wider rounded-xl shadow-md transform hover:-translate-y-0.5 active:translate-y-0 transition">
              <i class="fa-solid fa-cloud-arrow-up mr-1"></i> SIMPAN & PUBLIKASIKAN DATA
            </button>
          </div>
        </form>
      </div>

      <div class="panel-bg border rounded-2xl p-5 shadow-sm space-y-3 font-mono">
        <p class="text-[10px] font-bold text-muted-custom uppercase tracking-widest border-b border-custom pb-2"><i class="fa-solid fa-chart-bar mr-1"></i> Rekap Otorisasi Hari Ini</p>
        <div class="grid grid-cols-2 gap-3">
          <div class="input-bg p-3 rounded-xl border">
            <span class="text-[9px] text-muted-custom block">TOTAL KHIDMAH</span>
            <span id="txtKhidmah" class="text-xl font-bold text-emerald-500">0</span>
          </div>
          <div class="input-bg p-3 rounded-xl border">
            <span class="text-[9px] text-muted-custom block">TOTAL MELEKAN</span>
            <span id="txtMelekan" class="text-xl font-bold text-amber-500">0</span>
          </div>
        </div>
      </div>
    </section>

    <section class="lg:col-span-7 panel-bg border rounded-2xl p-6 shadow-sm flex flex-col h-[620px]">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-custom pb-4 mb-4 gap-3">
        <div>
          <h2 class="text-sm font-bold uppercase tracking-wider">Database Node Santri</h2>
          <p class="text-[10px] text-muted-custom font-mono">Klik kartu santri untuk memindahkannya ke form disposisi</p>
        </div>
        
        <div class="relative w-full sm:w-60">
          <input type="text" id="searchDeck" placeholder="Cari nama santri..." autocomplete="off"
            class="input-bg w-full pl-4 pr-9 py-2 text-xs rounded-xl border focus:outline-none focus:border-blue-500 shadow-inner">
          <i class="fa-solid fa-magnifying-glass absolute right-3 top-3 text-xs text-muted-custom"></i>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto pr-1">
        <div id="gridSantriDispo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
          <div class="col-span-full text-center py-24 text-muted-custom font-mono text-xs">
            <i class="fa-solid fa-spinner animate-spin text-xl text-blue-500 mb-2 block"></i> Membaca Data Ledger Cloud Node...
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // MASUKKAN URL DEPLOYMENT WEB APP APPS SCRIPT ANDA DI SINI
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec"; 

    let databaseSantri = [];
    let santriDipilihSaatIni = null;
    let maxAllowed = 6;

    document.addEventListener("DOMContentLoaded", function() {
      tarikDatabaseMaster();
    });

    // SISTEM TEMA DENGAN CLASS INJEKSI PADA BODY (GARANSI 100% LAYOUT AMAN)
    function toggleTheme() {
      const body = document.body;
      const themeIcon = document.getElementById("themeIcon");
      const themeText = document.getElementById("themeText");
      
      if (body.classList.contains("light-mode")) {
        body.classList.remove("light-mode");
        themeIcon.className = "fa-solid fa-sun text-amber-500";
        themeText.innerText = "MODE TERANG";
      } else {
        body.classList.add("light-mode");
        themeIcon.className = "fa-solid fa-moon text-indigo-600";
        themeText.innerText = "MODE GELAP";
      }
    }

    function aturLimitEksklusif() {
      const kategori = document.getElementById("selectKategori").value;
      maxAllowed = kategori === "Khidmah" ? 6 : 3;
      document.querySelectorAll(".kegiatan-checkbox").forEach(cb => cb.checked = false);
      hitungChecked();
    }

    function hitungChecked() {
      const checkedBoxes = document.querySelectorAll(".kegiatan-checkbox:checked");
      document.getElementById("counterLimit").innerText = `${checkedBoxes.length} / ${maxAllowed}`;
      
      const unCheckedBoxes = document.querySelectorAll(".kegiatan-checkbox:not(:checked)");
      if (checkedBoxes.length >= maxAllowed) {
        unCheckedBoxes.forEach(cb => {
          cb.disabled = true;
          cb.nextElementSibling.style.opacity = "0.3";
          cb.nextElementSibling.style.cursor = "not-allowed";
        });
      } else {
        document.querySelectorAll(".kegiatan-checkbox").forEach(cb => {
          cb.disabled = false;
          cb.nextElementSibling.style.opacity = "1";
          cb.nextElementSibling.style.cursor = "pointer";
        });
      }
    }

    function tarikDatabaseMaster() {
      const container = document.getElementById("gridSantriDispo");
      if(WEB_APP_URL.includes("URL_WEB_APP_SCRIPT_ANDA")) {
         container.innerHTML = `<div class="col-span-full text-center py-16 text-amber-500 font-mono text-xs px-4 border border-dashed border-amber-500/30 rounded-2xl bg-amber-500/5">⚠️ <strong>Konfigurasi Global Diperlukan:</strong><br><span class="text-gray-400 mt-1 block">Silakan letakkan tautan Web App Apps Script Anda pada variabel <code>WEB_APP_URL</code>.</span></div>`;
         return;
      }
      
      fetch(`${WEB_APP_URL}?aksi=ambil_database`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            databaseSantri = res.data;
            buildDeckMaster();
            tarikTelemetriHariIni();
          }
        }).catch(err => {
          container.innerHTML = `<div class="col-span-full text-center py-16 text-rose-500 font-mono text-xs px-4 border border-dashed border-rose-500/30 rounded-2xl bg-rose-500/5">🚨 <strong>CRITICAL CONNECTION ERROR:</strong><br><span class="text-gray-400 mt-1 block">Gagal terhubung dengan server Google Sheets Cloud.</span></div>`;
        });
    }

    // MEMBUAT RE-RENDER CARD DECK YANG ADAPTIF
    function buildDeckMaster() {
      const container = document.getElementById("gridSantriDispo");
      container.innerHTML = "";

      // Memfilter santri yang sedang tidak dimasukkan ke dalam form pilihan
      const listTersedia = databaseSantri.filter(s => !santriDipilihSaatIni || santriDipilihSaatIni.nik !== s.nik);

      if(listTersedia.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-20 text-muted-custom font-mono text-xs">Seluruh personel masuk antrean atau data kosong.</div>`;
        return;
      }

      listTersedia.forEach(s => {
        const div = document.createElement("div");
        div.className = "box-santri card-bg border p-3 rounded-xl cursor-pointer shadow-sm transition transform active:scale-95 font-mono flex flex-col justify-between h-20";
        div.setAttribute("data-nama", s.nama.toLowerCase());
        
        div.innerHTML = `
          <p class="text-xs font-bold tracking-tight line-clamp-1">${s.nama}</p>
          <div class="flex justify-between items-center mt-2 border-t border-custom pt-1">
            <span class="text-[9px] text-muted-custom">NIK: ${s.nik || '-'}</span>
            <i class="fa-solid fa-right-to-bracket text-[10px] text-blue-500 opacity-60"></i>
          </div>
        `;

        // LOGIKA KLIK KARTU HILANG DAN PINDAH KE FORM
        div.addEventListener("click", function() {
          div.classList.add("fade-out-card"); // Jalankan efek animasi CSS
          
          setTimeout(() => {
            // Jika ada santri yang sebelumnya tersemat, kembalikan dulu ke deck
            santriDipilihSaatIni = s; 
            
            document.getElementById("inputNama").value = s.nama;
            document.getElementById("inputNIK").value = s.nik || "000000";
            document.getElementById("btnResetTerpilih").classList.remove("hidden");
            
            // Re-render ulang deck kanan sehingga santri terpilih HILANG dari daftar
            buildDeckMaster();
          }, 250);
        });

        container.appendChild(div);
      });
    }

    // Fungsi Untuk Membatalkan Pilihan Santri (Mengembalikan kartu ke kanan)
    function resetTerpilih() {
      document.getElementById("inputNama").value = "";
      document.getElementById("inputNIK").value = "";
      document.getElementById("btnResetTerpilih").classList.add("hidden");
      santriDipilihSaatIni = null;
      buildDeckMaster();
    }

    function ajukanDispensasi(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      const nik = document.getElementById("inputNIK").value;
      const nama = document.getElementById("inputNama").value;
      const kategori = document.getElementById("selectKategori").value;
      
      const checkedBoxes = document.querySelectorAll(".kegiatan-checkbox:checked");
      if(checkedBoxes.length === 0) { alert("Pilih minimal 1 kegiatan dispensasi!"); return; }

      let arrKegiatan = [];
      checkedBoxes.forEach(cb => arrKegiatan.push(cb.value));
      const buktiStr = arrKegiatan.join(", ");

      btn.disabled = true;
      btn.innerText = "SEDANG MENGIRIM DATA LEDGER...";

      let targetUrl = `${WEB_APP_URL}?aksi=simpan_dispensasi_khusus&nik=${encodeURIComponent(nik)}&nama=${encodeURIComponent(nama)}&kategori=${encodeURIComponent(kategori)}&bukti=${encodeURIComponent(buktiStr)}`;

      fetch(targetUrl, { method: "POST" })
        .then(res => res.json())
        .then(res => {
          if(res.status === "success") {
            alert(`Dispensasi ${kategori} atas nama ${nama} Sukses Disimpan!`);
            document.getElementById("formDispensasi").reset();
            santriDipilihSaatIni = null; // hapus dari list form karena sudah sukses disimpan
            document.getElementById("btnResetTerpilih").classList.add("hidden");
            aturLimitEksklusif();
            buildDeckMaster(); // Refresh deck agar kartu muncul kembali untuk keperluan input masa depan
            tarikTelemetriHariIni();
          } else {
            alert("Gagal menyimpan data: " + res.message);
          }
        })
        .catch(err => alert("Error: Sambungan dengan node cloud terputus."))
        .finally(() => {
          btn.disabled = false;
          btn.innerText = "SIMPAN & PUBLIKASIKAN DATA";
        });
    }

    function tarikTelemetriHariIni() {
      if(WEB_APP_URL.includes("https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec")) return;
      fetch(`${WEB_APP_URL}?aksi=ambil_telemetri_dispensasi`)
        .then(res => res.json())
        .then(res => {
          if(res.status === "success") {
            document.getElementById("txtKhidmah").innerText = res.khidmah;
            document.getElementById("txtMelekan").innerText = res.melekan;
          }
        });
    }

    // SEARCH FILTER BAR DECK KANAN
    document.getElementById("searchDeck").addEventListener("input", function() {
      let val = this.value.trim().toLowerCase();
      document.querySelectorAll(".box-santri").forEach(b => {
        let text = b.getAttribute("data-nama");
        b.style.display = text.includes(val) ? "flex" : "none";
      });
    });
  </script>
</body>
</html>
