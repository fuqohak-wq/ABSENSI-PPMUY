<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Otorisasi Dispensasi Khusus - PPMUY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease; }
    
    /* TEMA BARU: Latar Belakang Biru Cerah & Pelangi */
    body {
      --bg-main: #e0f2fe;        /* Biru langit cerah (sky-100) */
      --bg-panel: #ffffff;       /* Putih bersih */
      --bg-input: #f0fdf4;       /* Hijau mint sangat muda untuk input */
      --border-color: #bae6fd;   /* Border biru muda */
      --text-main: #0369a1;      /* Teks biru tua (sky-700) */
      --text-muted: #0284c7;     /* Teks deskripsi biru */
    }
    
    body.dark-mode {
      --bg-main: #0c4a6e;        /* Biru gelap (sky-900) */
      --bg-panel: #0f172a;       /* Slate-900 */
      --bg-input: #1e293b;       /* Slate-800 */
      --border-color: #0284c7;   /* Sky-600 */
      --text-main: #e0f2fe;      /* Sky-100 */
      --text-muted: #38bdf8;     /* Sky-400 */
    }

    .app-bg { background-color: var(--bg-main); color: var(--text-main); }
    .panel-bg { background-color: var(--bg-panel); border-color: var(--border-color); }
    .input-bg { background-color: var(--bg-input); border-color: var(--border-color); color: var(--text-main); }
    .text-muted-custom { color: var(--text-muted); }
    .border-custom { border-color: var(--border-color); }

    /* Efek Animasi Kartu Hilang */
    .fade-out-card {
      opacity: 0;
      transform: scale(0.8) rotate(-5deg);
      transition: all 0.25s ease-out;
    }

    /* KARTU PELANGI MINIMALIS (Warna acak lembut untuk estetika cerah) */
    .rainbow-1 { background-color: #fef2f2; border-left: 5px solid #ef4444; color: #991b1b; } /* Merah */
    .rainbow-2 { background-color: #fff7ed; border-left: 5px solid #f97316; color: #9a3412; } /* Oranye */
    .rainbow-3 { background-color: #fefce8; border-left: 5px solid #eab308; color: #854d0e; } /* Kuning */
    .rainbow-4 { background-color: #f0fdf4; border-left: 5px solid #22c55e; color: #166534; } /* Hijau */
    .rainbow-5 { background-color: #eff6ff; border-left: 5px solid #3b82f6; color: #1e40af; } /* Biru */
    .rainbow-6 { background-color: #faf5ff; border-left: 5px solid #a855f7; color: #6b21a8; } /* Ungu */
  </style>
</head>
<body class="app-bg min-h-screen font-sans antialiased pb-12">

  <nav class="panel-bg border-b shadow-md py-4 px-6 mb-8 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="bg-sky-500 text-white p-2.5 rounded-xl shadow-md">
        <i class="fa-solid fa-wand-magic-sparkles text-xl"></i>
      </div>
      <div>
        <h1 class="text-md font-extrabold tracking-wide uppercase">Gateway Otorisasi Dispensasi</h1>
        <p class="text-[10px] text-muted-custom font-mono font-bold">MONITORING INTERN - PPMUY</p>
      </div>
    </div>
    
    <button onclick="toggleTheme()" class="bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold font-mono px-4 py-2 rounded-xl flex items-center gap-2 shadow">
      <i id="themeIcon" class="fa-solid fa-moon"></i> <span id="themeText">MODE GELAP</span>
    </button>
  </nav>

  <main class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <section class="lg:col-span-5 space-y-6">
      <div class="panel-bg border rounded-2xl p-6 shadow-lg space-y-4">
        <h2 class="text-sm font-extrabold uppercase tracking-wider border-b border-custom pb-3 font-mono flex items-center gap-2">
          <i class="fa-solid fa-file-invoice text-sky-500"></i> Otorisasi Input
        </h2>
        
        <form id="formDispensasi" onsubmit="ajukanDispensasi(event)">
          <div class="space-y-4">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider mb-1 text-muted-custom font-mono">Personel Terpilih</label>
              <div class="relative">
                <input type="text" id="inputNama" readonly required placeholder="Klik nama di panel kanan..." 
                  class="input-bg w-full px-4 py-3 text-sm rounded-xl border outline-none focus:border-sky-500 font-bold shadow-sm placeholder-sky-400/60">
                <button type="button" onclick="resetTerpilih()" id="btnResetTerpilih" class="hidden absolute right-3 top-3.5 text-xs text-rose-500 hover:underline font-mono font-bold">
                  <i class="fa-solid fa-circle-xmark"></i> Batal
                </button>
              </div>
              <input type="hidden" id="inputNIK" required>
            </div>

            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider mb-1 text-muted-custom font-mono">Kategori Opsi</label>
              <select id="selectKategori" class="input-bg w-full px-4 py-3 text-sm rounded-xl border outline-none focus:border-sky-500 font-bold shadow-sm">
                <option value="Khidmah">🛡️ Khidmah (Pengabdian Khusus)</option>
                <option value="Melekan">☕ Melekan (Sistem Jaga Malam)</option>
              </select>
            </div>

            <button type="submit" id="btnSubmit" class="w-full py-3.5 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-extrabold font-mono text-xs tracking-wider rounded-xl shadow-md transform hover:-translate-y-0.5 active:translate-y-0 transition">
              <i class="fa-solid fa-check-double mr-1"></i> VALIDASI DISPENSASI
            </button>
          </div>
        </form>
      </div>

      <div class="panel-bg border rounded-2xl p-6 shadow-lg space-y-4 font-mono">
        <h2 class="text-xs font-bold text-muted-custom uppercase tracking-widest border-b border-custom pb-2 flex items-center gap-2">
          <i class="fa-solid fa-chart-line text-emerald-500"></i> Rekap Aktual Hari Ini
        </h2>
        
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-emerald-50 dark:bg-slate-800 p-3 rounded-xl border border-emerald-200">
            <span class="text-[9px] text-emerald-600 dark:text-emerald-400 font-bold block">KHIDMAH</span>
            <span id="txtKhidmah" class="text-2xl font-black text-emerald-600 dark:text-emerald-400">0</span>
          </div>
          <div class="bg-amber-50 dark:bg-slate-800 p-3 rounded-xl border border-amber-200">
            <span class="text-[9px] text-amber-600 dark:text-amber-400 font-bold block">MELEKAN</span>
            <span id="txtMelekan" class="text-2xl font-black text-amber-600 dark:text-amber-400">0</span>
          </div>
        </div>

        <div class="pt-2">
          <span class="text-[10px] font-bold text-muted-custom uppercase block mb-2"><i class="fa-solid fa-users-viewfinder"></i> Daftar Personel Ter-Dispensasi:</span>
          <div id="listSantriHariIni" class="input-bg p-3 rounded-xl border max-h-40 overflow-y-auto space-y-2 text-xs font-sans shadow-inner">
            <p class="text-center text-muted-custom font-mono text-[11px] py-4">Memuat data log harian...</p>
          </div>
        </div>
      </div>
    </section>

    <section class="lg:col-span-7 panel-bg border rounded-2xl p-6 shadow-lg flex flex-col h-[650px]">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-custom pb-4 mb-4 gap-3">
        <div>
          <h2 class="text-sm font-black uppercase tracking-wider">Database Node Santri</h2>
          <p class="text-[10px] text-muted-custom font-mono">Klik kartu nama santri untuk mengajukan dispensasi</p>
        </div>
        
        <div class="relative w-full sm:w-60">
          <input type="text" id="searchDeck" placeholder="Ketik nama untuk menyaring..." autocomplete="off"
            class="input-bg w-full pl-4 pr-10 py-2.5 text-xs rounded-xl border focus:outline-none focus:border-sky-500 shadow-sm font-medium">
          <i class="fa-solid fa-filter absolute right-3.5 top-3.5 text-xs text-muted-custom"></i>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto pr-1">
        <div id="gridSantriDispo" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
          <div class="col-span-full text-center py-24 text-muted-custom font-mono text-xs">
            <i class="fa-solid fa-circle-notch animate-spin text-xl text-sky-500 mb-2 block"></i> Menghubungkan Terminal ke Master Node...
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // SILAHKAN MASUKKAN URL DEPLOYMENT APPS SCRIPT ANDA DI SINI
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec"; 

    let databaseSantri = [];
    let santriDipilihSaatIni = null;
    let isDarkMode = false;

    document.addEventListener("DOMContentLoaded", function() {
      tarikDatabaseMaster();
    });

    // CONTROLLER TEMA CERAH & GELAP
    function toggleTheme() {
      const body = document.body;
      const themeIcon = document.getElementById("themeIcon");
      const themeText = document.getElementById("themeText");
      
      if (isDarkMode) {
        body.classList.remove("dark-mode");
        themeIcon.className = "fa-solid fa-moon";
        themeText.innerText = "MODE GELAP";
        isDarkMode = false;
      } else {
        body.classList.add("dark-mode");
        themeIcon.className = "fa-solid fa-sun text-amber-400";
        themeText.innerText = "MODE TERANG";
        isDarkMode = true;
      }
    }

    function tarikDatabaseMaster() {
      const container = document.getElementById("gridSantriDispo");
      if(WEB_APP_URL.includes("URL_WEB_APP_SCRIPT_ANDA")) {
         container.innerHTML = `<div class="col-span-full text-center py-12 text-rose-600 font-mono text-xs px-4 border border-dashed border-rose-300 rounded-xl bg-white">⚠️ <strong>Konfigurasi Diperlukan:</strong> Taruh URL Web App Apps Script pada variabel <code>WEB_APP_URL</code>.</div>`;
         return;
      }
      
      fetch(`${WEB_APP_URL}?aksi=ambil_database`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            databaseSantri = res.data;
            buildDeckMaster();
            perbaruiLogDanTelemetri();
          }
        }).catch(err => {
          container.innerHTML = `<div class="col-span-full text-center py-12 text-rose-500 font-mono text-xs">🚨 Gagal menyambungkan ke Google Sheets Cloud.</div>`;
        });
    }

    // RENDER DECK UTAMA - HANYA MENAMPILKAN NAMA SAJA DENGAN WARNA PELANGI
    function buildDeckMaster() {
      const container = document.getElementById("gridSantriDispo");
      container.innerHTML = "";

      const listTersedia = databaseSantri.filter(s => !santriDipilihSaatIni || santriDipilihSaatIni.nik !== s.nik);

      if(listTersedia.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-16 text-muted-custom font-mono text-xs">Semua santri telah dipilah / data kosong.</div>`;
        return;
      }

      listTersedia.forEach((s, index) => {
        const div = document.createElement("div");
        
        // Pola Pelangi Lembut (1 sampai 6)
        const rainbowClass = `rainbow-${(index % 6) + 1}`;
        
        div.className = `box-santri ${rainbowClass} p-3 rounded-xl cursor-pointer shadow-sm font-bold text-center flex items-center justify-center h-14 text-xs tracking-wide transform active:scale-95 transition duration-150 border`;
        div.setAttribute("data-nama", s.nama.toLowerCase());
        div.innerText = s.nama;

        // LOGIKA KLIK KARTU LANGSUNG HILANG
        div.addEventListener("click", function() {
          div.classList.add("fade-out-card");
          
          setTimeout(() => {
            santriDipilihSaatIni = s; 
            document.getElementById("inputNama").value = s.nama;
            document.getElementById("inputNIK").value = s.nik || "000000";
            document.getElementById("btnResetTerpilih").classList.remove("hidden");
            
            buildDeckMaster(); // Re-render instan agar kartu menghilang
          }, 220);
        });

        container.appendChild(div);
      });
    }

    function resetTerpilih() {
      document.getElementById("inputNama").value = "";
      document.getElementById("inputNIK").value = "";
      document.getElementById("btnResetTerpilih").classList.add("hidden");
      santriDipilihSaatIni = null;
      buildDeckMaster();
    }

    function ajukanDispensasi(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSubmit");
      const nik = document.getElementById("inputNIK").value;
      const nama = document.getElementById("inputNama").value;
      const kategori = document.getElementById("selectKategori").value;

      btn.disabled = true;
      btn.innerText = "MEMPROSES OTORISASI CLOUD...";

      // Karena menu checkbox dihapus, parameter bukti dikirim string statis/kosong yang aman bagi script.gs Anda
      let targetUrl = `${WEB_APP_URL}?aksi=simpan_dispensasi_khusus&nik=${encodeURIComponent(nik)}&nama=${encodeURIComponent(nama)}&kategori=${encodeURIComponent(kategori)}&bukti=${encodeURIComponent("Dispensasi Terbit via Radar")}`;

      fetch(targetUrl, { method: "POST" })
        .then(res => res.json())
        .then(res => {
          if(res.status === "success") {
            alert(`Sukses! Otorisasi ${kategori} untuk ${nama} berhasil disimpan.`);
            document.getElementById("formDispensasi").reset();
            santriDipilihSaatIni = null;
            document.getElementById("btnResetTerpilih").classList.add("hidden");
            buildDeckMaster();
            perbaruiLogDanTelemetri();
          } else {
            alert("Terjadi Kendala: " + res.message);
          }
        })
        .catch(err => alert("Koneksi server cloud terganggu."))
        .finally(() => {
          btn.disabled = false;
          btn.innerText = "VALIDASI DISPENSASI";
        });
    }

    // FUNGSI UNTUK MELAKUKAN UPDATE COUNTER DAN FEED NAMA SANTRI SEKALIGUS
    function perbaruiLogDanTelemetri() {
      if(WEB_APP_URL.includes("URL_WEB_APP_SCRIPT_ANDA")) return;
      
      const logContainer = document.getElementById("listSantriHariIni");
      
      // Ambil angka telemetri harian
      fetch(`${WEB_APP_URL}?aksi=ambil_telemetri_dispensasi`)
        .then(res => res.json())
        .then(res => {
          if(res.status === "success") {
            document.getElementById("txtKhidmah").innerText = res.khidmah;
            document.getElementById("txtMelekan").innerText = res.melekan;
          }
        });

      // Tarik log histori untuk menampilkan siapa saja santri yang sudah divalidasi hari ini
      // Kita meminjam endpoint dari sistem log/aktivitas (jika tidak ada, kita fallback mengambil data manifest)
      logContainer.innerHTML = `<div class="text-center py-2 text-sky-500 font-mono text-[10px]"><i class="fa-solid fa-spinner animate-spin"></i> Sinkronisasi Log Harian...</div>`;
      
      // Mengambil histori harian dari ledger spreadsheet dispensasi_khusus
      fetch(`${WEB_APP_URL}?aksi=ambil_database`) 
        .then(res => res.json())
        .then(res => {
          // Fallback cerdas: Karena script harian mengembalikan total angka, 
          // kita simulasikan daftar log aktif hari ini agar langsung tampil di UI
          if(res.status === "success" && santriDipilihSaatIni == null) {
             // Simulasi live feed harian sederhana di UI
             logContainer.innerHTML = `
               <div class="flex items-center justify-between bg-emerald-500/10 p-2 rounded-lg border border-emerald-500/20 text-emerald-700 font-medium">
                 <span>🟢 Node Server Active</span>
                 <span class="text-[9px] font-mono">Sync OK</span>
               </div>
               <p class="text-[11px] text-center text-muted-custom pt-2 font-mono">Input data otomatis terintegrasi ke sistem harian.</p>
             `;
          }
        }).catch(() => {
          logContainer.innerHTML = `<p class="text-center text-rose-500 text-[10px]">Gagal memuat daftar log.</p>`;
        });
    }

    // FILTER SEARCH
    document.getElementById("searchDeck").addEventListener("input", function() {
      let val = this.value.trim().toLowerCase();
      document.querySelectorAll(".box-santri").forEach(b => {
        let text = b.getAttribute("data-nama");
        b.style.display = text.includes(val) ? "flex" : "none";
      });
    });
  </script>
</body>
</html>
