<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<style>

body{
background:linear-gradient(135deg,#3b82f6,#9333ea);
font-family:Segoe UI;
margin:0;
padding:0;
}

.container{
max-width:650px;
margin:30px auto;
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#4f46e5;
}

label{
font-weight:bold;
display:block;
margin-top:15px;
}

select,input,textarea{
width:100%;
padding:13px;
margin-top:8px;
border-radius:12px;
border:1px solid #ddd;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:15px;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

.simpan{
background:#10b981;
color:white;
}

.dashboard{
background:#4f46e5;
color:white;
}

#status{
text-align:center;
margin-top:20px;
font-weight:bold;
color:green;
}

</style>

</head>

<body>

<div class="container">

<h1>📋 Perizinan Santri PPMUY</h1>

<label>Santri</label>

<select id="santri">
<option>Pilih Santri</option>
</select>


<label>Jenis Izin</label>

<select id="jenis">
<option>Sakit</option>
<option>Keluar</option>
<option>Pulang</option>
</select>


<label>Alasan</label>

<textarea id="alasan"></textarea>


<label>Janji Kembali</label>

<input type="datetime-local" id="kembali">


<button class="simpan" onclick="simpan()">
✅ Simpan Izin
</button>


<button class="dashboard"
onclick="window.location.href='https://manajemen.ppmuy.com/dashboard.html'">
🏠 Kembali ke Dashboard
</button>


<div id="status"></div>

</div>


<script>

google.script.run.withSuccessHandler(function(data){

let html="";

data.forEach(x=>{

html+=`
<option
value="${x.nik}|${x.nama}|${x.kelas}">
${x.nama} (${x.kelas})
</option>
`;

});

document.getElementById("santri").innerHTML+=html;

}).getSantri();



function simpan(){

let p=document.getElementById("santri").value.split("|");

let obj={

nik:p[0],
nama:p[1],
kelas:p[2],

jenis:document.getElementById("jenis").value,

alasan:document.getElementById("alasan").value,

kembali:document.getElementById("kembali").value

};


google.script.run
.withSuccessHandler(function(msg){

document.getElementById("status").innerHTML=
"✅ "+msg;

document.getElementById("alasan").value="";
})
.simpanIzin(obj);

}

</script>

</body>
</html>
