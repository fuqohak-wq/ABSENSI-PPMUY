<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Perizinan Santri - E-Pesantren Core</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body, header, div, section, button, table, td, th, footer, input, select {
            transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
        }
        .theme-dark { --bg-main: #0f172a; --bg-header: #020617; --bg-box: #020617; --bg-inner: #0f172a; --text-main: #f1f5f9; --text-muted: #94a3b8; --border-color: #1e293b; --border-row: #020617; --text-row: #cbd5e1; --text-title: #38bdf8; }
        .theme-light { --bg-main: #f0f4f8; --bg-header: #0f172a; --bg-box: rgba(255, 255, 255, 0.85); --bg-inner: #e2e8f0; --text-main: #0f172a; --text-muted: #2563eb; --border-color: #cbd5e1; --border-row: #e2e8f0; --text-row: #334155; --text-title: #1e40af; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif; }
        .dynamic-bg-box { background-color: var(--bg-box); backdrop-filter: blur(8px); }
        .dynamic-bg-header { background-color: var(--bg-header); }
        .dynamic-border { border-color: var(--border-color); }
        .dynamic-text-title { color: var(--text-title); }
    </style>
</head>
<body class="theme-dark min-h-screen flex flex-col justify-between">

    <header class="w-full dynamic-bg-header border-b-4 border-yellow-400 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-yellow-400 flex items-center justify-center shadow-sm">
                <i class="fa-solid fa-shield-halved text-slate-900"></i>
            </div>
            <div>
                <h1 class="text-sm font-black tracking-wide text-yellow-500 uppercase">PORTAL PERIZINAN KIOSK V8</h1>
                <span id="txt-role-badge" class="text-[9px] bg-emerald-500 text-white px-2 py-0.5 rounded-full font-black block w-max uppercase mt-0.5">SECURITY GATEWAY</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleTema()" id="btn-tema" class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center border border-slate-700 text-amber-400"><i class="fa-solid fa-sun"></i></button>
            <button onclick="muatDataPerizinan()" class="w-10 h-10 rounded-xl bg-slate-800 text-emerald-400 flex items-center justify-center border border-slate-700"><i class="fa-solid fa-rotate"></i></button>
        </div>
    </header>

    <div class="w-full max-w-7xl mx-auto p-4 sm:p-6 flex flex-col gap-6 flex-1">
        
        <!-- Statistik -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="dynamic-bg-box border dynamic-border rounded-2xl p-4 text-center border-l-4 border-l-amber-500">
                <span class="text-[10px] font-black text-amber-500 tracking-wider block uppercase">WAITING ACC</span>
                <span id="stat-pending" class="text-2xl font-black mt-1 block">0</span>
            </div>
            <div class="dynamic-bg-box border dynamic-border rounded-2xl p-4 text-center border-l-4 border-l-blue-500">
                <span class="text-[10px] font-black text-blue-500 tracking-wider block uppercase">DI LUAR PONDOK</span>
                <span id="stat-diluar" class="text-2xl font-black mt-1 block">0</span>
            </div>
            <div class="dynamic-bg-box border dynamic-border rounded-2xl p-4 text-center border-l-4 border-l-rose-500">
                <span class="text-[10px] font-black text-rose-500 tracking-wider block uppercase">TERLAMBAT</span>
                <span id="stat-terlambat" class="text-2xl font-black mt-1 block">0</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Form Input -->
            <div class="lg:col-span-1">
                <div class="dynamic-bg-box border dynamic-border rounded-2xl p-5 shadow-sm">
                    <h3 class="text-xs font-black text-yellow-500 uppercase tracking-widest mb-4"><i class="fa-solid fa-plus-circle mr-2"></i>INPUT IZIN BARU</h3>
                    <div class="flex flex-col gap-4">
                        <div id="box-pencarian" class="relative">
                            <label class="block text-[10px] text-slate-400 uppercase mb-1 font-bold">Cari NIK / Nama Santri</label>
                            <input type="text" id="input-nik-nama" onkeyup="cariLiveSantri()" placeholder="Ketik minimal 3 huruf..." class="w-full p-3 rounded-xl bg-slate-900/50 border border-slate-700 text-white text-xs outline-none focus:border-blue-500">
                            <div id="dropdown-hasil-cari" class="hidden absolute z-50 w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl overflow-hidden shadow-2xl"></div>
                        </div>

                        <div id="preview-santri" class="hidden p-3 rounded-xl border border-dashed border-blue-500 bg-blue-500/5">
                            <div id="prev-nama" class="font-black text-xs uppercase text-blue-400">NAMA SANTRI</div>
                            <div id="prev-kelas" class="text-[10px] text-slate-400 font-mono">KELAS - NIK</div>
                        </div>

                        <div>
                            <label class="block text-[10px] text-slate-400 uppercase mb-1 font-bold">Hajat / Jenis Izin</label>
                            <select id="select-jenis-izin" class="w-full p-3 rounded-xl bg-slate-900/50 border border-slate-700 text-xs text-white outline-none">
                                <option value="KELUAR SEBENTAR">KELUAR SEBENTAR (AUTO ACC)</option>
                                <option value="SAKIT">SAKIT / BEROBAT (AUTO ACC)</option>
                                <option value="PULANG">PULANG (BUTUH ACC PENGASUH)</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-[10px] text-slate-400 uppercase mb-1 font-bold">Alasan Detail</label>
                            <input type="text" id="input-alasan" placeholder="Contoh: Sambang Wali" class="w-full p-3 rounded-xl bg-slate-900/50 border border-slate-700 text-xs text-white outline-none">
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] text-slate-400 uppercase mb-1 font-bold">Janji Kembali</label>
                                <input type="datetime-local" id="input-janji-kembali" class="w-full p-2 rounded-xl bg-slate-900/50 border border-slate-700 text-[11px] text-white outline-none">
                            </div>
                        </div>

                        <button onclick="prosesUsulkanIzin()" class="w-full py-4 rounded-xl bg-yellow-400 text-slate-950 font-black uppercase tracking-tighter hover:bg-yellow-300 transition-all text-xs">
                            SUBMIT PERIZINAN & LOG
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tabel Monitoring -->
            <div class="lg:col-span-2">
                <div class="dynamic-bg-box border dynamic-border rounded-2xl p-5 shadow-sm min-h-[500px]">
                    <div class="flex justify-between items-center mb-4 border-b dynamic-border pb-3">
                        <div class="flex gap-2">
                            <button id="tab-aktif-izin" onclick="gantiTabFilter('AKTIF')" class="text-[10px] font-black px-4 py-2 rounded-lg bg-blue-600 text-white uppercase">AKTIF</button>
                            <button id="tab-riwayat-izin" onclick="gantiTabFilter('RIWAYAT')" class="text-[10px] font-black px-4 py-2 rounded-lg bg-slate-800 text-slate-400 uppercase">RIWAYAT</button>
                        </div>
                        <h3 class="text-xs font-black dynamic-text-title uppercase tracking-widest">REAL-TIME MONITORING</h3>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-[11px]">
                            <thead>
                                <tr class="text-left text-slate-500 uppercase border-b dynamic-border">
                                    <th class="py-3">SANTRI</th>
                                    <th class="py-3">KEPERLUAN</th>
                                    <th class="py-3">STATUS</th>
                                    <th class="py-3 text-right">AKSI</th>
                                </tr>
                            </thead>
                            <tbody id="tbl-izin-body" class="divide-y dynamic-border">
                                <tr><td colspan="4" class="py-10 text-center text-slate-500">Memuat data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="w-full text-center py-4 text-[9px] text-slate-500 font-bold tracking-widest border-t dynamic-border dynamic-bg-header uppercase">
        E-PESANTREN GATEWAY CORE © 2026
    </footer>

    <script>
        const API_URL = "ISI_URL_WEB_APP_ANDA_DISINI";
        
        let masterSantriCache = [];
        let databaseIzinGlobal = [];
        let filterTabSekarang = "AKTIF";
        let santriTerpilihNIK = null;

        window.addEventListener('DOMContentLoaded', () => {
            muatDataPerizinan();
            muatMasterSantri();
            
            // Set Default Janji Kembali (Besok)
            let besok = new Date();
            besok.setDate(besok.getDate() + 1);
            besok.setMinutes(besok.getMinutes() - besok.getTimezoneOffset());
            document.getElementById('input-janji-kembali').value = besok.toISOString().slice(0,16);
        });

        async function muatMasterSantri() {
            try {
                let res = await fetch(`${API_URL}?aksi=ambil_database`);
                let r = await res.json();
                if(r.status === "success") masterSantriCache = r.data;
            } catch(e) { console.error("Gagal muat master"); }
        }

        async function muatDataPerizinan() {
            const tbody = document.getElementById('tbl-izin-body');
            try {
                let res = await fetch(`${API_URL}?aksi=ambil_perizinan`);
                let r = await res.json();
                if(r.status === "success") {
                    databaseIzinGlobal = r.data;
                    renderTabelIzin();
                    updateStatistik();
                }
            } catch(e) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-red-500">Gagal terhubung ke server.</td></tr>`;
            }
        }

        function updateStatistik() {
            let pending = 0, diluar = 0, terlambat = 0;
            let sekarang = new Date();
            
            databaseIzinGlobal.forEach(item => {
                let status = item.status_izin;
                let janji = new Date(item.janji);
                if(status === "PENDING") pending++;
                if((status === "ACC" || status === "DISETUJUI") && !item.waktu_kembali) {
                    diluar++;
                    if(sekarang > janji) terlambat++;
                }
            });

            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-diluar').innerText = diluar;
            document.getElementById('stat-terlambat').innerText = terlambat;
        }

        function renderTabelIzin() {
            const tbody = document.getElementById('tbl-izin-body');
            tbody.innerHTML = '';

            let dataFilter = databaseIzinGlobal.filter(item => {
                let isSelesai = (item.status_izin === "SELESAI" || item.waktu_kembali);
                return filterTabSekarang === "AKTIF" ? !isSelesai : isSelesai;
            });

            if(dataFilter.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-slate-500 uppercase">Tidak ada data.</td></tr>`;
                return;
            }

            dataFilter.reverse().forEach(item => {
                let statusColor = "text-amber-500";
                if(item.status_izin === "DISETUJUI" || item.status_izin === "ACC") statusColor = "text-blue-500";
                if(item.status_izin === "SELESAI") statusColor = "text-emerald-500";

                let row = document.createElement('tr');
                row.className = "border-b dynamic-border hover:bg-white/5 transition-all";
                row.innerHTML = `
                    <td class="py-4">
                        <div class="font-black uppercase">${item.nama}</div>
                        <div class="text-[9px] text-slate-500 font-mono">${item.nik} • ${item.kelas}</div>
                    </td>
                    <td class="py-4">
                        <div class="text-blue-400 font-bold uppercase text-[10px]">${item.jenis}</div>
                        <div class="text-slate-400 text-[10px]">${item.alasan}</div>
                    </td>
                    <td class="py-4">
                        <span class="font-black ${statusColor}">${item.status_izin}</span>
                        <div class="text-[9px] text-slate-500 font-mono mt-1">Kembali: ${item.janji}</div>
                    </td>
                    <td class="py-4 text-right">
                        ${item.status_izin === "PENDING" ? 
                            `<button onclick="eksekusiPortal('${item.id_izin}', 'SETUJU')" class="px-2 py-1 bg-emerald-500 text-slate-900 rounded font-black text-[9px] mr-1">ACC</button>
                             <button onclick="eksekusiPortal('${item.id_izin}', 'TOLAK')" class="px-2 py-1 bg-rose-500 text-white rounded font-black text-[9px]">TOLAK</button>` 
                            : 
                            (item.status_izin !== "SELESAI" ? `<button onclick="tutupIzin('${item.id_izin}')" class="px-2 py-1 bg-slate-700 text-white rounded font-black text-[9px]">OVERRIDE IN</button>` : `<i class="fa-solid fa-check-circle text-emerald-500"></i>`)
                        }
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function cariLiveSantri() {
            const query = document.getElementById('input-nik-nama').value.toUpperCase();
            const drop = document.getElementById('dropdown-hasil-cari');
            if(query.length < 3) { drop.classList.add('hidden'); return; }
            
            let hasil = masterSantriCache.filter(s => s.nama.includes(query) || s.nik.includes(query)).slice(0,5);
            drop.innerHTML = '';
            hasil.forEach(s => {
                let div = document.createElement('div');
                div.className = "p-3 hover:bg-blue-600 cursor-pointer text-xs font-bold border-b border-slate-800";
                div.innerHTML = `${s.nama} <span class="block text-[9px] opacity-60">${s.nik} - ${s.kelas}</span>`;
                div.onclick = () => {
                    santriTerpilihNIK = s.nik;
                    document.getElementById('input-nik-nama').value = s.nama;
                    document.getElementById('prev-nama').innerText = s.nama;
                    document.getElementById('prev-kelas').innerText = s.kelas + " - " + s.nik;
                    document.getElementById('preview-santri').classList.remove('hidden');
                    drop.classList.add('hidden');
                };
                drop.appendChild(div);
            });
            drop.classList.remove('hidden');
        }

        async function prosesUsulkanIzin() {
            if(!santriTerpilihNIK) return alert("Pilih santri dulu!");
            const jenis = document.getElementById('select-jenis-izin').value;
            const janji = document.getElementById('input-janji-kembali').value;
            const alasan = document.getElementById('input-alasan').value;
            
            if(!alasan) return alert("Alasan harus diisi!");

            try {
                let res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        aksi: "simpan_usulan_izin",
                        nik: santriTerpilihNIK,
                        nama: document.getElementById('prev-nama').innerText,
                        kelas: document.getElementById('prev-kelas').innerText.split(' - ')[0],
                        jenis: jenis,
                        alasan: alasan,
                        janji: janji.replace('T', ' '),
                        status: (jenis === "PULANG" ? "PENDING" : "DISETUJUI")
                    })
                });
                let r = await res.json();
                if(r.status === "success") {
                    alert("Berhasil disubmit!");
                    location.reload();
                }
            } catch(e) { alert("Error simpan data"); }
        }

        async function eksekusiPortal(id, aksi) {
            let status = aksi === "SETUJU" ? "DISETUJUI" : "REJECTED";
            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ aksi: "update_status_izin", id: id, status: status })
                });
                muatDataPerizinan();
            } catch(e) { alert("Gagal update"); }
        }

        async function tutupIzin(id) {
            if(!confirm("Santri dianggap kembali sekarang?")) return;
            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ aksi: "tutup_izin_manual", id: id })
                });
                muatDataPerizinan();
            } catch(e) { alert("Gagal proses"); }
        }

        function gantiTabFilter(tab) {
            filterTabSekarang = tab;
            document.getElementById('tab-aktif-izin').className = tab === 'AKTIF' ? "text-[10px] font-black px-4 py-2 rounded-lg bg-blue-600 text-white uppercase" : "text-[10px] font-black px-4 py-2 rounded-lg bg-slate-800 text-slate-400 uppercase";
            document.getElementById('tab-riwayat-izin').className = tab === 'RIWAYAT' ? "text-[10px] font-black px-4 py-2 rounded-lg bg-emerald-600 text-white uppercase" : "text-[10px] font-black px-4 py-2 rounded-lg bg-slate-800 text-slate-400 uppercase";
            renderTabelIzin();
        }

        function toggleTema() {
            document.body.classList.toggle('theme-light');
            document.body.classList.toggle('theme-dark');
        }
    </script>
</body>
</html>
