<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Perizinan Santri - E-Pesantren Core</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .theme-dark { --bg-main: #0f172a; --bg-header: #020617; --bg-box: #020617; --text-main: #f1f5f9; --border-color: #1e293b; }
        .theme-light { --bg-main: #f0f4f8; --bg-header: #0f172a; --bg-box: #ffffff; --text-main: #0f172a; --border-color: #cbd5e1; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: sans-serif; transition: 0.3s; }
        .dynamic-bg-box { background-color: var(--bg-box); }
        .dynamic-bg-header { background-color: var(--bg-header); }
        .dynamic-border { border-color: var(--border-color); }
    </style>
</head>
<body class="theme-dark min-h-screen flex flex-col">

    <header class="w-full dynamic-bg-header border-b-4 border-yellow-400 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-yellow-400 flex items-center justify-center"><i class="fa-solid fa-id-card text-slate-900"></i></div>
            <h1 class="text-sm font-black text-yellow-500 uppercase">PORTAL PERIZINAN V8</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleTema()" class="w-10 h-10 rounded-xl bg-slate-800 text-amber-400 border border-slate-700"><i class="fa-solid fa-sun"></i></button>
            <button onclick="muatDataPerizinan()" class="w-10 h-10 rounded-xl bg-slate-800 text-emerald-400 border border-slate-700"><i class="fa-solid fa-rotate"></i></button>
        </div>
    </header>

    <div class="w-full max-w-7xl mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1">
        
        <!-- Kolom Input -->
        <div class="lg:col-span-1">
            <div class="dynamic-bg-box border dynamic-border rounded-2xl p-5 shadow-sm">
                <h3 class="text-xs font-black text-yellow-500 uppercase mb-4">INPUT IZIN BARU</h3>
                <div class="flex flex-col gap-4">
                    <div class="relative">
                        <label class="text-[10px] text-slate-400 uppercase font-bold">Cari Santri</label>
                        <input type="text" id="input-nik-nama" onkeyup="cariLiveSantri()" placeholder="Nama / NIK..." class="w-full p-3 rounded-xl bg-slate-900/50 border border-slate-700 text-white text-xs outline-none focus:border-blue-500">
                        <div id="dropdown-hasil-cari" class="hidden absolute z-50 w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl max-h-40 overflow-y-auto"></div>
                    </div>
                    <div id="preview-santri" class="hidden p-3 rounded-xl border border-dashed border-blue-500 bg-blue-500/5">
                        <div id="prev-nama" class="font-black text-xs uppercase text-blue-400"></div>
                        <div id="prev-kelas" class="text-[9px] text-slate-400"></div>
                    </div>
                    <select id="select-jenis-izin" class="w-full p-3 rounded-xl bg-slate-900/50 border border-slate-700 text-xs text-white">
                        <option value="KELUAR SEBENTAR">KELUAR SEBENTAR (AUTO ACC)</option>
                        <option value="SAKIT">BEROBAT (AUTO ACC)</option>
                        <option value="PULANG">PULANG (PENDING ACC)</option>
                    </select>
                    <input type="text" id="input-alasan" placeholder="Alasan Detail..." class="w-full p-3 rounded-xl bg-slate-900/50 border border-slate-700 text-xs text-white outline-none">
                    <input type="datetime-local" id="input-janji-kembali" class="w-full p-3 rounded-xl bg-slate-900/50 border border-slate-700 text-[11px] text-white outline-none">
                    <button onclick="prosesUsulkanIzin()" class="w-full py-4 rounded-xl bg-yellow-400 text-slate-950 font-black uppercase text-xs">SUBMIT PERIZINAN</button>
                </div>
            </div>
        </div>

        <!-- Kolom Tabel -->
        <div class="lg:col-span-2">
            <div class="dynamic-bg-box border dynamic-border rounded-2xl p-5 min-h-[500px]">
                <div class="flex gap-2 mb-4">
                    <button id="tab-aktif" onclick="gantiTabFilter('AKTIF')" class="text-[10px] font-black px-4 py-2 rounded-lg bg-blue-600 text-white">AKTIF</button>
                    <button id="tab-riwayat" onclick="gantiTabFilter('RIWAYAT')" class="text-[10px] font-black px-4 py-2 rounded-lg bg-slate-800 text-slate-400">RIWAYAT</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-[11px]">
                        <thead><tr class="text-left text-slate-500 border-b dynamic-border"><th class="py-3">SANTRI</th><th class="py-3">KEPERLUAN</th><th class="py-3">STATUS</th><th class="py-3 text-right">AKSI</th></tr></thead>
                        <tbody id="tbl-izin-body" class="divide-y dynamic-border"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "GANTI_DENGAN_URL_WEBAPP_ANDA";
        let masterSantriCache = [], databaseIzinGlobal = [], filterTab = "AKTIF", santriTerpilih = null;

        window.onload = () => { muatDataPerizinan(); muatMasterSantri(); };

        async function muatMasterSantri() {
            try { let r = await fetch(`${API_URL}?aksi=ambil_database`).then(res => res.json()); masterSantriCache = r.data; } catch(e) {}
        }

        async function muatDataPerizinan() {
            try { 
                let r = await fetch(`${API_URL}?aksi=ambil_perizinan`).then(res => res.json()); 
                databaseIzinGlobal = r.data; 
                renderTabel(); 
            } catch(e) { document.getElementById('tbl-izin-body').innerHTML = "Gagal memuat."; }
        }

        function renderTabel() {
            const tbody = document.getElementById('tbl-izin-body');
            tbody.innerHTML = '';
            let filtered = databaseIzinGlobal.filter(i => filterTab === "AKTIF" ? (i.status_izin !== "SELESAI" && !i.waktu_kembali) : (i.status_izin === "SELESAI" || i.waktu_kembali));
            
            filtered.reverse().forEach(i => {
                let row = `<tr>
                    <td class="py-3"><div class="font-bold uppercase">${i.nama}</div><div class="text-[9px] text-slate-500">${i.kelas}</div></td>
                    <td class="py-3"><div class="text-blue-400 font-bold uppercase">${i.jenis}</div><div class="text-[10px]">${i.alasan}</div></td>
                    <td class="py-3"><span class="font-black ${i.status_izin === 'PENDING' ? 'text-amber-500' : 'text-blue-500'}">${i.status_izin}</span></td>
                    <td class="py-3 text-right">
                        ${i.status_izin === "PENDING" ? `<button onclick="eksekusi('${i.id_izin}','SETUJU')" class="bg-emerald-500 text-xs p-1 rounded">ACC</button>` : ''}
                        ${i.status_izin === "DISETUJUI" ? `<button onclick="tutup('${i.id_izin}')" class="bg-slate-700 text-xs p-1 rounded">IN</button>` : ''}
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function cariLiveSantri() {
            let q = document.getElementById('input-nik-nama').value.toUpperCase();
            let drop = document.getElementById('dropdown-hasil-cari');
            if(q.length < 3) return drop.classList.add('hidden');
            let res = masterSantriCache.filter(s => s.nama.includes(q) || s.nik.includes(q)).slice(0,5);
            drop.innerHTML = '';
            res.forEach(s => {
                let d = document.createElement('div'); d.className = "p-2 hover:bg-blue-600 text-xs cursor-pointer";
                d.innerHTML = s.nama; d.onclick = () => {
                    santriTerpilih = s; document.getElementById('input-nik-nama').value = s.nama;
                    document.getElementById('prev-nama').innerText = s.nama; document.getElementById('preview-santri').classList.remove('hidden');
                    drop.classList.add('hidden');
                }; drop.appendChild(d);
            }); drop.classList.remove('hidden');
        }

        async function prosesUsulkanIzin() {
            if(!santriTerpilih) return alert("Pilih santri!");
            let body = {
                aksi: "simpan_usulan_izin", nik: santriTerpilih.nik, nama: santriTerpilih.nama, kelas: santriTerpilih.kelas,
                jenis: document.getElementById('select-jenis-izin').value, alasan: document.getElementById('input-alasan').value,
                janji: document.getElementById('input-janji-kembali').value.replace('T',' '),
                status: document.getElementById('select-jenis-izin').value === "PULANG" ? "PENDING" : "DISETUJUI"
            };
            await fetch(API_URL, { method: "POST", body: JSON.stringify(body) });
            muatDataPerizinan();
        }

        async function eksekusi(id, status) { await fetch(API_URL, { method: "POST", body: JSON.stringify({ aksi: "update_status_izin", id: id, status: status === 'SETUJU' ? 'DISETUJUI' : 'REJECTED' }) }); muatDataPerizinan(); }
        async function tutup(id) { await fetch(API_URL, { method: "POST", body: JSON.stringify({ aksi: "tutup_izin_manual", id: id }) }); muatDataPerizinan(); }
        function gantiTabFilter(t) { filterTab = t; renderTabel(); }
        function toggleTema() { document.body.classList.toggle('theme-light'); document.body.classList.toggle('theme-dark'); }
    </script>
</body>
</html>
