<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gateway Perizinan PPMUY Pusat</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .loader { border-top-color: #10B981; animation: spinner 1.5s linear infinite; }
    @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

  <header class="bg-emerald-700 text-white shadow-md px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-door-open text-2xl text-emerald-200"></i>
      <div>
        <h1 class="text-xl font-bold tracking-wide">GATEWAY PERIZINAN</h1>
        <p class="text-xs text-emerald-100">PPMUY Pusat — Khusus Log Gerbang Keluar (Gate-Out)</p>
      </div>
    </div>
    <div id="jam-realtime" class="text-sm font-mono bg-emerald-800 px-3 py-1.5 rounded border border-emerald-600">--:--:--</div>
  </header>

  <main class="max-w-7xl mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <section class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 lg:col-span-1">
      <div class="flex items-center space-x-2 pb-4 mb-4 border-b border-gray-100">
        <i class="fa-solid fa-pen-to-square text-emerald-600 text-lg"></i>
        <h2 class="text-lg font-bold text-gray-900">Form Log Keluar</h2>
      </div>

      <form id="form-izin" class="space-y-4" onsubmit="prosesSubmitIzin(event)">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Cari NIK / Nama Santri</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
              <i class="fa-solid fa-magnifying-glass"></i>
            </span>
            <input type="text" id="pencarian" list="list-master" oninput="pilihSantriAutofill(this.value)" autocomplete="off"
                   class="w-full pl-9 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" 
                   placeholder="Ketik NIK atau Nama...">
            <datalist id="list-master"></datalist>
          </div>
        </div>

        <input type="hidden" id="form-nik">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-gray-400 mb-0.5">Nama Terpilih</label>
            <input type="text" id="form-nama" readonly class="w-full text-xs font-bold bg-gray-100 p-2 rounded border text-gray-600" placeholder="-">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-0.5">Kelas</label>
            <input type="text" id="form-kelas" readonly class="w-full text-xs font-bold bg-gray-100 p-2 rounded border text-gray-600" placeholder="-">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Jenis Izin</label>
          <select id="form-jenis" onchange="aturLogikaStatusIzin(this.value)" required
                  class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
            <option value="" disabled selected>-- Pilih Jenis Izin --</option>
            <option value="KELUAR SEBENTAR">KELUAR SEBENTAR (Auto ACC)</option>
            <option value="SAKIT (PULANG)">SAKIT (PULANG) (Auto ACC)</option>
            <option value="IZIN PULANG (HAJAT)">PULANG / SAMBANGAN (Pending Telegram)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Alasan / Keperluan Spesifik</label>
          <textarea id="form-alasan" rows="2" required
                    class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
                    placeholder="Contoh: Berobat ke RS Umum, Hajat pernikahan kakak..."></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Target Janji Kembali</label>
          <input type="datetime-local" id="form-janji" required
                 class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
        </div>

        <button type="submit" id="btn-submit"
                class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-sm transition shadow-md hover:shadow-lg flex justify-center items-center space-x-2 cursor-pointer">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Daftarkan & Lepas Keluar</span>
        </button>
      </form>
    </section>

    <section class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 lg:col-span-2 flex flex-col">
      <div class="flex justify-between items-center pb-4 mb-4 border-b border-gray-100">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-table-list text-emerald-600 text-lg"></i>
          <h2 class="text-lg font-bold text-gray-900">Status Gerbang Real-Time</h2>
        </div>
        <button onclick="muatDataPerizinan()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg border border-gray-200 transition flex items-center space-x-1 cursor-pointer">
          <i class="fa-solid fa-rotate"></i> <span>Refresh</span>
        </button>
      </div>

      <div class="overflow-x-auto flex-grow relative rounded-lg border border-gray-200">
        <table class="w-full text-left text-xs border-collapse">
          <thead class="bg-gray-100 text-gray-600 uppercase font-bold tracking-wider sticky top-0 border-b border-gray-200">
            <tr>
              <th class="p-3">Santri</th>
              <th class="p-3">Keperluan</th>
              <th class="p-3">Batas Kembali</th>
              <th class="p-3 text-center">Status Izin</th>
              <th class="p-3">Waktu Masuk (Kiosk)</th>
              <th class="p-3 text-right">Denda</th>
            </tr>
          </thead>
          <tbody id="tabel-body-izin" class="divide-y divide-gray-100 bg-white">
            </tbody>
        </table>
        
        <div id="loading-overlay" class="absolute inset-0 bg-white/80 hidden flex justify-center items-center">
          <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-10 w-10"></div>
        </div>
      </div>
    </section>

  </main>

  <script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI!
    const WEB_APP_URL = "https://script.google.com/macros/s/xxxxxxxxx/exec";
    
    let databaseSantriMaster = [];

    // Jam Real-time Header
    setInterval(() => {
      const n = new Date();
      document.getElementById('jam-realtime').innerText = n.toLocaleTimeString('id-ID');
    }, 1000);

    // Booting Awal Aplikasi
    window.addEventListener('DOMContentLoaded', () => {
      muatDatabaseMasterSantri();
      muatDataPerizinan();
    });

    // 1. Ambil Data Auto-Complete dari 'master_santri' via Backend
    function muatDatabaseMasterSantri() {
      fetch(`${WEB_APP_URL}?aksi=ambil_database`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            databaseSantriMaster = res.data;
            const datalist = document.getElementById('list-master');
            datalist.innerHTML = "";
            res.data.forEach(s => {
              let opt = document.createElement('option');
              opt.value = `${s.nik} - ${s.nama}`;
              datalist.appendChild(opt);
            });
          }
        }).catch(err => console.error("Gagal memuat master:", err));
    }

    // 2. Fungsi Autofill Form saat NIK/Nama diketik/dipilih
    function pilihSantriAutofill(nilai) {
      const nikCari = nilai.split(" - ")[0].trim();
      const match = databaseSantriMaster.find(s => String(s.nik).trim() === nikCari);
      
      if (match) {
        document.getElementById('form-nik').value = match.nik;
        document.getElementById('form-nama').value = match.nama;
        document.getElementById('form-kelas').value = match.kelas;
      } else {
        document.getElementById('form-nik').value = "";
        document.getElementById('form-nama').value = "-";
        document.getElementById('form-kelas').value = "-";
      }
    }

    // 3. Status Rule Helper (Menentukan apakah langsung keluar/butuh approval)
    let statusPersetujuanSistem = "DISETUJUI";
    function aturLogikaStatusIzin(jenis) {
      if (jenis === "IZIN PULANG (HAJAT)") {
        statusPersetujuanSistem = "PENDING"; // Menunggu Pengasuh klik ACC di Telegram
      } else {
        statusPersetujuanSistem = "DISETUJUI"; // Auto ACC Gerbang untuk Sakit / Keluar Bentar
      }
    }

    // 4. Submit Data Usulan Keluar ke Spreadsheet (Gate-Out)
    function prosesSubmitIzin(e) {
      e.preventDefault();
      const nik = document.getElementById('form-nik').value;
      if (!nik) { alert("Pilih santri dari daftar valid terlebih dahulu!"); return; }

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> <span>Mendaftarkan...</span>`;

      const payload = {
        aksi: "simpan_usulan_izin",
        nik: nik,
        nama: document.getElementById('form-nama').value,
        kelas: document.getElementById('form-kelas').value,
        jenis: document.getElementById('form-jenis').value,
        alasan: document.getElementById('form-alasan').value,
        janji: document.getElementById('form-janji').value.replace('T', ' '), // Rapikan format tanggal string
        status: statusPersetujuanSistem
      };

      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          alert(res.message);
          document.getElementById('form-izin').reset();
          document.getElementById('pencarian').value = "";
          pilihSantriAutofill("");
          muatDataPerizinan(); // Refresh Tabel
        } else {
          alert("Terjadi kegagalan sistem.");
        }
      })
      .catch(err => alert("Error koneksi server: " + err))
      .finally(() => {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>Daftarkan & Lepas Keluar</span>`;
      });
    }

    // 5. Muat Real-time Data Monitoring Gerbang dari Sheet 'perizinan'
    function muatDataPerizinan() {
      const overlay = document.getElementById('loading-overlay');
      overlay.classList.remove('hidden');

      fetch(`${WEB_APP_URL}?aksi=ambil_perizinan`)
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            tampilkanDataKeTabel(res.data);
          }
        })
        .catch(err => console.error("Gagal muat log perizinan:", err))
        .finally(() => overlay.classList.add('hidden'));
    }

    // 6. Merender isi Array Spreadsheet ke Elemen TR TD Tabel HTML
    function tampilkanDataKeTabel(arrData) {
      const tbody = document.getElementById('tabel-body-izin');
      tbody.innerHTML = "";

      if (arrData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400 font-medium">Belum ada catatan aktivitas keluar masuk santri hari ini.</td></tr>`;
        return;
      }

      // Urutkan data terbaru di posisi paling atas (berdasarkan ID Izin teranyar)
      arrData.reverse();

      arrData.forEach(row => {
        // Ambil data sesuai dengan key ber-underscore hasil convert backend code.gs
        let nama = row.Nama_Santri || "-";
        let kelas = row.Kelas || "-";
        let jenis = row.Jenis_Izin || "-";
        let alasan = row.Alasan || "-";
        let janji = row.Janji_Kembali ? formatTeksTanggal(row.Janji_Kembali) : "-";
        let status = String(row.Status_Persetujuan || "").toUpperCase();
        let kembali = row.Waktu_Kembali ? formatTeksTanggal(row.Waktu_Kembali) : '<span class="text-gray-400 font-mono italic">Belum Absen Wajah</span>';
        let denda = parseInt(row.Denda_Kumulatif) || 0;

        // Styling Badge Status secara dinamis
        let badgeStyle = "bg-gray-100 text-gray-700";
        if (status === "PENDING") badgeStyle = "bg-amber-100 text-amber-800 border border-amber-300 animate-pulse";
        if (status === "DISETUJUI") badgeStyle = "bg-blue-100 text-blue-800 border border-blue-300";
        if (status === "SELESAI") badgeStyle = "bg-emerald-100 text-emerald-800";

        let tr = document.createElement('tr');
        tr.className = "hover:bg-gray-50/80 transition duration-150";
        tr.innerHTML = `
          <td class="p-3">
            <div class="font-bold text-gray-900">${nama}</div>
            <div class="text-[10px] text-gray-400">${row.NIK || ""} • ${kelas}</div>
          </td>
          <td class="p-3">
            <div class="font-semibold text-gray-700 text-xs">${jenis}</div>
            <div class="text-[11px] text-gray-400 truncate max-w-[180px]">${alasan}</div>
          </td>
          <td class="p-3 font-mono text-gray-600 text-[11px]">${janji}</td>
          <td class="p-3 text-center">
            <span class="px-2 py-1 rounded-full text-[10px] font-bold ${badgeStyle}">${status}</span>
          </td>
          <td class="p-3 font-mono text-[11px] text-gray-600">${kembali}</td>
          <td class="p-3 text-right font-bold text-gray-900 ${denda > 0 ? 'text-rose-600 bg-rose-50/40' : ''}">
            ${denda > 0 ? 'Rp ' + denda.toLocaleString('id-ID') : '-'}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Helper format object Date atau string date Google agar enak dibaca manusia
    function formatTeksTanggal(str) {
      if(!str) return "-";
      const d = new Date(str);
      if(isNaN(d.getTime())) return str; // Jika bukan format valid balikan aslinya saja
      return d.toLocaleDateString('id-ID', {
        day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
      }).replace(',', ' —');
    }
  </script>
</body>
</html>
