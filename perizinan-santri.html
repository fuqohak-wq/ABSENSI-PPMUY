<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Perizinan Santri - PPMUY</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        /* Desain Palet Tema Aplikasi Kiosk Dashboard */
        .theme-dark {
            --bg-main: #020617;
            --bg-card: #0b1329;
            --border-row: #1e293b;
            --text-main: #f1f5f9;
        }
        .theme-light {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --border-row: #e2e8f0;
            --text-main: #0f172a;
        }
        .dynamic-bg-main { background-color: var(--bg-main); color: var(--text-main); transition: all 0.3s ease; }
        .dynamic-bg-card { background-color: var(--bg-card); transition: all 0.3s ease; }
        .dynamic-border-row { border-color: var(--border-row); }
        
        /* Proteksi Layout Cetak / Print Mode */
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="theme-dark font-sans min-h-screen flex flex-col justify-between dynamic-bg-main">

    <header class="no-print dynamic-bg-card border-b dynamic-border-row px-4 py-3 shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600/10 p-2 rounded-xl text-blue-500">
                    <i class="fa-solid fa-id-card-clip text-xl"></i>
                </div>
                <div>
                    <h1 class="text-sm font-black tracking-wide uppercase">Kiosk Perizinan</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase font-mono">PPMUY Digital Gateway • v9.0</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <span id="txt-role-badge" class="bg-blue-500/10 text-blue-500 dark:text-blue-400 px-2.5 py-1 rounded-lg text-[9px] font-black tracking-widest border border-blue-500/20 uppercase">KEAMANAN GERBANG</span>
                <button id="btn-tema" onclick="toggleTema()" class="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700/50 text-slate-300 hover:text-white cursor-pointer flex items-center justify-center text-xs transition-all">
                    <i class="fa-solid fa-sun"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl w-full mx-auto p-4 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-5">
        
        <section class="no-print lg:col-span-5 flex flex-col gap-4">
            <div class="dynamic-bg-card p-5 rounded-2xl border dynamic-border-row shadow-sm flex flex-col gap-4">
                <div class="flex items-center justify-between pb-2 border-b dynamic-border-row">
                    <h2 class="text-xs font-black uppercase tracking-wider text-blue-500"><i class="fa-solid fa-user-plus mr-1.5"></i>Input Perizinan Baru</h2>
                    <span class="text-[10px] text-slate-400 italic font-medium">Step 1: Identifikasi</span>
                </div>

                <div class="grid grid-cols-2 gap-1.5 bg-slate-900/50 p-1 rounded-xl border border-slate-800/40">
                    <button id="btn-metode-cari" onclick="setMetodeInput('CARI')" class="py-2 rounded-lg bg-blue-600 text-white font-black uppercase text-[10px] tracking-wider cursor-pointer transition-all">
                        <i class="fa-solid fa-magnifying-glass mr-1"></i>Ketik NIK/Nama
                    </button>
                    <button id="btn-metode-qr" onclick="setMetodeInput('QR')" class="py-2 rounded-lg bg-slate-800 text-slate-400 font-black uppercase text-[10px] tracking-wider cursor-pointer transition-all">
                        <i class="fa-solid fa-qrcode mr-1"></i>Scan QR Kartu
                    </button>
                </div>

                <div id="box-pencarian" class="relative">
                    <label class="block text-[10px] font-black uppercase tracking-wider text-slate-400 mb-1.5">Masukkan NIK atau Nama Santri :</label>
                    <div class="relative">
                        <input type="text" id="input-nik-nama" onkeyup="cariLiveSantri()" autocomplete="off" placeholder="Contoh: 202401003 atau Ahmad..." class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-3.5 py-2.5 text-xs font-bold focus:outline-none focus:border-blue-500 text-slate-200 placeholder-slate-500">
                        <i class="fa-solid fa-keyboard absolute right-3.5 top-3 text-slate-500 text-xs"></i>
                    </div>
                    <div id="dropdown-hasil-cari" class="absolute left-0 right-0 mt-1.5 bg-slate-900 border border-slate-700/80 rounded-xl shadow-xl z-50 max-h-60 overflow-y-auto hidden p-1"></div>
                </div>

                <div id="box-qr-scanner" class="hidden">
                    <label class="block text-[10px] font-black uppercase tracking-wider text-slate-400 mb-1.5">Arahkan QR Code Ke Kamera :</label>
                    <div id="reader" class="overflow-hidden rounded-xl border border-slate-700/50 bg-black/20"></div>
                </div>

                <div id="preview-santri" class="hidden bg-blue-500/5 border border-blue-500/20 rounded-xl p-3 flex items-start gap-3 animate-fadeIn">
                    <div class="bg-blue-500/10 p-2.5 rounded-lg text-blue-500 mt-0.5"><i class="fa-solid fa-user-check text-sm"></i></div>
                    <div class="flex-1">
                        <div id="prev-nama" class="text-xs font-black uppercase text-blue-400 tracking-wide">-</div>
                        <div id="prev-kelas" class="text-[10px] font-mono text-slate-400 font-bold mt-0.5">-</div>
                    </div>
                </div>

                <div class="border-t dynamic-border-row my-1"></div>

                <div class="flex flex-col gap-3">
                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-wider text-slate-400 mb-1">Jenis Perizinan :</label>
                            <select id="select-jenis-izin" class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-2.5 py-2 text-xs font-bold focus:outline-none focus:border-blue-500 text-slate-200">
                                <option value="PULANG">PULANG (PENDING TG)</option>
                                <option value="KELUAR SEBENTAR">KELUAR SEBENTAR (AUTO ACC)</option>
                                <option value="SAKIT">SAKIT (AUTO ACC)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-wider text-slate-400 mb-1">Waktu Mulai :</label>
                            <input type="datetime-local" id="input-tgl-mulai" class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-2.5 py-1.5 text-xs font-mono font-bold focus:outline-none focus:border-blue-500 text-slate-200">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-wider text-slate-400 mb-1">Batas Janji Kembali (Est. Kembali) :</label>
                        <input type="datetime-local" id="input-janji-kembali" class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-2.5 py-1.5 text-xs font-mono font-bold focus:outline-none focus:border-blue-500 text-slate-200">
                    </div>

                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-wider text-slate-400 mb-1">Alasan Detail Keperluan :</label>
                        <textarea id="input-alasan" rows="2" placeholder="Tulis keperluan secara lengkap disini..." class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl px-3 py-2 text-xs font-medium focus:outline-none focus:border-blue-500 text-slate-200 placeholder-slate-500 resize-none"></textarea>
                    </div>

                    <button onclick="prosesUsulkanIzin()" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-black uppercase text-xs tracking-wider shadow-md hover:shadow-blue-500/10 cursor-pointer transition-all mt-1 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-paper-plane"></i> LOG & SUBMIT PERIZINAN
                    </button>
                </div>
            </div>
        </section>

        <section class="lg:col-span-7 flex flex-col gap-4">
            <div class="no-print grid grid-cols-3 gap-3">
                <div class="dynamic-bg-card p-3 rounded-2xl border dynamic-border-row shadow-sm text-center">
                    <div class="text-[10px] font-black text-amber-500 uppercase tracking-wider mb-0.5">Waiting</div>
                    <div id="stat-pending" class="text-xl font-black font-mono tracking-tight text-slate-200">0</div>
                </div>
                <div class="dynamic-bg-card p-3 rounded-2xl border dynamic-border-row shadow-sm text-center">
                    <div class="text-[10px] font-black text-blue-500 uppercase tracking-wider mb-0.5">Di Luar</div>
                    <div id="stat-diluar" class="text-xl font-black font-mono tracking-tight text-slate-200">0</div>
                </div>
                <div class="dynamic-bg-card p-3 rounded-2xl border dynamic-border-row shadow-sm text-center">
                    <div class="text-[10px] font-black text-rose-500 uppercase tracking-wider mb-0.5">Terlambat</div>
                    <div id="stat-terlambat" class="text-xl font-black font-mono tracking-tight text-slate-200">0</div>
                </div>
            </div>

            <div class="dynamic-bg-card rounded-2xl border dynamic-border-row shadow-sm flex-1 flex flex-col overflow-hidden">
                <div class="no-print p-4 border-b dynamic-border-row flex items-center justify-between bg-slate-900/10">
                    <div class="flex items-center gap-1.5 bg-slate-900/60 p-1 rounded-xl border border-slate-800/60">
                        <button id="tab-aktif-izin" onclick="gantiTabFilter('AKTIF')" class="text-[10px] font-black px-3 py-1.5 rounded-lg bg-blue-600 text-white uppercase cursor-pointer shadow-sm transition-all">AKTIF OUT</button>
                        <button id="tab-riwayat-izin" onclick="gantiTabFilter('RIWAYAT')" class="text-[10px] font-black px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white uppercase cursor-pointer transition-all">RIWAYAT / SELESAI</button>
                    </div>
                    <button onclick="muatDataPerizinan()" class="w-7 h-7 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg flex items-center justify-center text-xs border border-slate-700/50 cursor-pointer"><i class="fa-solid fa-rotate animate-spin-slow"></i></button>
                </div>

                <div class="flex-1 overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b dynamic-border-row bg-slate-900/30 text-[10px] font-black uppercase tracking-wider text-slate-400">
                                <th class="py-3 px-4">Santri</th>
                                <th class="py-3">Hajat Izin</th>
                                <th class="py-3">Janji Kembali</th>
                                <th class="py-3 text-center">Status</th>
                                <th class="py-3 px-4 text-right no-print">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tbl-izin-body" class="divide-y dynamic-border-row">
                            <tr>
                                <td colspan="5" class="py-8 text-center text-slate-500 text-xs font-medium uppercase tracking-wide">
                                    <i class="fa-solid fa-slate-spinner animate-spin mr-1.5"></i>Menghubungkan Cloud Server...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="no-print dynamic-bg-card border-t dynamic-border-row py-2 text-center text-[9px] font-bold text-slate-500 uppercase tracking-widest bg-slate-950/20">
        &copy; 2026 PP. Mamba'ul 'Uluum Kedungombo (PPMUY) • All Rights Reserved
    </footer>

    <script>
        // WEB APPS GATEWAY URL (PASTIKAN SUDAH DEPLOY NEW VERSION ANYONE)
        const API_URL = "https://script.google.com/macros/s/AKfycbzsFOWETDSPw7aquOtBNsgkQGjQBcIJaJW6rSNl915MHIns5HFDwCpBwOfPwlk613Asvw/exec";
        
        let masterSantriCache = [];
        let databaseIzinGlobal = [];
        let filterTabSekarang = "AKTIF";
        let santriTerpilihNIK = null;
        let html5QrcodeScanner = null;

        window.addEventListener('DOMContentLoaded', () => {
            const role = localStorage.getItem('session_role') || "KEAMANAN GERBANG";
            const badge = document.getElementById('txt-role-badge');
            if(badge) badge.innerText = role;

            const temaSimpanan = localStorage.getItem('dashboard_theme') || 'theme-dark';
            setTemaAplikasi(temaSimpanan);
            
            // Set waktu default form entri (Real Time Hari Ini)
            let skrg = new Date();
            skrg.setMinutes(skrg.getMinutes() - skrg.getTimezoneOffset());
            document.getElementById('input-tgl-mulai').value = skrg.toISOString().slice(0,16);
            
            let besok = new Date();
            besok.setDate(besok.getDate() + 1);
            besok.setMinutes(besok.getMinutes() - besok.getTimezoneOffset());
            document.getElementById('input-janji-kembali').value = besok.toISOString().slice(0,16);

            muatDataPerizinan();
            muatMasterSantri();
        });

        // 1. AMBIL DATABASE MASTER SANTRI KE CACHE (CORS SECURE FIX)
        // 1. AMBIL DATABASE MASTER SANTRI KE CACHE (MENGGUNAKAN STRING URL MURNI)
        async function muatMasterSantri() {
            try {
                // Menggunakan string murni untuk menjamin kelancaran redirect CORS Google
                let ruteUrl = API_URL + "?aksi=ambil_database";

                let res = await fetch(ruteUrl, { 
                    method: "GET",
                    redirect: "follow" // Memaksa browser mengikuti lompatan server Google ke secure storage
                });
                
                let r = await res.json();
                if(r.status === "success") {
                    masterSantriCache = r.data || [];
                    console.log("Master database santri ter-kloning:", masterSantriCache.length);
                }
            } catch(e) { 
                console.error("Gagal sinkronisasi master cache santri", e); 
            }
        }

        // 2. AMBIL REAL-TIME DATA LOG SPREADSHEET (MENGGUNAKAN STRING URL MURNI)
        async function muatDataPerizinan() {
            const tbody = document.getElementById('tbl-izin-body');
            try {
                // Menggunakan string murni untuk menjamin kelancaran redirect CORS Google
                let ruteUrl = API_URL + "?aksi=ambil_perizinan";

                let res = await fetch(ruteUrl, { 
                    method: "GET",
                    redirect: "follow" // Memaksa browser mengikuti lompatan server Google ke secure storage
                });
                
                let r = await res.json();
                if(r.status === "success") {
                    databaseIzinGlobal = r.data || [];
                    kalkulasiStatistikDanRender();
                } else {
                    if(tbody) tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-red-500 font-bold uppercase text-[10px]">Error Cloud: ${r.message}</td></tr>`;
                }
            } catch(e) {
                console.error("Gagal load perizinan:", e);
                if(tbody) tbody.innerHTML = `<tr><td colspan="5" class="py-4 text-center text-red-500 font-bold uppercase text-[10px]">Gagal memuat data dari cloud server sheet.</td></tr>`;
            }
        }

        // 3. KALKULASI STATISTIK DISPLAY COUNTER
        function kalkulasiStatistikDanRender() {
            let pending = 0, diluar = 0, terlambat = 0;
            let waktuSekarang = new Date();

            databaseIzinGlobal.forEach(item => {
                let status = String(item.Status_Persetujuan || item.status_persetujuan || "").toUpperCase();
                let tglKembali = item.Waktu_Kembali || item.waktu_kembali;
                let janjiKembaliStr = item.Janji_Kembali || item.janji_kembali;
                let janjiKembali = new Date(janjiKembaliStr);

                if(status === "PENDING") pending++;
                if((status === "DISETUJUI" || status === "PENDING TAKZIR") && (!tglKembali || String(tglKembali).trim() === "")) {
                    diluar++;
                    if(waktuSekarang > janjiKembali) terlambat++;
                }
            });
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-diluar').innerText = diluar;
            document.getElementById('stat-terlambat').innerText = terlambat;

            renderTabelIzin();
        }

        // 4. RENDER ELEMENT TABEL MONITOR DATA PERIZINAN
        function renderTabelIzin() {
            const tbody = document.getElementById('tbl-izin-body');
            if(!tbody) return;
            tbody.innerHTML = '';

            let dataFilter = databaseIzinGlobal.filter(item => {
                let tglKembali = item.Waktu_Kembali || item.waktu_kembali;
                let status = String(item.Status_Persetujuan || item.status_persetujuan || "").toUpperCase();
                
                if(filterTabSekarang === "AKTIF") {
                    return (status === "PENDING" || status === "DISETUJUI" || status === "PENDING TAKZIR") && (!tglKembali || String(tglKembali).trim() === "");
                } else {
                    return (status === "REJECTED" || status === "SELESAI" || (tglKembali && String(tglKembali).trim() !== ""));
                }
            });

            if(dataFilter.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-500 uppercase font-bold text-[10px]">Tidak ada catatan perizinan di baris ini.</td></tr>`;
                return;
            }

            // Balik urutan agar data teranyar muncul di baris teratas (Descending Order)
            dataFilter.reverse();

            dataFilter.forEach(item => {
                let row = document.createElement('tr');
                row.className = "border-b dynamic-border-row hover:bg-blue-500/5 transition-all text-xs";
                
                let janjiData = item.Janji_Kembali || item.janji_kembali;
                let tglJanji = new Date(janjiData);
                let tglKembali = item.Waktu_Kembali || item.waktu_kembali;
                let statusStr = String(item.Status_Persetujuan || item.status_persetujuan || "").toUpperCase();
                let dendaAmt = parseInt(item.Denda_Kumulatif || item.denda_kumulatif) || 0;
                
                let isTerlambat = (new Date() > tglJanji && (!tglKembali || String(tglKembali).trim() === ""));
                
                let badge = "";
                if(statusStr === "PENDING") {
                    badge = `<span class="bg-amber-500/15 text-amber-600 dark:text-amber-400 px-2 py-0.5 rounded text-[9px] font-black tracking-wide block w-max mx-auto animate-pulse">WAITING TG</span>`;
                } else if(statusStr === "SELESAI") {
                    badge = `<span class="bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 px-2 py-0.5 rounded text-[9px] font-black tracking-wide block w-max mx-auto">SELESAI</span>`;
                } else if(statusStr === "REJECTED") {
                    badge = `<span class="bg-rose-500/15 text-rose-600 dark:text-rose-400 px-2 py-0.5 rounded text-[9px] font-black tracking-wide block w-max mx-auto">DITOLAK TG</span>`;
                } else if(isTerlambat || statusStr === "PENDING TAKZIR") {
                    badge = `<span class="bg-rose-500/20 text-rose-600 dark:text-rose-400 px-2 py-0.5 rounded text-[9px] font-black tracking-wide block w-max mx-auto">TERLAMBAT / TAKZIR</span>`;
                } else {
                    badge = `<span class="bg-blue-500/15 text-blue-600 dark:text-blue-400 px-2 py-0.5 rounded text-[9px] font-black tracking-wide block w-max mx-auto">DI LUAR PONDOK</span>`;
                }

                let idIzin = item.ID_Izin || item.id_izin || item.ID_IZIN;
                let namaSantri = item.Nama_Santri || item.nama_santri;
                let nikSantri = item.NIK || item.nik;
                let kelasSantri = item.Kelas || item.kelas;
                let jenisIzin = item.Jenis_Izin || item.jenis_izin;
                let alasanIzin = item.Alasan || item.alasan;

                let aksiButton = "";
                if(statusStr === "PENDING") {
                    aksiButton = `<span class="text-amber-500 text-[10px] italic font-semibold">Menunggu Telegram...</span>`;
                } else if((statusStr === "DISETUJUI" || statusStr === "PENDING TAKZIR") && (!tglKembali || String(tglKembali).trim() === "")) {
                    aksiButton = `
                        <button onclick="tutupIzinManual('${idIzin}')" class="px-2 py-1 rounded bg-slate-800 border border-slate-600 text-slate-200 font-black text-[9px] uppercase hover:bg-slate-600 cursor-pointer transition-all">
                            <i class="fa-solid fa-right-to-bracket mr-1"></i>OVERRIDE IN
                        </button>
                    `;
                } else {
                    aksiButton = `<span class="text-slate-500 text-[10px] italic">Logged</span>`;
                }

                let infoDendaTeks = dendaAmt > 0 ? `<span class="text-rose-500 font-extrabold block text-[10px] mt-0.5"><i class="fa-solid fa-hand-holding-dollar mr-0.5"></i> Kena Takzir: Rp ${dendaAmt.toLocaleString('id-ID')}</span>` : '';

                row.innerHTML = `
                    <td class="py-3 px-4 uppercase font-black tracking-wide">
                        ${namaSantri}<br>
                        <span class="text-[9px] font-mono text-slate-400 font-bold">${nikSantri} • ${kelasSantri}</span>
                    </td>
                    <td class="py-3">
                        <span class="text-blue-600 dark:text-blue-400 text-[10px] font-black uppercase block tracking-wider">${jenisIzin}</span>
                        <span class="text-slate-500 text-[11px] block mt-0.5 font-medium">${alasanIzin}</span>
                        ${infoDendaTeks}
                    </td>
                    <td class="py-3 font-mono text-slate-500 text-[10px] font-bold">
                        ${formatTanggalLokal(janjiData)}
                    </td>
                    <td class="py-3 text-center">${badge}</td>
                    <td class="py-3 px-4 text-right no-print">${aksiButton}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // 5. SUBMIT USULAN PERIZINAN BARU (TYPO FIXED & ANTI DUPLICATE)
        async function prosesUsulkanIzin() {
            if(!santriTerpilihNIK) { 
                let inputManualVal = document.getElementById('input-nik-nama').value.trim();
                let sKetemu = masterSantriCache.find(s => String(s.nik).trim() === inputManualVal);
                if(sKetemu) {
                    santriTerpilihNIK = sKetemu.nik;
                } else {
                    alert("Pilih nama atau Scan QR santri terlebih dahulu dari database!"); 
                    return; 
                }
            }
            
            const btnSubmit = document.querySelector("button[onclick='prosesUsulkanIzin()']");
            const jenisIzin = document.getElementById('select-jenis-izin').value;
            const tglMulai = document.getElementById('input-tgl-mulai').value;
            const janjiKembali = document.getElementById('input-janji-kembali').value;
            const alasan = document.getElementById('input-alasan').value;
            const namaSantri = document.getElementById('prev-nama').innerText;
            const kelasSantri = document.getElementById('prev-kelas').innerText;

            let dataSantriObj = masterSantriCache.find(s => String(s.nik).trim() === String(santriTerpilihNIK).trim()) || {};
            let noWali = dataSantriObj.no_wali || dataSantriObj.no_hp || "-";

            if(!alasan.trim()) {
                alert("Alasan detail keperluan wajib diisi!");
                return;
            }

            if(confirm(`Kirim data log usulan izin ${jenisIzin} untuk santri: ${namaSantri}?`)) {
                try {
                    btnSubmit.disabled = true;
                    btnSubmit.innerText = "MENGIRIM KE PENGASUH...";

                    const payloadData = {
                        aksi: "usulkan_izin",
                        nik: santriTerpilihNIK,
                        nama_santri: namaSantri,
                        kelas: kelasSantri,
                        jenis_izin: jenisIzin,
                        alasan: alasan,
                        tgl_mulai: tglMulai,
                        janji_kembali: janjiKembali,
                        no_wali: noWali
                    };

                    await fetch(API_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payloadData)
                    });

                    alert(`Log Data Berhasil Terkirim!\nKhusus jenis PULANG, instruksikan Pengasuh membuka Telegram untuk melakukan Klik ACC.`);
                    
                    // Reset Form Inputan Total
                    document.getElementById('input-alasan').value = "";
                    document.getElementById('preview-santri').classList.add('hidden');
                    santriTerpilihNIK = null;
                    document.getElementById('input-nik-nama').value = "";
                    
                    setTimeout(() => { muatDataPerizinan(); }, 2000);

                } catch (error) {
                    console.error("Gagal mengirim usulan:", error);
                    alert("Terjadi masalah transmisi data ke awan server.");
                } finally {
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = `<i class="fa-solid fa-paper-plane mr-1"></i> LOG & SUBMIT PERIZINAN`;
                }
            }
        }

        // 6. REAL-TIME OVERRIDE IN (SANTRI KEMBALI KEMBALI KE PONDOK)
        async function tutupIzinManual(idIzin) {
            if(confirm("Apakah santri ini benar-benar sudah kembali masuk ke lingkungan pondok?")) {
                try {
                    const payloadData = {
                        aksi: "override_masuk",
                        id_izin: idIzin
                    };

                    await fetch(API_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payloadData)
                    });

                    alert("Status perizinan santri berhasil ditutup. Santri tercatat kembali.");
                    setTimeout(() => { muatDataPerizinan(); }, 1500);
                } catch(e) {
                    alert("Gagal memproses tutup izin.");
                }
            }
        }

        // ==========================================
        // UTILITY COMPONENT FUNCTIONS (DO NOT CHANGE)
        // ==========================================
        function formatTanggalLokal(dStr) {
            if(!dStr) return "-";
            try {
                let d = new Date(dStr);
                if(isNaN(d.getTime())) return dStr;
                return d.toLocaleString('id-ID', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
            } catch(e) { return dStr; }
        }

        function setTemaAplikasi(t) {
            document.body.className = t + " font-sans min-h-screen flex flex-col justify-between dynamic-bg-main";
            localStorage.setItem('dashboard_theme', t);
            const btn = document.getElementById('btn-tema');
            if(btn) btn.innerHTML = t === 'theme-dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }

        // Fungsi pencarian/scanner pendukung (kosongan agar layout tidak error saat dipanggil tombol HTML)
        function setMetodeInput(m) {
            const boxCari = document.getElementById('box-pencarian');
            const boxQr = document.getElementById('box-qr-scanner');
            const btnCari = document.getElementById('btn-metode-cari');
            const btnQr = document.getElementById('btn-metode-qr');
            
            if(m === 'CARI') {
                boxCari.classList.remove('hidden'); boxQr.classList.add('hidden');
                btnCari.className = "py-2 rounded-lg bg-blue-600 text-white font-black uppercase text-[10px] tracking-wider cursor-pointer transition-all";
                btnQr.className = "py-2 rounded-lg bg-slate-800 text-slate-400 font-black uppercase text-[10px] tracking-wider cursor-pointer transition-all";
            } else {
                boxCari.classList.add('hidden'); boxQr.classList.remove('hidden');
                btnQr.className = "py-2 rounded-lg bg-blue-600 text-white font-black uppercase text-[10px] tracking-wider cursor-pointer transition-all";
                btnCari.className = "py-2 rounded-lg bg-slate-800 text-slate-400 font-black uppercase text-[10px] tracking-wider cursor-pointer transition-all";
            }
        }
        function cariLiveSantri() { /* Silakan isi fungsi logika pencarian lokal Anda di sini jika ada */ }

        function toggleTema() {
            const saatIni = localStorage.getItem('dashboard_theme') || 'theme-dark';
            const baru = saatIni === 'theme-dark' ? 'theme-light' : 'theme-dark';
            setTemaAplikasi(baru);
        }

        function gantiTabFilter(tab) {
            filterTabSekarang = tab;
            const btnAktif = document.getElementById('tab-aktif-izin');
            const btnRiwayat = document.getElementById('tab-riwayat-izin');
            
            if(tab === 'AKTIF') {
                btnAktif.className = "text-[10px] font-black px-3 py-1.5 rounded-lg bg-blue-600 text-white uppercase cursor-pointer shadow-sm transition-all";
                btnRiwayat.className = "text-[10px] font-black px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white uppercase cursor-pointer transition-all";
            } else {
                btnRiwayat.className = "text-[10px] font-black px-3 py-1.5 rounded-lg bg-blue-600 text-white uppercase cursor-pointer shadow-sm transition-all";
                btnAktif.className = "text-[10px] font-black px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 hover:text-white uppercase cursor-pointer transition-all";
            }
            renderTabelIzin();
        }
    </script>
