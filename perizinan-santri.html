<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Perizinan Santri PPMUY</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#4f46e5,#7c3aed);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:650px;
background:white;
padding:35px;
border-radius:30px;
box-shadow:0 20px 40px rgba(0,0,0,.25);
}

h1{
text-align:center;
color:#4338ca;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:30px;
}

label{
font-weight:600;
display:block;
margin-top:18px;
margin-bottom:8px;
}

select,input,textarea{
width:100%;
padding:14px;
border-radius:15px;
border:1px solid #ddd;
font-size:15px;
outline:none;
}

textarea{
height:100px;
resize:none;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:18px;
font-size:16px;
font-weight:600;
cursor:pointer;
margin-top:20px;
transition:.3s;
}

.simpan{
background:#10b981;
color:white;
}

.simpan:hover{
background:#059669;
}

.dashboard{
background:#4f46e5;
color:white;
}

.dashboard:hover{
background:#3730a3;
}

#status{
margin-top:20px;
text-align:center;
font-weight:600;
color:#16a34a;
}

.badges{
display:flex;
gap:10px;
justify-content:center;
margin-bottom:25px;
}

.badge{
padding:8px 15px;
border-radius:30px;
font-size:13px;
font-weight:600;
color:white;
}

.sakit{
background:#ef4444;
}

.keluar{
background:#f59e0b;
}

.pulang{
background:#10b981;
}

</style>
</head>
<body>

<div class="card">

<h1>📋 PERIZINAN SANTRI PPMUY</h1>

<div class="subtitle">
Input izin dengan cepat dan mudah
</div>

<div class="badges">
<div class="badge sakit">🤒 Sakit</div>
<div class="badge keluar">🚶 Keluar</div>
<div class="badge pulang">🏠 Pulang</div>
</div>


<label>Nama Santri</label>

<select id="santri">
<option>Pilih Santri</option>
</select>


<label>Jenis Izin</label>

<select id="jenis">
<option>Sakit</option>
<option>Keluar</option>
<option>Pulang</option>
</select>


<label>Alasan</label>

<textarea id="alasan"></textarea>


<label>Janji Kembali</label>

<input type="datetime-local" id="kembali">


<button class="simpan">
✅ Simpan Izin
</button>


<button class="dashboard"
onclick="location.href='https://manajemen.ppmuy.com/dashboard.html'">
🏠 Kembali ke Dashboard
</button>


<div id="status"></div>

</div>

</body>
</html>
