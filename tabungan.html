<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>M-Tabungan BRImo Style PPMUY</title>
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- Face-api.js for Face Recognition -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  
  <style>
    :root {
      --brimo-blue: #00529C;
      --brimo-blue-dark: #002248;
      --brimo-blue-card: #0A3A75;
      --brimo-accent: #00A3E0;
      --bg-gray: #F2F5F9;
      --card-bg: #FFFFFF;
      --text-dark: #1A2533;
      --text-muted: #64748B;
      --danger: #E11D48;
      --success: #10B981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background: var(--bg-gray); 
      color: var(--text-dark); 
      padding: 10px; 
      font-size: 13px; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .app-container { max-width: 440px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 10px; }

    /* HEADER BRIMO */
    .brimo-header {
      background: linear-gradient(135deg, var(--brimo-blue) 0%, var(--brimo-blue-dark) 100%);
      color: white;
      padding: 14px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 82, 156, 0.25);
    }
    .brimo-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .brimo-title { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
    .brimo-title span { color: var(--brimo-accent); }
    .status-badge { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; color: #E0F2FE; }

    /* KARTU SALDO REKENING UTAMA (BRIMO STYLE) */
    .brimo-card-saldo {
      background: linear-gradient(135deg, #062752 0%, var(--brimo-blue-card) 100%);
      border-radius: 12px;
      padding: 12px 14px;
      color: white;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    .brimo-card-saldo::after {
      content: ''; position: absolute; right: -20px; bottom: -20px; width: 90px; height: 90px;
      background: rgba(0, 163, 224, 0.15); border-radius: 50%;
    }
    .saldo-label { font-size: 11px; color: #93C5FD; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .saldo-amount { font-size: 20px; font-weight: 800; margin: 4px 0; letter-spacing: -0.5px; color: #FFFFFF; }
    .santri-detail { font-size: 11px; color: #E0F2FE; font-family: monospace; }

    /* QUICK ACTION GRID (ICON BRIMO) */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--card-bg);
      padding: 10px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .action-btn {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn.active {
      background: #EFF6FF;
      border-color: var(--brimo-blue);
      box-shadow: 0 2px 6px rgba(0, 82, 156, 0.15);
    }
    .action-icon {
      width: 32px; height: 32px; border-radius: 8px; background: #DBEAFE;
      color: var(--brimo-blue); display: flex; align-items: center; justify-content: center; font-size: 15px;
    }
    .action-btn.active .action-icon { background: var(--brimo-blue); color: white; }
    .action-label { font-size: 10px; font-weight: 700; color: var(--text-dark); text-align: center; }

    /* CONTAINER CONTENT CARDS */
    .content-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #E2E8F0;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* INPUT STYLING */
    .input-box { position: relative; }
    .m-input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      background: #F8FAFC;
      transition: 0.2s;
    }
    .m-input:focus { border-color: var(--brimo-blue); background: #FFF; box-shadow: 0 0 0 3px rgba(0, 82, 156, 0.1); }

    /* DROPDOWN HASIL CARI */
    .search-results {
      position: absolute; left: 0; right: 0; top: 100%; max-height: 180px; overflow-y: auto;
      border: 1px solid #93C5FD; border-radius: 10px; margin-top: 4px; background: white;
      z-index: 999; box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }
    .search-item { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #F1F5F9; font-size: 12px; }
    .search-item:hover { background: #EFF6FF; color: var(--brimo-blue); }

    /* SCANNER */
    #reader { width: 100%; max-width: 260px; margin: 0 auto; border-radius: 10px; overflow: hidden; }
    video { width: 100%; max-width: 260px; border-radius: 10px; background: #000; }

    /* TRANSAKSI SELECTOR */
    .tx-type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .tx-type-btn {
      padding: 8px; border: 1.5px solid #CBD5E1; background: #F8FAFC; border-radius: 8px;
      font-size: 11px; font-weight: 800; color: var(--text-muted); cursor: pointer; text-align: center;
    }
    .tx-type-btn.active-setor { background: #ECFDF5; border-color: var(--success); color: var(--success); }
    .tx-type-btn.active-tarik { background: #FEF2F2; border-color: var(--danger); color: var(--danger); }

    .calc-box {
      background: #F0F9FF; border: 1px dashed var(--brimo-accent); padding: 8px 12px; border-radius: 8px;
      display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 10px;
    }
    .calc-box strong { font-size: 13px; color: var(--brimo-blue-dark); font-weight: 800; }

    /* BUTTONS BRIMO */
    .btn-brimo {
      width: 100%; padding: 11px; border: none; border-radius: 10px; font-weight: 800; font-size: 13px;
      cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px;
      background: linear-gradient(135deg, var(--brimo-blue), var(--brimo-blue-dark)); color: white;
      box-shadow: 0 3px 10px rgba(0, 82, 156, 0.25); transition: 0.2s;
    }
    .btn-brimo:active { transform: scale(0.98); }
    .btn-brimo-outline { background: transparent; border: 1.5px solid #CBD5E1; color: var(--text-muted); padding: 11px; border-radius: 10px; font-weight: 700; cursor: pointer; }

    .spinner {
      width: 14px; height: 14px; border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="app-container">
  <!-- BRIMO HEADER -->
  <div class="brimo-header">
    <div class="brimo-header-top">
      <div class="brimo-title">
        🔹 BRI<span>mo</span> Tabungan
      </div>
      <div class="status-badge">● ONLINE</div>
    </div>

    <!-- KARTU SALDO SAKU SANTRI -->
    <div class="brimo-card-saldo">
      <div class="saldo-label">
        <span>Saldo Rekening Tabungan</span>
        <span id="eyeBtn" onclick="toggleSaldoVisibility()" style="cursor:pointer;">👁️</span>
      </div>
      <div class="saldo-amount" id="dispSaldo">Rp ••••••••</div>
      <div class="santri-detail">
        <span id="dispNama">Pilih Santri Terlebih Dahulu</span> <br>
        <span id="dispNik" style="opacity:0.8;">NIK: -</span>
      </div>
    </div>
  </div>

  <!-- QUICK ACTION TAB (BRIMO FEATURE ICON STYLE) -->
  <div class="quick-actions">
    <div class="action-btn active" id="tabBtnManual" onclick="switchTab('manual')">
      <div class="action-icon">✏️</div>
      <div class="action-label">Nama/NIK</div>
    </div>
    <div class="action-btn" id="tabBtnBarcode" onclick="switchTab('barcode')">
      <div class="action-icon">📷</div>
      <div class="action-label">Scan Barcode</div>
    </div>
    <div class="action-btn" id="tabBtnFace" onclick="switchTab('face')">
      <div class="action-icon">👤</div>
      <div class="action-label">Face AI</div>
    </div>
  </div>

  <!-- PENCARIAN METODE -->
  <div class="content-card">
    <!-- TAB MANUAL -->
    <div id="panel-manual" class="tab-panel active">
      <div class="input-box">
        <input type="text" id="inputSearchManual" class="m-input" placeholder="Ketik Nama atau NIK Santri..." oninput="searchSantriManual(this.value)">
        <div id="searchResultsManual" class="search-results" style="display:none;"></div>
      </div>
    </div>

    <!-- TAB BARCODE -->
    <div id="panel-barcode" class="tab-panel">
      <div id="reader"></div>
      <button class="btn-brimo" id="btnToggleBarcode" onclick="toggleBarcodeScanner()" style="margin-top:6px; padding:8px; font-size:11px;">Mulai Scan Barcode</button>
    </div>

    <!-- TAB FACE AI -->
    <div id="panel-face" class="tab-panel" style="text-align: center;">
      <video id="videoFace" autoplay muted playsinline></video>
      <button class="btn-brimo" id="btnStartFace" onclick="initFaceRecognition()" style="margin-top:6px; padding:8px; font-size:11px;">Mulai Scan Wajah</button>
      <p id="faceStatus" style="font-size:10px; color:var(--brimo-blue); font-weight:700; margin-top:4px;"></p>
    </div>
  </div>

  <!-- FORM TRANSAKSI UTAMA -->
  <div class="content-card" id="cardAksi" style="opacity: 0.4; pointer-events: none; transition: 0.3s;">
    <div class="tx-type-grid">
      <button type="button" class="tx-type-btn active-setor" id="btnSetor" onclick="setTxType('TAMBAH')">➕ SETORAN</button>
      <button type="button" class="tx-type-btn" id="btnTarik" onclick="setTxType('TARIK')">➖ PENARIKAN</button>
    </div>

    <div class="input-box" style="margin-bottom:8px;">
      <input type="text" id="nominalInput" class="m-input" placeholder="Masukkan Nominal Rp..." style="font-size:15px; font-weight:800; color:var(--brimo-blue-dark);" onkeyup="this.value = formatRupiah(this.value); hitungTotalSisa();">
    </div>

    <div class="calc-box">
      <span>Estimasi Saldo Akhir:</span>
      <strong id="previewSaldoAkhir">Rp 0</strong>
    </div>

    <div style="display:flex; gap:8px;">
      <button class="btn-brimo" id="btnProses" onclick="simpanTransaksiTabungan()" style="flex:2;">
        💾 OK - PROSES
      </button>
      <button class="btn-brimo-outline" onclick="resetForm()" style="flex:1;">
        🔄 RESET
      </button>
    </div>
    <div id="statusProses" style="margin-top:6px; font-size:11px; font-weight:700; text-align:center;"></div>
  </div>
</div>

<script>
  // KODE URL GOOGLE APPS SCRIPT ASLI YANG TERBUKTI BERHASIL
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzzCmU6_6vVNl8eglTr9kzg3EwFpiEki40Jc_sBay8AlKsMip8p3y7lb9HM61FaKBOo/exec";

  let santriTerpilih = null;
  let tipeTransaksi = "TAMBAH";
  let html5QrCode = null;
  let isScanningBarcode = false;
  let faceModelsLoaded = false;
  let videoStream = null;
  let isSaldoVisible = false;

  function toggleSaldoVisibility() {
    isSaldoVisible = !isSaldoVisible;
    document.getElementById("eyeBtn").innerText = isSaldoVisible ? "👁️‍🗨️" : "👁️";
    if (santriTerpilih) {
      document.getElementById("dispSaldo").innerText = isSaldoVisible 
        ? "Rp " + Number(santriTerpilih.saldo).toLocaleString('id-ID') 
        : "Rp ••••••••";
    }
  }

  function switchTab(tabName) {
    document.querySelectorAll('.action-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
    
    if(tabName === 'manual') document.getElementById('tabBtnManual').classList.add('active');
    if(tabName === 'barcode') document.getElementById('tabBtnBarcode').classList.add('active');
    if(tabName === 'face') document.getElementById('tabBtnFace').classList.add('active');

    document.getElementById('panel-' + tabName).classList.add('active');

    stopBarcodeScanner();
    stopFaceScanner();
  }

  function formatRupiah(angka) {
    let number_string = angka.replace(/[^,\d]/g, '').toString(),
        split = number_string.split(','),
        sisa = split[0].length % 3,
        rupiah = split[0].substr(0, sisa),
        ribuan = split[0].substr(sisa).match(/\d{3}/gi);
    if (ribuan) {
      let separator = sisa ? '.' : '';
      rupiah += separator + ribuan.join('.');
    }
    return rupiah;
  }

  function setTxType(type) {
    tipeTransaksi = type;
    const btnSetor = document.getElementById("btnSetor");
    const btnTarik = document.getElementById("btnTarik");

    if (type === "TAMBAH") {
      btnSetor.className = "tx-type-btn active-setor";
      btnTarik.className = "tx-type-btn";
    } else {
      btnSetor.className = "tx-type-btn";
      btnTarik.className = "tx-type-btn active-tarik";
    }
    hitungTotalSisa();
  }

  // --- MODEL 1: PENCARIAN MANUAL (ASLI & KEMBALI NORMAL) ---
  function searchSantriManual(keyword) {
    const resDiv = document.getElementById("searchResultsManual");
    if (!keyword || keyword.trim().length < 2) { resDiv.style.display = "none"; return; }

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "cors",
      body: JSON.stringify({ action: "searchSantriTabungan", keyword: keyword })
    })
    .then(res => res.json())
    .then(res => {
      if (res.success && res.data && res.data.length > 0) {
        resDiv.innerHTML = "";
        res.data.forEach(santri => {
          let item = document.createElement("div");
          item.className = "search-item";
          item.innerHTML = `<b>${santri.nama}</b> (NIK: ${santri.nik}) - Saldo: Rp ${Number(santri.saldo).toLocaleString('id-ID')}`;
          item.onclick = () => pilihSantri(santri);
          resDiv.appendChild(item);
        });
        resDiv.style.display = "block";
      } else {
        resDiv.style.display = "none";
      }
    });
  }

  function pilihSantri(santri) {
    santriTerpilih = santri;
    isSaldoVisible = true;
    document.getElementById("eyeBtn").innerText = "👁️‍🗨️";

    document.getElementById("searchResultsManual").style.display = "none";
    document.getElementById("inputSearchManual").value = santri.nama;

    document.getElementById("dispNama").innerText = santri.nama;
    document.getElementById("dispNik").innerText = "NIK: " + santri.nik;
    document.getElementById("dispSaldo").innerText = "Rp " + Number(santri.saldo).toLocaleString('id-ID');

    const cardAksi = document.getElementById("cardAksi");
    cardAksi.style.opacity = "1";
    cardAksi.style.pointerEvents = "auto";

    hitungTotalSisa();
  }

  // --- MODEL 2: BARCODE SCANNER ---
  function toggleBarcodeScanner() {
    if (isScanningBarcode) { stopBarcodeScanner(); } else { startBarcodeScanner(); }
  }

  function startBarcodeScanner() {
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (decodedText) => {
        stopBarcodeScanner();
        cariByNik(decodedText);
      },
      (errorMessage) => { }
    ).then(() => {
      isScanningBarcode = true;
      document.getElementById("btnToggleBarcode").innerText = "⏹️ Hentikan Scan";
    }).catch(err => alert("Kamera tidak dapat diakses: " + err));
  }

  function stopBarcodeScanner() {
    if (html5QrCode && isScanningBarcode) {
      html5QrCode.stop().then(() => {
        html5QrCode.clear();
        isScanningBarcode = false;
        document.getElementById("btnToggleBarcode").innerText = "Mulai Scan Barcode";
      });
    }
  }

  function cariByNik(nik) {
    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "cors",
      body: JSON.stringify({ action: "getSantriByNik", nik: nik })
    })
    .then(res => res.json())
    .then(res => {
      if (res.success && res.data) {
        pilihSantri(res.data);
      } else {
        alert("Data NIK " + nik + " tidak ditemukan!");
      }
    });
  }

  // --- MODEL 3: FACE RECOGNITION (AI) ---
  async function initFaceRecognition() {
    const statusText = document.getElementById("faceStatus");
    statusText.innerText = "Memuat AI Wajah...";

    try {
      if (!faceModelsLoaded) {
        await faceapi.nets.ssdMobilenetv1.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
        await faceapi.nets.faceLandmark68Net.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
        await faceapi.nets.faceRecognitionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/');
        faceModelsLoaded = true;
      }

      statusText.innerText = "Membuka Kamera...";
      const video = document.getElementById("videoFace");
      videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
      video.srcObject = videoStream;

      statusText.innerText = "Mencocokkan Wajah...";
      
      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "cors",
        body: JSON.stringify({ action: "getAllFaceVectors" })
      })
      .then(res => res.json())
      .then(async (res) => {
        if (!res.success || !res.data) {
          statusText.innerText = "Gagal mengambil database wajah.";
          return;
        }

        const faceDatabase = res.data;
        const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
        
        if (detection) {
          const currentDescriptor = detection.descriptor;
          let bestMatch = null;
          let minDistance = 0.6;

          faceDatabase.forEach(item => {
            if (item.vector && item.vector.length === 128) {
              const distance = faceapi.euclidDistance(currentDescriptor, item.vector);
              if (distance < minDistance) {
                minDistance = distance;
                bestMatch = item;
              }
            }
          });

          if (bestMatch) {
            statusText.innerText = "✅ Cocok: " + bestMatch.nama;
            stopFaceScanner();
            pilihSantri(bestMatch);
          } else {
            statusText.innerText = "❌ Wajah tidak cocok di database.";
          }
        } else {
          statusText.innerText = "⚠️ Posisikan wajah tepat di kamera.";
        }
      });

    } catch (err) {
      statusText.innerText = "Gagal AI: " + err.message;
    }
  }

  function stopFaceScanner() {
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }
  }

  // --- SIMULASI ESTIMASI SALDO ---
  function hitungTotalSisa() {
    if (!santriTerpilih) return;

    const currentSaldo = Number(santriTerpilih.saldo) || 0;
    const nominalRaw = document.getElementById("nominalInput").value.replace(/\./g, "");
    const nominal = Number(nominalRaw) || 0;

    let estimasi = (tipeTransaksi === "TAMBAH") ? (currentSaldo + nominal) : (currentSaldo - nominal);

    const preview = document.getElementById("previewSaldoAkhir");
    preview.innerText = "Rp " + estimasi.toLocaleString('id-ID');
    preview.style.color = (estimasi < 0) ? "var(--danger)" : "var(--brimo-blue-dark)";
  }

  // --- SIMPAN KE GOOGLE SHEET REALTIME ---
  function simpanTransaksiTabungan() {
    if (!santriTerpilih) { alert("Pilih santri terlebih dahulu!"); return; }
    
    const nominalRaw = document.getElementById("nominalInput").value.replace(/\./g, "");
    const nominal = Number(nominalRaw);
    if (!nominal || nominal <= 0) { alert("Masukkan nominal transaksi yang valid!"); return; }

    const btn = document.getElementById("btnProses");
    const statusDiv = document.getElementById("statusProses");

    btn.disabled = true;
    btn.innerHTML = "<span class='spinner'></span> MENYIMPAN...";

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "cors",
      body: JSON.stringify({
        action: "updateSaldoTabunganSantri",
        nik: santriTerpilih.nik,
        tipe: tipeTransaksi,
        nominal: nominal
      })
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.innerText = "💾 OK - PROSES";

      if (res.success) {
        statusDiv.innerHTML = `<span style='color:var(--success);'>✅ Transaksi Berhasil! Saldo Baru: Rp ${Number(res.saldoBaru).toLocaleString('id-ID')}</span>`;
        santriTerpilih.saldo = res.saldoBaru;
        document.getElementById("dispSaldo").innerText = "Rp " + Number(res.saldoBaru).toLocaleString('id-ID');
        document.getElementById("nominalInput").value = "";
        hitungTotalSisa();
      } else {
        statusDiv.innerHTML = `<span style='color:var(--danger);'>⚠️ Gagal: ${res.error}</span>`;
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerText = "💾 OK - PROSES";
      statusDiv.innerHTML = "<span style='color:var(--danger);'>Koneksi Bermasalah!</span>";
    });
  }

  function resetForm() {
    santriTerpilih = null;
    document.getElementById("dispNama").innerText = "Pilih Santri Terlebih Dahulu";
    document.getElementById("dispNik").innerText = "NIK: -";
    document.getElementById("dispSaldo").innerText = "Rp ••••••••";
    document.getElementById("inputSearchManual").value = "";
    document.getElementById("nominalInput").value = "";
    document.getElementById("statusProses").innerText = "";
    document.getElementById("searchResultsManual").style.display = "none";
    
    const cardAksi = document.getElementById("cardAksi");
    cardAksi.style.opacity = "0.4";
