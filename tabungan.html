<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistem Tabungan Santri PPMUY</title>
  <!-- HTML5 QR Code Scanner Library for Barcode/QR Scanning -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- Face-api.js for Face Recognition / Vector Comparison -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    :root {
      --primary-brimo: #0b56a4;
      --primary-dark: #073b75;
      --bg-brimo: #f4f7fa;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-light: #64748b;
      --accent-teal: #14b8a6;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }

    body { 
      background-color: var(--bg-brimo); 
      color: var(--text-dark); 
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container { 
      width: 100%;
      max-width: 412px; /* Standar lebar layar HP */
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    /* Header Ala BRImo */
    .header-brimo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 4px;
    }
    .header-left .logo {
      font-size: 14px;
      font-weight: 900;
      color: var(--primary-brimo);
      letter-spacing: -0.5px;
    }
    .header-left .logo span {
      color: #f59e0b;
    }
    .header-left .greeting {
      font-size: 11px;
      color: var(--text-light);
      margin-top: -2px;
    }
    .header-left .user-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-dark);
    }
    .header-right {
      display: flex;
      gap: 12px;
    }
    .icon-btn {
      position: relative;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    .icon-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: var(--danger);
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* Card Saldo Utama Ala BRImo */
    .brimo-card {
      background: linear-gradient(135deg, #0b56a4, #1e3a8a);
      color: white;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 4px 12px rgba(11, 86, 164, 0.2);
    }
    .card-label {
      font-size: 11px;
      opacity: 0.85;
      margin-bottom: 4px;
    }
    .card-balance-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .card-balance-col {
      display: flex;
      flex-direction: column;
    }
    .card-balance {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .eye-toggle-container {
      display: flex;
      justify-content: flex-end;
      margin-top: -6px;
      margin-bottom: 6px;
    }
    .eye-toggle {
      background: none;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      opacity: 0.9;
    }
    .card-footer-link {
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 8px;
      margin-top: 6px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      opacity: 0.9;
      text-decoration: none;
      color: white;
      font-weight: 500;
    }

    /* Grid Fitur Utama Ala BRImo */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      background: var(--card-bg);
      padding: 12px 10px;
      border-radius: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
      width: 100%;
    }
    .menu-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background-color: #eff6ff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      margin-bottom: 6px;
      transition: all 0.2s;
    }
    .menu-item.active .menu-icon {
      background-color: #dbeafe;
      border: 1px solid #93c5fd;
    }
    .menu-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dark);
      text-align: center;
    }

    /* Dynamic Tab Area */
    .tab-content { 
      display: none; 
      background: var(--card-bg);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .tab-content.active { 
      display: block; 
    }

    /* Form Fields */
    .form-group { 
      margin-bottom: 0; 
      position: relative; 
    }
    
    /* Search Bar Input Style similar to "Cari Fitur" */
    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-input-wrapper input {
      width: 100%;
      padding: 9px 12px;
      padding-left: 32px;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      font-size: 12px;
      background: #f8fafc;
      outline: none;
    }
    .search-input-wrapper::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      font-size: 11px;
      color: var(--text-light);
    }

    .search-results {
      position: absolute;
      left: 0; right: 0;
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      margin-top: 4px;
      background: white;
      z-index: 999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .search-item {
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid #f1f5f9;
      font-size: 11px;
    }
    .search-item:hover { background: #f0f7ff; color: var(--primary-brimo); }

    /* Camera / Video Containers */
    #reader { 
      width: 100%; 
      max-width: 220px; 
      margin: 0 auto; 
      border-radius: 12px; 
      overflow: hidden; 
    }
    .webcam-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    video { 
      width: 100%; 
      max-width: 200px; 
      height: 140px; 
      object-fit: cover;
      border-radius: 12px; 
      background: #000; 
    }

    /* Banner "Qita" representation */
    .promo-banner {
      background: linear-gradient(90deg, #e0f2fe, #bae6fd);
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #0369a1;
      font-weight: 600;
    }
    .promo-banner span {
      font-weight: 800;
      color: var(--primary-brimo);
    }

    /* Action Transaction Area (Miniaturized) */
    .card-action {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .card-action h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-light);
      margin-bottom: 8px;
    }
    
    .transaction-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .form-control-compact {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 11px;
      outline: none;
    }
    .form-control-compact:focus {
      border-color: var(--primary-brimo);
    }

    .calc-preview-compact {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
    }
    .calc-preview-compact span { 
      font-weight: 800; 
      font-size: 11px; 
    }

    /* Action Buttons Area */
    .action-grid-compact {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 6px;
    }
    .btn-compact {
      padding: 8px;
      border: none;
      border-radius: 20px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }
    .btn-brimo-primary { 
      background: var(--primary-brimo); 
      color: white; 
    }
    .btn-brimo-danger { 
      background: #fee2e2; 
      color: var(--danger); 
    }
    .btn-compact:disabled { 
      opacity: 0.5; 
      cursor: not-allowed; 
    }

    /* Spinner */
    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container">
  
  <!-- HEADER ALA BRIMO -->
  <header class="header-brimo">
    <div class="header-left">
      <div class="logo">PP<span>muy</span></div>
      <div class="greeting">Selamat Datang,</div>
      <div class="user-name" id="dispNamaHeader">di Menu Tabungan, Wahai Santri PPMUY</div>
    </div>
    <div class="header-right">
      <button class="icon-btn">🔔<span class="icon-badge"></span></button>
      <button class="icon-btn">🎧</button>
    </div>
  </header>

  <!-- CARD SALDO UTAMA & SALDO HARIAN -->
  <div class="brimo-card">
    <div class="card-balance-row">
      <div class="card-balance-col">
        <div class="card-label">Saldo Rekening Utama</div>
        <span class="card-balance" id="dispSaldo">Rp ••••••</span>
      </div>
      <div class="card-balance-col" style="text-align: right;">
        <div class="card-label">Saldo Harian</div>
        <span class="card-balance" id="dispSaldoHarian">Rp ••••••</span>
      </div>
    </div>
    <div class="eye-toggle-container">
      <button class="eye-toggle" onclick="toggleBalanceMask()">👁️</button>
    </div>
    <div style="font-size: 11px; opacity: 0.9; margin-top: 4px; display: flex; flex-direction: column; gap: 1px;">
      <div>Nama: <span id="dispNama" style="font-weight: 700;">-</span></div>
      <div>NIK: <span id="dispNik" style="font-weight: 700;">-</span> <span style="opacity: 0.5;">|</span> Gender: <span id="dispGender" style="font-weight: 700;">-</span></div>
    </div>
    <div id="profileCard" style="display: none;"></div>
    <a href="#" class="card-footer-link">
      <span>Semua Rekeningmu</span>
      <span>&gt;</span>
    </a>
  </div>

  <!-- GRID MENU UTAMA / TAB SEARCH ALA BRIMO -->
  <div class="menu-grid">
    <button class="menu-item active tab-btn" onclick="switchTab('manual', this)">
      <div class="menu-icon">✏️</div>
      <div class="menu-label">Manual</div>
    </button>
    <button class="menu-item tab-btn" onclick="switchTab('barcode', this)">
      <div class="menu-icon">📷</div>
      <div class="menu-label">Barcode NIK</div>
    </button>
    <button class="menu-item tab-btn" onclick="switchTab('face', this)">
      <div class="menu-icon">👤</div>
      <div class="menu-label">Scan Wajah</div>
    </button>
    <button class="menu-item" onclick="resetForm()">
      <div class="menu-icon" style="background-color: #fef2f2; color: var(--danger);">🔄</div>
      <div class="menu-label" style="color: var(--danger);">Reset</div>
    </button>
  </div>

  <!-- DYNAMIC TAB CONTENT AREA -->
  <div class="tab-area">
    <!-- TAB 1: MANUAL -->
    <div id="tab-manual" class="tab-content active">
      <div class="form-group">
        <div class="search-input-wrapper">
          <input type="text" id="inputSearchManual" placeholder="Cari Nama / NIK Santri..." oninput="searchSantriManual(this.value)">
        </div>
        <div id="searchResultsManual" class="search-results" style="display:none;"></div>
      </div>
    </div>

    <!-- TAB 2: BARCODE NIK -->
    <div id="tab-barcode" class="tab-content">
      <div id="reader"></div>
      <button class="btn-compact btn-brimo-primary" id="btnToggleBarcode" onclick="toggleBarcodeScanner()" style="margin: 6px auto 0 auto; width: auto; padding: 6px 14px;">Mulai Scan Barcode</button>
    </div>

    <!-- TAB 3: FACIAL RECOGNITION -->
    <div id="tab-face" class="tab-content">
      <div class="webcam-box">
        <video id="videoFace" autoplay muted playsinline></video>
        <button class="btn-compact btn-brimo-primary" id="btnStartFace" onclick="initFaceRecognition()" style="padding: 6px 12px; font-size: 10px;">Mulai Kamera</button>
        <p id="faceStatus" style="font-size:10px; color:#0d9488; font-weight:600; text-align:center; margin-top:4px;"></p>
      </div>
    </div>
  </div>

  <!-- BANNER PROMO ALA BRIMO -->
  <div class="promo-banner">
    <div>Database: <span>Sheet Daftar_Santri_Saldo</span> (Realtime)</div>
    <div style="font-size: 12px;">Qita ↗</div>
  </div>

  <!-- SECTION AKSI TABUNGAN (DIPADATKAN) -->
  <div class="card-action" id="cardAksi" style="opacity: 0.5; pointer-events: none;">
    <h2>Menu Transaksi Tabungan</h2>
    
    <div class="transaction-inputs">
      <div>
        <select id="tipeTransaksi" class="form-control-compact" onchange="hitungTotalSisa()">
          <option value="TAMBAH">➕ Tambah</option>
          <option value="TARIK">➖ Tarik</option>
        </select>
      </div>
      <div>
        <input type="text" id="nominalInput" class="form-control-compact" placeholder="Nominal (Rp)..." onkeyup="this.value = formatRupiah(this.value); hitungTotalSisa();">
      </div>
    </div>

    <div class="calc-preview-compact">
      <div>Estimasi Saldo Akhir:</div>
      <span id="previewSaldoAkhir" style="color:var(--primary-brimo);">Rp 0</span>
    </div>

    <div class="action-grid-compact">
      <button class="btn-compact btn-brimo-primary" id="btnProses" onclick="simpanTransaksiTabungan()">
        💾 OK - Simpan Ke Sheet
      </button>
      <button class="btn-compact btn-brimo-danger" onclick="resetForm()">
        Batal
      </button>
    </div>
    <div id="statusProses" style="margin-top:6px; font-size:10px; font-weight:600; text-align:center;"></div>
  </div>

</div>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzzCmU6_6vVNl8eglTr9kzg3EwFpiEki40Jc_sBay8AlKsMip8p3y7lb9HM61FaKBOo/exec";

  let allSantriData = [];
  let isDataLoaded = false;
  let santriTerpilih = null;
  
  let html5QrCode = null;
  let isScanningBarcode = false;
  let faceModelsLoaded = false;
  let videoStream = null;
  let faceInterval = null;
  
  let realSaldoValue = 0;
  let realSaldoHarianValue = 0;
  let isMasked = true;

  // Unduh seluruh data santri di awal untuk pencarian instan (0,0 Detik)
  document.addEventListener("DOMContentLoaded", () => {
    preloadSantriData();
  });

  function preloadSantriData() {
    const headerTitle = document.getElementById("dispNamaHeader");
    headerTitle.innerText = "Sinkronisasi data database...";

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "cors",
      body: JSON.stringify({ action: "getAllSantri" })
    })
    .then(res => res.json())
    .then(res => {
      if (res.success && res.data) {
        allSantriData = res.data;
        isDataLoaded = true;
        headerTitle.innerText = "di Menu Tabungan, Wahai Santri PPMUY";
      } else {
        headerTitle.innerText = "Gagal memproses data server";
      }
    })
    .catch(err => {
      console.error(err);
      headerTitle.innerText = "Koneksi database bermasalah!";
    });
  }

  function switchTab(tabName, element) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    element.classList.add('active');
    document.getElementById('tab-' + tabName).classList.add('active');

    stopBarcodeScanner();
    stopFaceScanner();
  }

  function formatRupiah(angka) {
    let number_string = angka.replace(/[^,\d]/g, '').toString(),
        split = number_string.split(','),
        sisa = split[0].length % 3,
        rupiah = split[0].substr(0, sisa),
        ribuan = split[0].substr(sisa).match(/\d{3}/gi);
    if (ribuan) {
      let separator = sisa ? '.' : '';
      rupiah += separator + ribuan.join('.');
    }
    return rupiah;
  }

  function toggleBalanceMask() {
    isMasked = !isMasked;
    renderSaldo();
  }

  function renderSaldo() {
    const elSaldo = document.getElementById("dispSaldo");
    const elSaldoHarian = document.getElementById("dispSaldoHarian");
    
    if (!santriTerpilih) {
      elSaldo.innerText = "Rp ••••••";
      elSaldoHarian.innerText = "Rp ••••••";
      return;
    }
    if (isMasked) {
      elSaldo.innerText = "Rp ••••••";
      elSaldoHarian.innerText = "Rp ••••••";
    } else {
      elSaldo.innerText = "Rp " + Number(realSaldoValue).toLocaleString('id-ID');
      elSaldoHarian.innerText = "Rp " + Number(realSaldoHarianValue).toLocaleString('id-ID');
    }
  }

  // --- MODEL 1: PENCARIAN MANUAL INSTAN (CLIENT-SIDE) ---
  function searchSantriManual(keyword) {
    const resDiv = document.getElementById("searchResultsManual");
    if (!keyword || keyword.trim().length < 2) { resDiv.style.display = "none"; return; }
    if (!isDataLoaded) return;

    const query = keyword.toLowerCase().trim();
    const filtered = allSantriData.filter(s => 
      s.nama.toLowerCase().includes(query) || s.nik.includes(query)
    ).slice(0, 15);

    if (filtered.length > 0) {
      resDiv.innerHTML = "";
      filtered.forEach(santri => {
        let item = document.createElement("div");
        item.className = "search-item";
        item.innerHTML = `<b>${santri.nama}</b> (NIK: ${santri.nik})<br>
                          <span style="font-size:9px; color:var(--text-light)">Tabungan: Rp ${Number(santri.saldo).toLocaleString('id-ID')} | Harian: Rp ${Number(santri.saldoHarian).toLocaleString('id-ID')}</span>`;
        item.onclick = () => pilihSantri(santri);
        resDiv.appendChild(item);
      });
      resDiv.style.display = "block";
    } else {
      resDiv.style.display = "none";
    }
  }

  function pilihSantri(santri) {
    santriTerpilih = santri;
    realSaldoValue = santri.saldo;
    realSaldoHarianValue = santri.saldoHarian;
    isMasked = false; // Tampilkan otomatis saat terpilih

    document.getElementById("searchResultsManual").style.display = "none";
    document.getElementById("inputSearchManual").value = santri.nama;

    document.getElementById("dispNamaHeader").innerText = santri.nama;
    document.getElementById("dispNama").innerText = santri.nama;
    document.getElementById("dispNik").innerText = santri.nik;
    document.getElementById("dispGender").innerText = santri.gender || "-";
    
    renderSaldo();

    document.getElementById("profileCard").classList.add("active");
    
    const cardAksi = document.getElementById("cardAksi");
    cardAksi.style.opacity = "1";
    cardAksi.style.pointerEvents = "auto";

    hitungTotalSisa();
  }

  // --- MODEL 2: BARCODE SCANNER (INSTAN CLIENT-SIDE COCOK) ---
  function toggleBarcodeScanner() {
    if (isScanningBarcode) { stopBarcodeScanner(); } else { startBarcodeScanner(); }
  }

  function startBarcodeScanner() {
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 150, height: 150 } },
      (decodedText) => {
        stopBarcodeScanner();
        cariByNikLokal(decodedText);
      },
      (errorMessage) => { }
    ).then(() => {
      isScanningBarcode = true;
      document.getElementById("btnToggleBarcode").innerText = "⏹️ Stop";
    }).catch(err => alert("Kamera tidak dapat diakses: " + err));
  }

  function stopBarcodeScanner() {
    if (html5QrCode && isScanningBarcode) {
      html5QrCode.stop().then(() => {
        html5QrCode.clear();
        isScanningBarcode = false;
        document.getElementById("btnToggleBarcode").innerText = "Mulai Scan Barcode";
      }).catch(err => console.error(err));
    }
  }

  function cariByNikLokal(nik) {
    if (!isDataLoaded) return;
    const match = allSantriData.find(s => s.nik.trim() === nik.trim());
    if (match) {
      pilihSantri(match);
    } else {
      alert("Data NIK " + nik + " tidak ditemukan!");
    }
  }

  // --- MODEL 3: FACE RECOGNITION (PROSES LOKAL INSTAN) ---
  async function initFaceRecognition() {
    const statusText = document.getElementById("faceStatus");
    const video = document.getElementById("videoFace");
    statusText.innerText = "Memuat model AI wajah...";

    try {
      if (!faceModelsLoaded) {
        // Menggunakan CDN model publik face-api yang stabil
        const modelUrl = 'https://justadudewhohacks.github.io/face-api.js/models/';
        await faceapi.nets.ssdMobilenetv1.loadFromUri(modelUrl);
        await faceapi.nets.faceLandmark68Net.loadFromUri(modelUrl);
        await faceapi.nets.faceRecognitionNet.loadFromUri(modelUrl);
        faceModelsLoaded = true;
      }

      statusText.innerText = "Membuka kamera...";
      videoStream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } 
      });
      video.srcObject = videoStream;

      video.onloadedmetadata = () => {
        video.play();
        statusText.innerText = "Mencari & mencocokkan wajah...";
        startFaceMatchingLoop();
      };

    } catch (err) {
      statusText.innerText = "Gagal menginisiasi kamera: " + err.message;
      console.error(err);
    }
  }

  function startFaceMatchingLoop() {
    const statusText = document.getElementById("faceStatus");
    const video = document.getElementById("videoFace");

    faceInterval = setInterval(async () => {
      if (!videoStream) {
        clearInterval(faceInterval);
        return;
      }

      try {
        const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
        if (detection) {
          statusText.innerText = "Wajah terdeteksi, membandingkan...";
          const currentDescriptor = detection.descriptor;
          let bestMatch = null;
          let minDistance = 0.55; // Ambang batas kemiripan wajah

          // Cari wajah yang cocok dari cache allSantriData
          const validCandidates = allSantriData.filter(s => s.vector && s.vector.length === 128);
          
          validCandidates.forEach(item => {
            const distance = faceapi.euclidDistance(currentDescriptor, item.vector);
            if (distance < minDistance) {
              minDistance = distance;
              bestMatch = item;
            }
          });

          if (bestMatch) {
            statusText.innerText = "✅ Cocok: " + bestMatch.nama;
            clearInterval(faceInterval);
            stopFaceScanner();
            pilihSantri(bestMatch);
          } else {
            statusText.innerText = "⚠️ Wajah tidak cocok dengan database.";
          }
        } else {
          statusText.innerText = "🔍 Posisikan wajah di depan kamera...";
        }
      } catch (e) {
        console.error(e);
      }
    }, 1000);
  }

  function stopFaceScanner() {
    if (faceInterval) {
      clearInterval(faceInterval);
      faceInterval = null;
    }
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }
    const video = document.getElementById("videoFace");
    if (video) video.srcObject = null;
    document.getElementById("faceStatus").innerText = "";
  }

  // --- PERHITUNGAN TEMPORARY SALDO ---
  function hitungTotalSisa() {
    if (!santriTerpilih) return;

    const currentSaldo = Number(realSaldoValue) || 0;
    const nominalRaw = document.getElementById("nominalInput").value.replace(/\./g, "");
    const nominal = Number(nominalRaw) || 0;
    const tipe = document.getElementById("tipeTransaksi").value;

    let estimasi = (tipe === "TAMBAH") ? (currentSaldo + nominal) : (currentSaldo - nominal);

    const preview = document.getElementById("previewSaldoAkhir");
    preview.innerText = "Rp " + estimasi.toLocaleString('id-ID');
    preview.style.color = (estimasi < 0) ? "var(--danger)" : "var(--primary-brimo)";
  }

  // --- SIMPAN KE GOOGLE SHEET REALTIME ---
  function simpanTransaksiTabungan() {
    if (!santriTerpilih) { alert("Pilih santri terlebih dahulu!"); return; }
    
    const nominalRaw = document.getElementById("nominalInput").value.replace(/\./g, "");
    const nominal = Number(nominalRaw);
    if (!nominal || nominal <= 0) { alert("Masukkan nominal transaksi yang valid!"); return; }

    const tipe = document.getElementById("tipeTransaksi").value;
    const btn = document.getElementById("btnProses");
    const statusDiv = document.getElementById("statusProses");

    btn.disabled = true;
    btn.innerHTML = "<span class='spinner'></span> Mengirim...";

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "cors",
      body: JSON.stringify({
        action: "updateSaldoTabunganSantri",
        nik: santriTerpilih.nik,
        tipe: tipe,
        nominal: nominal
      })
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.innerText = "💾 OK - Simpan Ke Sheet";

      if (res.success) {
        statusDiv.innerHTML = `<span style='color:var(--success);'>✅ Sukses! Saldo Baru: Rp ${Number(res.saldoBaru).toLocaleString('id-ID')}</span>`;
        
        // Perbarui nilai lokal
        realSaldoValue = res.saldoBaru;
        santriTerpilih.saldo = res.saldoBaru;
        
        // Sinkronisasi data di cache array lokal
        const index = allSantriData.findIndex(s => s.nik === santriTerpilih.nik);
        if (index !== -1) {
          allSantriData[index].saldo = res.saldoBaru;
        }

        isMasked = false;
        renderSaldo();
        document.getElementById("nominalInput").value = "";
        hitungTotalSisa();
      } else {
        statusDiv.innerHTML = `<span style='color:var(--danger);'>⚠️ Gagal: ${res.error}</span>`;
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerText = "💾 OK - Simpan Ke Sheet";
      statusDiv.innerHTML = "<span style='color:var(--danger);'>Koneksi Bermasalah!</span>";
    });
  }

  function resetForm() {
    santriTerpilih = null;
    realSaldoValue = 0;
    realSaldoHarianValue = 0;
    isMasked = true;
    
    document.getElementById("profileCard").classList.remove("active");
    document.getElementById("dispNamaHeader").innerText = "di Menu Tabungan, Wahai Santri PPMUY";
    document.getElementById("dispNama").innerText = "-";
    document.getElementById("dispNik").innerText = "-";
    document.getElementById("dispGender").innerText = "-";
    
    renderSaldo();
    
    document.getElementById("inputSearchManual").value = "";
    document.getElementById("nominalInput").value = "";
    document.getElementById("statusProses").innerText = "";
    
    const cardAksi = document.getElementById("cardAksi");
    cardAksi.style.opacity = "0.5";
    cardAksi.style.pointerEvents = "none";
    document.getElementById("previewSaldoAkhir").innerText = "Rp 0";

    stopBarcodeScanner();
    stopFaceScanner();
  }
</script>
