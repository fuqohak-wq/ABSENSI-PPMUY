<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Tabungan Santri</title>
  <!-- Google Font Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b192c 0%, #1e3e62 50%, #000000 100%);
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-card: rgba(15, 23, 42, 0.65);
      --accent-blue: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header Banner Premium */
    .header-card {
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(30, 64, 175, 0.4);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .header-card::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 180px;
      height: 180px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      filter: blur(20px);
    }

    .header-card h2 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-card p {
      font-size: 0.8rem;
      color: #bfdbfe;
      margin-top: 4px;
    }

    /* Main Glass Card Structure */
    .glass-card {
      background: var(--glass-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Tab Switcher */
    .tab-group {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    /* Form & Input Elements */
    .input-group {
      margin-bottom: 16px;
    }

    .input-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
      font-weight: 500;
    }

    .custom-input, .custom-select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .custom-input:focus, .custom-select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    /* Info Badge / Result Display */
    .santri-info-box {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(6, 95, 70, 0.2) 100%);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    .info-row strong {
      color: #ffffff;
    }

    .saldo-badge {
      font-size: 1.4rem;
      font-weight: 800;
      color: #34d399;
      text-align: right;
      margin-top: 8px;
      text-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
    }

    /* Estimasi Box */
    .estimasi-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--glass-border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      margin: 16px 0;
    }

    .estimasi-box span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .estimasi-box h3 {
      font-size: 1.2rem;
      color: var(--accent-blue);
      margin-top: 4px;
    }

    /* Action Buttons */
    .btn-group {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
    }

    .btn {
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.5);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background: #ef4444;
      color: white;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Header -->
    <div class="header-card">
      <h2><i class="fa-solid => fa-wallet"></i> Tabungan Santri</h2>
      <p>System Realtime Database Sync</p>
    </div>

    <!-- Cari Data Santri -->
    <div class="glass-card">
      <div class="section-title">
        <i class="fa-solid fa-magnifying-glass"></i> Cari Data Santri
      </div>

      <!-- Tab Navigasi Pencarian -->
      <div class="tab-group">
        <button class="tab-btn active"><i class="fa-solid fa-keyboard"></i> Manual</button>
        <button class="tab-btn"><i class="fa-solid fa-barcode"></i> Barcode</button>
        <button class="tab-btn"><i class="fa-solid fa-face-smile"></i> AI Wajah</button>
      </div>

      <div class="input-group">
        <label class="input-label">Ketik Nama / NIK Santri:</label>
        <input type="text" class="custom-input" value="Asyrofil Mursalin" placeholder="Masukkan Nama / NIK...">
      </div>

      <!-- Hasil Pencarian Card -->
      <div class="santri-info-box">
        <div class="info-row">
          <span>NIK:</span>
          <strong>3324130502070001</strong>
        </div>
        <div class="info-row">
          <span>Gender:</span>
          <strong>LAKI-LAKI</strong>
        </div>
        <div class="info-row" style="margin-top: 10px; align-items: flex-end;">
          <span style="color: #a7f3d0; font-weight: 600;">Saldo Tabungan:</span>
          <div class="saldo-badge">Rp 3.391</div>
        </div>
      </div>
    </div>

    <!-- Menu Aksi Transaksi -->
    <div class="glass-card">
      <div class="section-title">
        <i class="fa-solid fa-bolt"></i> Aksi Transaksi
      </div>

      <div class="input-group">
        <label class="input-label">Pilih Jenis Transaksi:</label>
        <select class="custom-select">
          <option>— Tarik / Ambil Tabungan</option>
          <option>+ Setor / Simpan Tabungan</option>
        </select>
      </div>

      <div class="input-group">
        <label class="input-label">Nominal (Rp):</label>
        <input type="text" class="custom-input" value="3.000" placeholder="0">
      </div>

      <div class="estimasi-box">
        <span>Estimasi Saldo Akhir Setelah Transaksi</span>
        <h3>Rp 391</h3>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary">
          <i class="fa-solid fa-paper-plane"></i> Simpan
        </button>
        <button class="btn btn-danger">
          <i class="fa-solid fa-rotate-left"></i> Reset
        </button>
      </div>
    </div>

  </div>

</body>
</html>
