<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Cepat Asatidzah - E-Pesantren Core</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Base Global Transition untuk menyamakan feel perizinan-santri.html */
        body, header, div, section, button, h1, h3, p {
            transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease, transform 0.2s ease;
        }
        
        /* TEMA GELAP (DEFAULT INTEGRATED) */
        .theme-dark {
            --bg-main: #0f172a;
            --bg-header: #020617;
            --bg-box: #020617;
            --bg-inner: #0f172a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }
        
        /* TEMA CERAH (INTEGRATED) */
        .theme-light {
            --bg-main: #f8fafc;
            --bg-header: #ffffff;
            --bg-box: #ffffff;
            --bg-inner: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
        }

        .header-theme {
            background-color: var(--bg-header);
            border-color: var(--border-color);
        }

        .box-filter {
            background-color: var(--bg-box);
            border-color: var(--border-color);
        }

        /* Desain Premium Kartu Ustadz */
        .card-ustadz {
            background-color: var(--bg-box);
            border-color: var(--border-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .theme-dark .card-ustadz:hover {
            border-color: #10b981;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.15), 0 8px 10px -6px rgba(16, 185, 129, 0.1);
            transform: translateY(-4px);
        }

        .theme-light .card-ustadz:hover {
            border-color: #10b981;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.1), 0 4px 6px -4px rgba(16, 185, 129, 0.05);
            transform: translateY(-4px);
        }

        /* Animasi Kartu Hilang Saat Diklik */
        .card-vanish {
            opacity: 0 !important;
            transform: scale(0.7) translateY(20px) !important;
            filter: blur(4px);
            pointer-events: none;
        }

        /* Style Active Tab Filter */
        .btn-active-emerald {
            background-color: #10b981 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }
    </style>
</head>
<body class="theme-dark font-sans antialiased min-h-screen selection:bg-emerald-500/30">

    <header class="header-theme border-b sticky top-0 z-50 px-6 py-4 shadow-sm backdrop-blur-md bg-opacity-95">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            
            <div class="flex items-center gap-4 w-full md:w-auto">
                <button onclick="kembaliKeDashboard()" class="p-2.5 bg-slate-800/40 hover:bg-slate-700/60 text-slate-300 rounded-xl border border-slate-700/50 cursor-pointer active:scale-95 group transition-all" title="Kembali ke Dashboard Utama">
                    <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform"></i>
                </button>

                <button id="btn-tema" onclick="toggleTema()" class="p-2.5 bg-slate-800/40 hover:bg-slate-700/60 text-slate-300 rounded-xl border border-slate-700/50 cursor-pointer active:scale-95 transition-all" title="Ganti Tema">
                    <i class="fa-solid fa-sun"></i>
                </button>
                
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight flex items-center gap-2">
                        <i class="fa-solid fa-user-check text-emerald-500"></i> Presensi Cepat Asatidzah
                    </h1>
                    <p class="text-xs text-muted mt-0.5" style="color: var(--text-muted)">
                        Klik kartu ustadz jika <span class="text-emerald-500 font-semibold">HADIR</span>. Personel yang tersisa di layar otomatis terhitung Alpa/Gaib.
                    </p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end">
                <div class="box-filter p-1 rounded-xl border flex gap-1 shadow-inner">
                    <button id="btnMagrib" onclick="setKajian('Magrib')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-slate-400 cursor-pointer transition-all">MAGRIB</button>
                    <button id="btnSubuh" onclick="setKajian('Subuh')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-slate-400 cursor-pointer transition-all">SUBUH</button>
                </div>

                <div class="box-filter p-1 rounded-xl border flex gap-1 shadow-inner">
                    <button id="btnL" onclick="setGender('L')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-slate-400 cursor-pointer transition-all">LAKI-LAKI</button>
                    <button id="btnP" onclick="setGender('P')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-slate-400 cursor-pointer transition-all">PEREMPUAN</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
        
        <div id="statusArea" class="flex flex-col items-center justify-center py-24 text-center transition-all">
            <div class="relative flex items-center justify-center mb-4">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-slate-700 border-t-emerald-500"></div>
                <i class="fa-solid fa-cloud-arrow-down absolute text-emerald-500 text-xs"></i>
            </div>
            <p id="statusText" class="text-sm font-medium tracking-wide" style="color: var(--text-muted)">Menghubungkan ke pusat pangkalan data asatidzah PPMUY...</p>
        </div>

        <div id="gridUstadz" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-5 opacity-0 hidden transition-all duration-500">
            </div>
    </main>

    <footer class="max-w-7xl mx-auto px-6 pb-8 text-center text-xs opacity-60" style="color: var(--text-muted)">
        &copy; 2026 E-Pesantren Core Framework &bull; PPMUY Realtime Gate.
    </footer>

    <script>
        // URL Web App Terbaru yang Anda Sediakan
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbycq_pur0toFMte0dsiPPXZPhpsKVRwH2CxOnZc3wgvtS20mcb7Lbp2ttLOSr_szZTT/exec";
        
        let logHarianUstadz = [];
        let kajianAktif = "Magrib";
        let genderAktif = "L";

        window.addEventListener('DOMContentLoaded', () => {
            // Ambil preferensi tema agar sinkron penuh dengan perizinan-santri.html
            const savedTheme = localStorage.getItem('dashboard_theme') || 'theme-dark';
            setTemaAplikasi(savedTheme);
            
            fetchDataLog();
        });

        // Pengatur Tema Mengikuti Skema Dashboard Anda Sebelumnya
        function toggleTema() {
            const currentTheme = document.body.classList.contains('theme-dark') ? 'theme-dark' : 'theme-light';
            const newTheme = (currentTheme === 'theme-dark') ? 'theme-light' : 'theme-dark';
            setTemaAplikasi(newTheme);
        }

        function setTemaAplikasi(tema) {
            const btnTema = document.getElementById('btn-tema');
            if (tema === 'theme-light') {
                document.body.classList.remove('theme-dark');
                document.body.classList.add('theme-light');
                if(btnTema) btnTema.innerHTML = `<i class="fa-solid fa-moon text-slate-700"></i>`;
                localStorage.setItem('dashboard_theme', 'theme-light');
            } else {
                document.body.classList.remove('theme-light');
                document.body.classList.add('theme-dark');
                if(btnTema) btnTema.innerHTML = `<i class="fa-solid fa-sun text-amber-400"></i>`;
                localStorage.setItem('dashboard_theme', 'theme-dark');
            }
        }

        function kembaliKeDashboard() {
            // Mengembalikan user ke menu utama/dashboard Apps Script Anda
            window.location.href = "https://manajemen.ppmuy.com"; 
        }

        // Ambil Data Menggunakan Struktur URLSearchParams Bebas Hambatan CORS
        function fetchDataLog() {
            const params = new URLSearchParams({ aksi: "ambil_database_ustadz" });
            
            fetch(`${WEB_APP_URL}?${params.toString()}`, {
                method: "GET",
                mode: "cors"
            })
            .then(r => r.json())
            .then(res => {
                if(res.status === "success") {
                    logHarianUstadz = res.data;
                    
                    // Sembunyikan Loading, Munculkan Grid dengan efek fade-in
                    const statusArea = document.getElementById('statusArea');
                    const gridUstadz = document.getElementById('gridUstadz');
                    
                    statusArea.classList.add('hidden');
                    gridUstadz.classList.remove('hidden');
                    setTimeout(() => gridUstadz.classList.add('opacity-100'), 50);
                    
                    saringDanTampilkan();
                } else {
                    tampilkanPesanError(res.message);
                }
            })
            .catch(e => {
                tampilkanPesanError("Gagal tersambung dengan Cloud Apps Script. Periksa koneksi internet Anda.");
            });
        }

        function tampilkanPesanError(pesan) {
            const statusArea = document.getElementById('statusArea');
            statusArea.innerHTML = `
                <div class="p-4 bg-red-500/10 border border-red-500/20 rounded-2xl max-w-md">
                    <i class="fa-solid fa-triangle-exclamation text-red-500 text-2xl mb-2"></i>
                    <p class="text-sm font-medium text-red-400">${pesan}</p>
                </div>
            `;
        }

        function setKajian(k) {
            kajianAktif = k;
            saringDanTampilkan();
        }

        function setGender(g) {
            genderAktif = g;
            saringDanTampilkan();
        }

        // Fungsi Render Kartu Dinamis & Cantik
        function saringDanTampilkan() {
            // Update Tampilan Tombol Filter Aktif
            document.getElementById('btnMagrib').className = `px-4 py-1.5 rounded-lg text-xs font-bold cursor-pointer transition-all ${kajianAktif === 'Magrib' ? 'btn-active-emerald' : 'text-slate-400'}`;
            document.getElementById('btnSubuh').className = `px-4 py-1.5 rounded-lg text-xs font-bold cursor-pointer transition-all ${kajianAktif === 'Subuh' ? 'btn-active-emerald' : 'text-slate-400'}`;
            
            document.getElementById('btnL').className = `px-4 py-1.5 rounded-lg text-xs font-bold cursor-pointer transition-all ${genderAktif === 'L' ? 'btn-active-emerald' : 'text-slate-400'}`;
            document.getElementById('btnP').className = `px-4 py-1.5 rounded-lg text-xs font-bold cursor-pointer transition-all ${genderAktif === 'P' ? 'btn-active-emerald' : 'text-slate-400'}`;

            const container = document.getElementById('gridUstadz');
            container.innerHTML = '';

            // Lakukan Filtering Data Sheet Berdasarkan Kriteria Tombol Atas
            const hasilSaring = logHarianUstadz.filter(u => {
                // Pastikan kolom "kajian" dan "gender" tersedia di data sheet
                let matchKajian = u.kajian && (u.kajian.toLowerCase().includes(kajianAktif.toLowerCase()));
                
                let g = u.gender ? u.gender.toUpperCase().trim() : '';
                let matchGender = false;
                if (genderAktif === 'L') matchGender = (g === 'L' || g.includes('LAKI'));
                if (genderAktif === 'P') matchGender = (g === 'P' || g.includes('PEREMPUAN'));
                
                return matchKajian && matchGender;
            });

            if(hasilSaring.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 flex flex-col items-center justify-center border border-dashed border-slate-700/60 rounded-3xl p-6">
                        <i class="fa-solid fa-circle-check text-emerald-500 text-3xl mb-3 animate-bounce"></i>
                        <h4 class="text-sm font-semibold">Selesai Menilai!</h4>
                        <p class="text-xs text-muted mt-1 max-w-xs">Seluruh Asatidzah kelompok ${genderAktif === 'L' ? 'Laki-Laki' : 'Perempuan'} untuk jadwal ${kajianAktif} sudah terabsen atau tidak terjadwal.</p>
                    </div>
                `;
                return;
            }

            // Loop untuk menggambar kartu asatidzah
            hasilSaring.forEach(u => {
                const card = document.createElement('div');
                card.id = `card-${u.nik}`;
                // Grid layout box elegan dengan transisi smooth
                card.className = 'card-ustadz p-5 rounded-2xl border flex flex-col justify-between items-center text-center relative overflow-hidden select-none active:scale-95 shadow-sm group cursor-pointer';
                
                card.setAttribute('onclick', `eksekusiAbsenUstadz(\`${u.nik}\`, \`${u.nama.replace(/"/g, '&quot;')}\`)`);
                
                // Variasi inisial dua huruf nama ustadz
                const inisial = u.nama ? u.nama.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase() : 'AZ';
                
                card.innerHTML = `
                    <div class="w-12 h-12 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-500 flex items-center justify-center mb-3 group-hover:bg-emerald-500 group-hover:text-white transition-all duration-300">
                        <span class="text-sm font-black tracking-wider">${inisial}</span>
                    </div>
                    
                    <div class="w-full flex-1 flex flex-col justify-center">
                        <h3 class="text-sm font-bold tracking-tight line-clamp-2 mb-1 group-hover:text-emerald-500 transition-colors duration-200">${u.nama}</h3>
                        <p class="text-[11px] font-medium tracking-wide opacity-70 mb-2" style="color: var(--text-muted)">
                            <i class="fa-solid fa-book-open text-[10px] mr-1"></i>${u.mapel || 'Kitab'}
                        </p>
                    </div>
                    
                    <div class="w-full pt-2 border-t border-slate-700/20 text-[10px] font-mono font-semibold text-emerald-500 bg-emerald-500/5 py-1 rounded-lg">
                        <i class="fa-solid fa-school mr-1"></i>${u.kelas || 'Halaqah'}
                    </div>
                    
                    <div class="absolute inset-0 bg-emerald-500/5 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
                `;
                container.appendChild(card);
            });
        }

        // Fungsi Eksekusi Pengiriman Absensi dengan Animasi Menghilang Indah (Vanish)
        function eksekusiAbsenUstadz(nik, nama) {
            const targetCard = document.getElementById(`card-${nik}`);
            if(!targetCard) return;

            // Kunci kartu secara visual agar tidak bisa diklik ganda selama proses hit ke Google API
            targetCard.style.pointerEvents = "none";
            targetCard.classList.add('scale-95');

            const payload = {
                aksi: "simpan_absen_ustadz_manual",
                nik: nik,
                kajian: kajianAktif
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "cors",
                headers: {
                    "Content-Type": "text/plain" // Meloloskan preflight CORS Google Apps Script
                },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(res => {
                if(res.status === "success") {
                    // Eksekusi efek animasi kartu mengecil, blur, kemudian lenyap dari layar
                    targetCard.classList.add('card-vanish');
                    
                    setTimeout(() => {
                        targetCard.remove();
                        // Hapus dari data memori cache lokal
                        logHarianUstadz = logHarianUstadz.filter(u => !(u.nik === nik && u.kajian.toLowerCase().includes(kajianAktif.toLowerCase())));
                        
                        const container = document.getElementById('gridUstadz');
                        // Cek apakah sisa komponen kartu dalam filter aktif tersebut sudah habis
                        if (container.querySelectorAll('.card-ustadz').length === 0) {
                            saringDanTampilkan();
                        }
                    }, 350); // Waktu jeda animasi CSS terhitung milidetik
                    
                } else {
                    // Pulihkan jika backend menolak instruksi
                    targetCard.classList.remove('scale-95');
                    targetCard.style.pointerEvents = "auto";
                    alert("Gagal mencatat kehadiran: " + res.message);
                }
            })
            .catch(e => {
                // Pulihkan kartu jika jaringan internet putus di tengah jalan
                targetCard.classList.remove('scale-95');
                targetCard.style.pointerEvents = "auto";
                alert("Koneksi gagal terhubung ke Cloud Apps Script. Silakan coba kembali.");
            });
        }
    </script>
</body>
</html>
