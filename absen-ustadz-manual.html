<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Cepat Ustadz - PPMUY</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        body { background-color: #09090b; color: #f4f4f5; }
        .card-ustadz {
            background-color: #18181b;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .card-ustadz:hover {
            transform: scale(1.03);
            border-color: #10b981;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.2);
        }
        .filter-btn-active {
            background-color: #10b981 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen">

    <header class="border-b border-zinc-800 bg-zinc-900 sticky top-0 z-50 px-4 py-4 shadow-md" style="background-color: #18181b; border-color: #27272a;">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    Portal Absensi Cepat Asatidzah
                </h1>
                <p class="text-xs text-zinc-400 mt-0.5">Klik pada kartu untuk konfirmasi HADIR. Kartu akan otomatis terhapus dan ter-update ke spreadsheet.</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <div class="bg-zinc-950 p-1 rounded-xl border border-zinc-800 flex gap-1">
                    <button id="btnMagrib" onclick="setKajian('Magrib')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-zinc-400 filter-btn-active transition-all">MAGRIB</button>
                    <button id="btnSubuh" onclick="setKajian('Subuh')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-zinc-400 transition-all">SUBUH</button>
                </div>

                <div class="bg-zinc-950 p-1 rounded-xl border border-zinc-800 flex gap-1">
                    <button id="btnL" onclick="setGender('L')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-zinc-400 filter-btn-active transition-all">LAKI-LAKI</button>
                    <button id="btnP" onclick="setGender('P')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-zinc-400 transition-all">PEREMPUAN</button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <div id="statusArea" class="flex flex-col items-center justify-center py-20 text-center">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-500 mb-4"></div>
            <p class="text-zinc-400 text-sm">Menyelaraskan data log harian asatidzah...</p>
        </div>

        <div id="gridUstadz" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 hidden">
            </div>
    </main>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec";
        
        let logHarianUstadz = [];
        let kajianAktif = "Magrib";
        let genderAktif = "L";

        window.addEventListener('DOMContentLoaded', () => {
            fetchDataLog();
        });

        function fetchDataLog() {
            fetch(`${WEB_APP_URL}?aksi=ambil_database_ustadz`)
                .then(r => r.json())
                .then(res => {
                    if(res.status === "success") {
                        logHarianUstadz = res.data;
                        document.getElementById('statusArea').classList.add('hidden');
                        document.getElementById('gridUstadz').classList.remove('hidden');
                        saringDanTampilkan();
                    } else {
                        document.getElementById('statusArea').innerHTML = `<p class="text-amber-400 text-sm">${res.message}</p>`;
                    }
                })
                .catch(e => {
                    document.getElementById('statusArea').innerHTML = `<p class="text-red-400 text-sm">Gagal sinkronisasi data log harian.</p>`;
                });
        }

        function setKajian(k) {
            kajianAktif = k;
            document.getElementById('btnMagrib').classList.toggle('filter-btn-active', k === 'Magrib');
            document.getElementById('btnSubuh').classList.toggle('filter-btn-active', k === 'Subuh');
            saringDanTampilkan();
        }

        function setGender(g) {
            genderAktif = g;
            document.getElementById('btnL').classList.toggle('filter-btn-active', g === 'L');
            document.getElementById('btnP').classList.toggle('filter-btn-active', g === 'P');
            saringDanTampilkan();
        }

        function saringDanTampilkan() {
            const container = document.getElementById('gridUstadz');
            container.innerHTML = '';

            // Saring Ganda: Berdasarkan Kajian AKTIF DAN Gender AKTIF
            const hasilSaring = logHarianUstadz.filter(u => {
                let matchKajian = (u.kajian === kajianAktif);
                
                let g = u.gender ? u.gender.toUpperCase().trim() : '';
                let matchGender = false;
                if (genderAktif === 'L') matchGender = (g === 'L' || g.includes('LAKI'));
                if (genderAktif === 'P') matchGender = (g === 'P' || g.includes('PEREMPUAN'));
                
                return matchKajian && matchGender;
            });

            if(hasilSaring.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-zinc-500 py-10 text-sm">✨ Semua Ustadz/Ustadzah di kelompok ini sudah selesai diabsen untuk Kajian ${kajianAktif}.</div>`;
                return;
            }

            hasilSaring.forEach(u => {
                const card = document.createElement('div');
                card.id = `card-${u.nik}`;
                card.className = 'card-ustadz p-4 rounded-xl border border-zinc-800/80 flex flex-col justify-center items-center text-center relative overflow-hidden';
                card.setAttribute('onclick', `eksekusiAbsenUstadz('${u.nik}', '${u.nama}')`);
                
                card.innerHTML = `
                    <div class="w-9 h-9 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center mb-2 pointer-events-none">
                        <span class="text-xs font-bold">${u.nama.substring(0,2).toUpperCase()}</span>
                    </div>
                    <h3 class="text-xs font-bold text-white tracking-tight line-clamp-2 w-full px-1 pointer-events-none">${u.nama}</h3>
                    <p class="text-[10px] text-zinc-500 font-mono mt-1 pointer-events-none">${u.kelas}</p>
                `;
                container.appendChild(card);
            });
        }

        function eksekusiAbsenUstadz(nik, nama) {
            const targetCard = document.getElementById(`card-${nik}`);
            if(!targetCard) return;

            targetCard.style.opacity = "0.3";
            targetCard.style.pointerEvents = "none";

            const payload = {
                aksi: "simpan_absen_ustadz_manual",
                nik: nik,
                kajian: kajianAktif
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(res => {
                if(res.status === "success") {
                    // KARTU LANGSUNG DIELIMINASI DARI LAYAR
                    targetCard.remove();
                    
                    // Update array lokal agar sinkron saat ganti-ganti filter tab
                    logHarianUstadz = logHarianUstadz.filter(u => !(u.nik === nik && u.kajian === kajianAktif));
                    
                    // Cek ketersediaan kartu sisa
                    const container = document.getElementById('gridUstadz');
                    if (container.children.length === 0) {
                        container.innerHTML = `<div class="col-span-full text-center text-emerald-400 py-10 text-sm font-medium">✨ Semua Personel Kajian ${kajianAktif} Selesai Diabsen!</div>`;
                    }
                } else {
                    targetCard.style.opacity = "1";
                    targetCard.style.pointerEvents = "auto";
                    alert("Gagal meng-update: " + res.message);
                }
            })
            .catch(e => {
                targetCard.style.opacity = "1";
                targetCard.style.pointerEvents = "auto";
                alert("Koneksi gagal terhubung ke Cloud Apps Script.");
            });
        }
    </script>
</body>
</html>
