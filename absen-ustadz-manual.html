<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Manual Ustadz - PPMUY</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #09090b; /* bg-zinc-950 alternatif */
            color: #f4f4f5;
        }
        .card-ustadz {
            background-color: #18181b; /* bg-zinc-900 alternatif */
            transition: all 0.2s ease-in-out;
        }
        .card-ustadz:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.1), 0 4px 6px -2px rgba(16, 185, 129, 0.05);
        }
        /* Custom scrollbar untuk estetika dashboard */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen">

    <header class="border-b border-zinc-800 bg-zinc-900 sticky top-0 z-50 px-4 py-4 shadow-md" style="background-color: #18181b; border-color: #27272a;">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-emerald-500/10 rounded-xl border border-emerald-500/20 text-emerald-400">
                    <svg class="w-6 height-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        Presensi Personel Asatidzah
                        <span class="px-2 py-0.5 text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full">Manual Portal</span>
                    </h1>
                    <p class="text-xs text-zinc-400 mt-0.5">PPM. Al-Anwar Mangunsari | HQ Management System</p>
                </div>
            </div>
            
            <div class="relative w-full sm:w-72">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-zinc-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </span>
                <input type="text" id="inputCari" onkeyup="filterUstadz()" placeholder="Cari nama ustadz..." 
                       class="w-full pl-9 pr-4 py-2 bg-zinc-950 text-sm text-zinc-200 border border-zinc-800 rounded-xl focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 placeholder-zinc-500 transition-all" style="background-color: #09090b; border-color: #27272a;">
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <div id="statusArea" class="flex flex-col items-center justify-center py-20 text-center">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-500 mb-4"></div>
            <p class="text-zinc-400 font-medium text-sm tracking-wide">Membaca data personel asatidzah dari cloud server...</p>
        </div>

        <div id="gridUstadz" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 hidden">
            </div>
    </main>

    <script>
        // MENGUNCI URL WEB APP TERBARU ANDA SECARA LANGSUNG
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec";

        let databaseUstadz = [];

        // 1. Ambil Data Saat Halaman Pertama Kali Dibuka
        window.addEventListener('DOMContentLoaded', () => {
            muatDataAsatidzah();
        });

        function muatDataAsatidzah() {
            const urlTarget = `${WEB_APP_URL}?aksi=ambil_database_ustadz`;
            
            fetch(urlTarget)
                .then(response => response.json())
                .then(res => {
                    const statusArea = document.getElementById('statusArea');
                    const gridUstadz = document.getElementById('gridUstadz');

                    if (res.status === 'success' && res.data && res.data.length > 0) {
                        databaseUstadz = res.data;
                        statusArea.classList.add('hidden');
                        gridUstadz.classList.remove('hidden');
                        renderCards(databaseUstadz);
                    } else {
                        statusArea.innerHTML = `
                            <div class="p-3 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-xl max-w-md">
                                <p class="font-semibold text-sm">Data Tidak Ditemukan</p>
                                <p class="text-xs text-zinc-400 mt-1">Pastikan di data master_santri Anda terdapat nama dengan unsur 'Ustadz' atau kolom kelas tertulis 'Asatidzah'.</p>
                            </div>
                        `;
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('statusArea').innerHTML = `
                        <div class="p-4 bg-red-500/10 text-red-400 border border-red-500/20 rounded-xl max-w-md">
                            <p class="font-bold text-sm">Gagal Terhubung ke Server</p>
                            <p class="text-xs text-zinc-400 mt-1">Gagal mengambil data. Pastikan Web App sudah dideploy ulang sebagai 'Anyone' dan 'New Version'.</p>
                            <button onclick="muatDataAsatidzah()" class="mt-3 px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-white rounded-lg transition-all">Coba Lagi</button>
                        </div>
                    `;
                });
        }

        // 2. Render List Kartu ke HTML
        function renderCards(dataList) {
            const container = document.getElementById('gridUstadz');
            container.innerHTML = '';

            dataList.forEach(ustadz => {
                const card = document.createElement('div');
                card.className = 'card-ustadz rounded-2xl p-5 border border-zinc-800/60 flex flex-col justify-between relative overflow-hidden';
                card.setAttribute('data-nama', ustadz.nama.toLowerCase());

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <span class="px-2 py-0.5 text-xs font-semibold rounded-md bg-zinc-800 text-zinc-300 uppercase tracking-wider">
                                ${ustadz.kelas || 'ASATIDZAH'}
                            </span>
                            <div class="w-2 h-2 rounded-full bg-zinc-600"></div>
                        </div>

                        <h3 class="text-base font-bold text-white tracking-tight line-clamp-1 mb-1">${ustadz.nama}</h3>
                        <p class="text-xs text-zinc-500 font-mono tracking-wide mb-6">ID: ${ustadz.nik}</p>
                    </div>

                    <div class="flex gap-2 mt-auto pt-2 border-t border-zinc-800/40">
                        <button onclick="prosesAbsenLokal('${ustadz.nik}', '${ustadz.nama}', 'HADIR')" 
                                class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs rounded-xl shadow-sm transition-all focus:outline-none active:scale-95">
                            HADIR
                        </button>
                        <button onclick="prosesAbsenLokal('${ustadz.nik}', '${ustadz.nama}', 'IZIN')" 
                                class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium text-xs rounded-xl transition-all focus:outline-none active:scale-95">
                            IZIN
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 3. Logika Pencarian Realtime
        function filterUstadz() {
            const kueri = document.getElementById('inputCari').value.toLowerCase();
            const kartuSemua = document.querySelectorAll('#gridUstadz > div');
            
            kartuSemua.forEach(kartu => {
                const namaUstadz = kartu.getAttribute('data-nama');
                if (namaUstadz.includes(kueri)) {
                    kartu.classList.remove('hidden');
                } else {
                    kartu.classList.add('hidden');
                }
            });
        }

        // 4. Kirim Data Absen ke Server via POST
        function prosesAbsenLokal(nik, nama, status) {
            // Beri feedback loading instan pada tombol agar user tahu data diproses
            const tombol = event.target;
            const teksAsli = tombol.innerText;
            tombol.disabled = true;
            tombol.innerText = '...';

            const payload = {
                aksi: "simpan_absen_ustadz_manual",
                nik: nik,
                nama: nama,
                status: status
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(res => {
                tombol.disabled = false;
                tombol.innerText = teksAsli;

                if (res.status === "success") {
                    alert(`Alhamdulillah, Presensi ${status} untuk ${nama} berhasil dicatat!`);
                } else {
                    alert(`Gagal: ${res.message}`);
                }
            })
            .catch(err => {
                tombol.disabled = false;
                tombol.innerText = teksAsli;
                console.error(err);
                alert("Koneksi gagal/terputus. Silakan coba klik tombol sekali lagi.");
            });
        }
    </script>
</body>
</html>
