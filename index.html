<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen PPMUY</title>
    <!-- Tailwind CSS untuk Desain Modern & Futuristik -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome untuk Ikon Keren -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-white">

    <!-- ========================================== -->
    <!-- 1. HALAMAN LOGIN (Akses Semua Pengurus)    -->
    <!-- ========================================== -->
    <div id="page-login" class="page active min-h-screen flex items-center justify-center p-4">
        <div class="bg-slate-800/80 backdrop-blur-md p-8 rounded-2xl shadow-2xl border border-slate-700 w-full max-w-md transform transition-all">
            <div class="text-center mb-8">
                <div class="inline-flex p-4 bg-emerald-500/10 rounded-full text-emerald-400 mb-3 text-3xl">
                    <i class="fa-solid fa-mosque"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight">E-Pesantren PPMUY</h1>
                <p class="text-slate-400 text-sm mt-1">Silakan masuk menggunakan akun pengurus Anda</p>
            </div>

            <form id="form-login" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="login-username" required class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password / PIN</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
                    </div>
                </div>

                <div id="login-error" class="hidden text-sm bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-xl flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span id="login-error-msg">Username atau Password salah.</span>
                </div>

                <button type="submit" id="btn-login" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition-all duration-200 active:scale-98 flex items-center justify-center gap-2">
                    <span>Masuk ke Sistem</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. HALAMAN DASHBOARD UTAMA                 -->
    <!-- ========================================== -->
    <div id="page-dashboard" class="page min-h-screen flex flex-col">
        <!-- Navbar Atas -->
        <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-shield-halved text-emerald-400 text-xl"></i>
                <div>
                    <h2 class="font-bold text-lg leading-tight" id="user-display-name">Nama Pengurus</h2>
                    <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-md font-medium uppercase tracking-wider" id="user-display-role">Role</span>
                </div>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-400 p-2 rounded-xl hover:bg-slate-700/50 transition">
                <i class="fa-solid fa-right-from-bracket text-lg"></i>
            </button>
        </header>

        <!-- Konten Utama Dashboard -->
        <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
            <div class="mb-6">
                <h3 class="text-xl font-bold">Pusat Kendali Pesantren</h3>
                <p class="text-sm text-slate-400">Selamat datang kembali. Silakan pilih modul kerja Anda hari ini.</p>
            </div>

            <!-- Grid Menu Dinamis (Muncul Berdasarkan Hak Akses / Role) -->
            <div id="menu-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Menu akan diinjeksi oleh JavaScript berdasarkan Role -->
            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT - LOGIKA HUBUNGAN KE API .GS    -->
    <!-- ========================================== -->
    <script>
        // URL API Google Apps Script Anda
        const API_URL = "https://script.google.com/macros/s/AKfycbz0BZ-mwLGGhySPEz6H6krnScZoo7S8ZNLDAWh-dvCTQyhy62tkDV6RuCUotScR5REt7w/exec";

        // Variabel Penyimpan Data User yang Sedang Login
        let currentUser = null;

        // Fungsi Pindah Halaman Tanpa Loading
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // Handle Form Login
        document.getElementById('form-login').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById('login-username').value;
            const passwordInput = document.getElementById('login-password').value;
            const btnLogin = document.getElementById('btn-login');
            const errorDiv = document.getElementById('login-error');
            const errorMsg = document.getElementById('login-error-msg');

            // Efek Loading pada tombol
            btnLogin.disabled = true;
            btnLogin.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>Memverifikasi...</span>`;
            errorDiv.classList.add('hidden');

            try {
                // Tembak data ke API Google Apps Script
                const response = await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Penting untuk menghindari CORS issue pada Google App Script standar
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'login',
                        username: usernameInput,
                        password: passwordInput
                    })
                });

                /* 
                  Catatan khusus mode 'no-cors': Kita tidak bisa membaca isi JSON respons secara langsung.
                  Untuk simulasi pengembangan cepat agar sistem langsung bisa dicoba di sisi Vercel/Lokal,
                  kita lakukan verifikasi lokal jika no-cors aktif, atau sesuaikan skrip .gs di masa depan.
                */
                
                // Pembacaan Data Simulasi Cepat (Karena no-cors mengosongkan response body demi keamanan browser)
                // Kita akan tembak ulang atau lakukan bypass otentikasi pintar sesuai dengan user contoh di .gs Anda
                // Di bawah ini adalah gerbang logika untuk membaca hasil dari users_pengurus Anda:
                
                // Bypass cerdas untuk pengembangan (Kita mengasumsikan data cocok dengan user contoh yang dibuat di .gs)
                let mockRole = "";
                let mockNama = "";

                if (usernameInput === "admin_kiai" && passwordInput === "123456") { mockRole = "Kiai"; mockNama = "K.H. Masykur"; }
                else if (usernameInput === "guru_ahmad" && passwordInput === "112233") { mockRole = "Guru"; mockNama = "Ustadz Ahmad"; }
                else if (usernameInput === "keamanan_pondok" && passwordInput === "445566") { mockRole = "Keamanan"; mockNama = "Kang Ali"; }
                else if (usernameInput === "kiosk_masjid" && passwordInput === "778899") { mockRole = "Kiosk"; mockNama = "Tablet Masjid"; }

                if (mockRole !== "") {
                    currentUser = { username: usernameInput, nama: mockNama, role: mockRole };
                    suksesLogin(currentUser);
                } else {
                    throw new Error("Username atau Password/PIN salah!");
                }

            } catch (err) {
                errorMsg.innerText = err.message || "Terjadi kesalahan jaringan.";
                errorDiv.classList.remove('hidden');
                btnLogin.disabled = false;
                btnLogin.innerHTML = `<span>Masuk ke Sistem</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
            }
        });

        // Aksi Ketika Login Sukses
        function suksesLogin(user) {
            document.getElementById('user-display-name').innerText = user.nama;
            document.getElementById('user-display-role').innerText = user.role;
            
            // Generate Menu Berdasarkan Role
            renderMenu(user.role);
            
            // Pindah ke Halaman Dashboard
            showPage('page-dashboard');
            
            // Reset Form
            document.getElementById('form-login').reset();
            document.getElementById('btn-login').disabled = false;
            document.getElementById('btn-login').innerHTML = `<span>Masuk ke Sistem</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
        }

        // Mengatur Menu yang Muncul Berdasarkan Siapa Yang Login (Sesuai Kesepakatan)
        function renderMenu(role) {
            const container = document.getElementById('menu-container');
            container.innerHTML = ""; // Bersihkan menu lama

            // Daftar Seluruh Modul Webapp PPMUY
            const semuaMenu = [
                { id: 'jamaah', nama: 'Absensi Wajah Jamaah', ikon: 'fa-user-check', warna: 'bg-indigo-600', roles: ['Kiai', 'Kiosk'] },
                { id: 'sekolah', nama: 'Absensi Sekolah (Manual)', ikon: 'fa-graduation-cap', warna: 'bg-emerald-600', roles: ['Kiai', 'Guru'] },
                { id: 'perizinan', nama: 'Perizinan Santri', ikon: 'fa-id-card', warna: 'bg-amber-600', roles: ['Kiai', 'Keamanan'] },
                { id: 'pelanggaran', nama: 'Data Pelanggaran (Ta\'zir)', ikon: 'fa-gavel', warna: 'bg-red-600', roles: ['Kiai', 'Keamanan'] },
                { id: 'piket', nama: 'Piket Kebersihan Asrama', ikon: 'fa-broom', warna: 'bg-cyan-600', roles: ['Kiai', 'Kebersihan'] },
                { id: 'evaluasi', nama: 'Evaluasi Pelajaran', ikon: 'fa-chart-simple', warna: 'bg-purple-600', roles: ['Kiai', 'Guru'] }
            ];

            // Filter menu sesuai role user yang login
            semuaMenu.forEach(menu => {
                if (menu.roles.includes(role)) {
                    const card = document.createElement('button');
                    card.className = `p-5 rounded-2xl ${menu.warna} text-left shadow-lg hover:scale-[1.02] active:scale-98 transition duration-200 flex flex-col justify-between h-40 group cursor-pointer w-full`;
                    card.onclick = () => bukaModul(menu.id);
                    card.innerHTML = `
                        <div class="p-3 bg-white/10 rounded-xl w-fit text-xl group-hover:scale-110 transition"><i class="fa-solid ${menu.ikon}"></i></div>
                        <div>
                            <h4 class="font-bold text-lg">${menu.nama}</h4>
                            <p class="text-xs text-white/70 mt-1">Buka modul aplikasi &rarr;</p>
                        </div>
                    `;
                    container.appendChild(card);
                }
            });
        }

        // Fungsi Trigger Klik Menu Modul
        function bukaModul(modulId) {
            alert("Anda membuka modul: " + modulId + ". Fitur ini akan kita aktifkan di tahap berikutnya!");
        }

        // Fungsi Logout
        function logout() {
            currentUser = null;
            showPage('page-login');
        }
    </script>
</body>
</html>
