<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Face Recognition Kiosk - PPMUY</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Memuat Library Face-API.js Langsung Lewat CDN Premium -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-lg bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl p-6 text-center space-y-6">
        
        <!-- Header -->
        <div>
            <h1 class="text-xl font-bold tracking-tight text-indigo-400"><i class="fa-solid fa-eye-tracker mr-2"></i>AI ABSENSI WAJAH OTOMATIS</h1>
            <p class="text-xs text-slate-400 mt-1">Santri cukup berdiri di depan kamera tanpa klik nama</p>
        </div>

        <!-- Status Loading AI Model -->
        <div id="ai-status" class="text-xs bg-amber-500/10 border border-amber-500/20 text-amber-400 py-2 px-4 rounded-xl">
            <i class="fa-solid fa-spinner animate-spin mr-2"></i>Menyiapkan Kecerdasan Buatan (AI)... Mohon Tunggu.
        </div>

        <!-- Kamera Area (Deteksi Otomatis) -->
        <div class="relative aspect-video w-full bg-black rounded-2xl overflow-hidden border-2 border-slate-700 shadow-inner" id="camera-container">
            <video id="video-feed" autoplay playsinline class="w-full h-full object-cover scale-x-[-1]"></video>
            <!-- Overlay Pemindai Medis -->
            <div class="absolute inset-0 border-2 border-dashed border-indigo-500/30 m-4 rounded-xl pointer-events-none animate-pulse flex items-center justify-center">
                <div class="w-48 h-48 border-2 border-indigo-400 rounded-full opacity-40 animate-ping"></div>
            </div>
        </div>

        <!-- Kontrol Waktu Shalat -->
        <div class="grid grid-cols-2 gap-4 text-left text-xs">
            <div>
                <label class="block text-slate-400 uppercase font-semibold text-[10px] mb-1">Waktu Ibadah</label>
                <select id="waktu-shalat" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-slate-200 outline-none focus:border-indigo-500">
                    <option value="Subuh">Subuh</option>
                    <option value="Dhuhur">Dhuhur</option>
                    <option value="Ashar">Ashar</option>
                    <option value="Maghrib">Maghrib / Wirid</option>
                    <option value="Isya'">Isya'</option>
                </select>
            </div>
            <div>
                <label class="block text-slate-400 uppercase font-semibold text-[10px] mb-1">Aksi Perangkat</label>
                <button onclick="inisialisasiKamera()" id="btn-cam" disabled class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl transition cursor-not-allowed">
                    <i class="fa-solid fa-camera mr-2"></i>Jalankan Kamera
                </button>
            </div>
        </div>

        <!-- Pop-up Notifikasi Hasil Deteksi Wajah Otomatis -->
        <div id="notif-sukses" class="hidden bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 p-4 rounded-2xl animate-bounce">
            <div class="flex items-center justify-center gap-3">
                <div class="text-2xl">🔊</div>
                <div class="text-left">
                    <span class="text-[10px] uppercase tracking-wider block text-emerald-500 font-bold">Berhasil Dicatat (BEEP!)</span>
                    <span class="font-bold text-base" id="nama-terdeteksi">Nama Santri</span>
                </div>
            </div>
        </div>

    </div>

    <!-- AUDIO ENGINE UNTUK SUARA BEEP SCANNER PREMIUM -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function bunyikanBeep() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "sine"; 
            osc.frequency.value = 1300; // Frekuensi nada Scanner Kasir/Kiosk
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.12);
        }
    </script>

    <!-- LOGIKA UTAMA AI REKOGNISI WAJAH -->
    <script>
        const API_URL = "URL_WEB_APP_DEPLOYMENT_ANDA_DISINI"; 
        let masterSantri = [];
        let labeledDescriptors = [];
        let faceMatcher = null;
        let isProcessingAbsen = false;

        // 1. LOAD MODEL AI SAAT HALAMAN DIBUKA
        window.onload = async () => {
            try {
                // Memuat model deteksi wajah dari server open source
                const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohack/face-api.js/master/weights';
                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark64Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                
                document.getElementById('ai-status').className = "text-xs bg-blue-500/10 border border-blue-500/20 text-blue-400 py-2 px-4 rounded-xl";
                document.getElementById('ai-status').innerText = "Model AI Siap. Mengunduh data foto wajah santri...";
                
                await ambilDataWajahMaster();
            } catch (e) {
                document.getElementById('ai-status').innerText = "Gagal memuat sistem AI. Cek koneksi internet.";
            }
        };

        // 2. AMBIL FOTO MASTER DARI GOOGLE SHEETS UNTUK PENCOCOKAN
        async function ambilDataWajahMaster() {
            try {
                const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "getDaftarSantri" }) });
                const r = await res.json();
                if (r.status === "success") {
                    masterSantri = r.data;
                    
                    // Proses foto-foto santri menjadi koordinat matriks matematika (Descriptor)
                    for (let santri of masterSantri) {
                        if (santri.foto) {
                            try {
                                const img = await faceapi.fetchImage(santri.foto);
                                const detections = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
                                if (detections) {
                                    labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(santri.nik, [detections.descriptor]));
                                }
                            } catch(err) { console.log("Gagal memproses foto untuk: " + santri.nama); }
                        }
                    }

                    if(labeledDescriptors.length > 0) {
                        faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6); // Akurasi kecocokan 60-70%
                        document.getElementById('ai-status').className = "text-xs bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 py-2 px-4 rounded-xl";
                        document.getElementById('ai-status').innerHTML = `<i class="fa-solid fa-circle-check mr-2"></i>Sistem AI Aktif! Silakan jalankan kamera.`;
                        document.getElementById('btn-cam').disabled = false;
                        document.getElementById('btn-cam').className = "w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl shadow-lg transition cursor-pointer";
                    } else {
                        document.getElementById('ai-status').innerText = "Belum ada foto master santri yang terdaftar di Sheets.";
                    }
                }
            } catch(e) { document.getElementById('ai-status').innerText = "Gagal sinkronisasi data santri."; }
        }

        // 3. JALANKAN KAMERA KIOSK
        async function inisialisasiKamera() {
            const video = document.getElementById('video-feed');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: {}, audio: false });
                video.srcObject = stream;
                // Mulai deteksi wajah otomatis berulang
                mulaiPemindaianWajahOtomatis();
            } catch (err) { alert("Kamera tidak diizinkan atau tidak ditemukan."); }
        }

        // 4. PEMINDAIAN OTOMATIS BERKELANJUTAN (LOOPING SCANNER)
        function mulaiPemindaianWajahOtomatis() {
            const video = document.getElementById('video-feed');
            
            setInterval(async () => {
                if (isProcessingAbsen) return; // Kunci sistem jika sedang memproses satu santri (mencegah double-input)

                const detections = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
                
                if (detections && faceMatcher) {
                    const bestMatch = faceMatcher.findBestMatch(detections.descriptor);
                    
                    // Jika wajah dikenali di database (bukan 'unknown')
                    if (bestMatch.label !== 'unknown') {
                        const nikSantri = bestMatch.label;
                        const dataSantri = masterSantri.find(s => s.nik === nikSantri);
                        
                        if (dataSantri) {
                            isProcessingAbsen = true; // Kunci scanner
                            
                            // Eksekusi Efek Suara
                            bunyikanBeep();
                            
                            // Tampilkan Notifikasi Nama ke Layar
                            document.getElementById('nama-terdeteksi').innerText = dataSantri.nama + " (" + dataSantri.kelas + ")";
                            document.getElementById('notif-sukses').classList.remove('hidden');
                            
                            // Kirim ke Google Sheets secara Real-Time
                            await kirimKeBackendSheets(dataSantri.nik);
                            
                            // Beri jeda 3 detik agar santri tersebut berganti posisi dengan santri di belakangnya
                            setTimeout(() => {
                                document.getElementById('notif-sukses').classList.add('hidden');
                                isProcessingAbsen = false; // Buka kunci scanner kembali
                            }, 3000);
                        }
                    }
                }
            }, 800); // AI memindai wajah setiap 0,8 detik secara otomatis
        }

        async function kirimKeBackendSheets(nik) {
            const waktu = document.getElementById('waktu-shalat').value;
            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "simpanAbsenJamaah", nik: nik, waktuShalat: waktu })
                });
            } catch (e) { console.log("Gagal sinkronisasi data cloud."); }
        }
    </script>
</body>
</html>
