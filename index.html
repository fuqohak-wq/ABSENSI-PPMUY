<script>
    // URL WebApp Anda (Tetap sesuai aslinya)
    const URL_API = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec";

    // State Aplikasi
    let dbSantriCache = [];
    let globalRekapAlpa = {};
    let myChartWajah = null;
    let myChartShalat = null;
    let streamKameraKiosk = null;
    let streamKameraReg = null;

    window.addEventListener('DOMContentLoaded', () => {
        cekStatusLogin();
    });

    // 1. KEAMANAN & SESI
    function cekStatusLogin() {
        let session = localStorage.getItem('ppmuy_session');
        if (session) {
            let data = JSON.parse(session);
            document.getElementById('halaman-login').classList.add('hidden');
            document.getElementById('sidebar-utama').classList.remove('hidden');
            document.getElementById('konten-utama').classList.remove('hidden');
            document.getElementById('txt-role-pengurus').innerText = "Akses: " + data.username.toUpperCase();
            initApp();
        }
    }

    async function prosesLoginSistem() {
        let u = document.getElementById('login-username').value.trim();
        let p = document.getElementById('login-password').value.trim();

        if (!u || !p) return Swal.fire('Gagal', 'Username & PIN wajib diisi', 'warning');

        Swal.fire({ title: 'Otorisasi...', didOpen: () => Swal.showLoading() });

        try {
            // GS mengharapkan parameter: username, password
            let r = await fetch(`${URL_API}?aksi=login_admin&username=${u}&password=${p}`, { method: 'POST' });
            let res = await r.json();

            if (res.status === "success") {
                localStorage.setItem('ppmuy_session', JSON.stringify({ username: u, nama: res.nama, role: res.role }));
                location.reload();
            } else {
                Swal.fire('Gagal', res.message, 'error');
            }
        } catch (e) {
            Swal.fire('Error', 'Server tidak merespon', 'error');
        }
    }

    function prosesLogoutSistem() {
        localStorage.removeItem('ppmuy_session');
        location.reload();
    }

    // 2. INITIALIZER
    async function initApp() {
        await muatDatabaseSantri();
        await muatDataDashboard();
        await muatTakzirUstadz();
    }

    function bukaMenu(idMenu) {
        document.querySelectorAll('.menu-content').forEach(s => s.classList.add('hidden'));
        document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
        document.getElementById(idMenu).classList.remove('hidden');
        document.getElementById('btn-' + idMenu).classList.add('active');
        document.getElementById('judul-halaman').innerText = document.getElementById('btn-' + idMenu).innerText;

        matikanSemuaKamera();
        if (idMenu === 'menu-scan') aktifkanKameraKiosk();
        if (idMenu === 'menu-daftar-wajah') aktifkanKameraReg();
    }

    // 3. FETCH DATA (GET)
    async function muatDatabaseSantri() {
        try {
            let r = await fetch(`${URL_API}?aksi=ambil_database`);
            let res = await r.json();
            if(res.status === "success") {
                dbSantriCache = res.data;
                let htmlOpt = `<option value="">-- Pilih Santri --</option>`;
                dbSantriCache.forEach(s => {
                    htmlOpt += `<option value="${s.nik}" data-nama="${s.nama}">${s.nama} (${s.kelas})</option>`;
                });
                ['reg-pilih-santri', 'izin-santri', 'disp-santri', 'pelanggaran-santri'].forEach(id => {
                    document.getElementById(id).innerHTML = htmlOpt;
                });
            }
        } catch(e) {}
    }

    async function muatDataDashboard() {
        try {
            let r = await fetch(`${URL_API}?aksi=ambil_rekap_dashboard`);
            let res = await r.json();
            if(res.status === "success") {
                document.getElementById('txt-total-sudah-wajah').innerText = res.rekapWajah.sudah;
                document.getElementById('txt-total-belum-wajah').innerText = res.rekapWajah.belum;
                globalRekapAlpa = res.daftarAlpa;
                renderCharts(res);
            }
        } catch(e) {}
    }

    function renderCharts(res) {
        if(myChartWajah) myChartWajah.destroy();
        myChartWajah = new Chart(document.getElementById('chartWajah'), {
            type: 'doughnut',
            data: { labels: ['Sudah', 'Belum'], datasets: [{ data: [res.rekapWajah.sudah, res.rekapWajah.belum], backgroundColor: ['#0284c7', '#f43f5e'] }] }
        });

        if(myChartShalat) myChartShalat.destroy();
        myChartShalat = new Chart(document.getElementById('chartShalat'), {
            type: 'bar',
            data: { labels: ['Subuh', 'Dzuhur', 'Ashar', 'Maghrib', 'Isya'], datasets: [{ label: 'Hadir', data: Object.values(res.rekapShalat), backgroundColor: '#2563eb' }] }
        });
    }

    function filterAlpa(waktu) {
        let list = globalRekapAlpa[waktu] || [];
        let html = list.length ? list.map(s => `
            <tr class="border-b border-slate-200">
                <td class="p-4 font-bold">${s.nama}</td>
                <td class="p-4">${s.kelas}</td>
                <td class="p-4 text-amber-600 font-bold">${waktu}</td>
                <td class="p-4 text-rose-600 font-bold">ALPA</td>
            </tr>`).join('') : `<tr><td colspan="4" class="p-8 text-center">Nihil / Hadir Semua</td></tr>`;
        document.getElementById('tabel-alpa-body').innerHTML = html;
    }

    // 4. SUBMISSION (POST) - DISESUAIKAN DENGAN KUNCI GS
    
    // Ustadz Manual (GS expects: nama_ustadz, nama_kegiatan)
    async function muatTakzirUstadz() {
        try {
            let r = await fetch(`${URL_API}?aksi=ambil_rekap_ustadz`);
            let res = await r.json();
            if(res.status === "success") {
                let htmlTable = ""; let htmlGrid = "";
                for (let namaU in res.data_takziran_ustadz) {
                    let obj = res.data_takziran_ustadz[namaU];
                    htmlTable += `<tr class="border-b"><td>${namaU}</td><td>${obj.hadir}</td><td class="text-right">${obj.alpa_poin}</td></tr>`;
                    htmlGrid += `<button onclick="absenUstadz('${namaU}')" class="p-4 bg-slate-50 border rounded-xl text-xs font-bold hover:bg-blue-50">${namaU}</button>`;
                }
                document.getElementById('tabel-takzir-ustadz-body').innerHTML = htmlTable;
                document.getElementById('grid-absen-ustadz').innerHTML = htmlGrid;
            }
        } catch(e) {}
    }

    async function absenUstadz(nama) {
        let keg = document.getElementById('ustadz-kegiatan').value;
        Swal.fire({ title: 'Mengunci Kehadiran...', didOpen: () => Swal.showLoading() });
        try {
            // POST aksi: absen_ustadz_manual
            let r = await fetch(URL_API, {
                method: 'POST',
                body: JSON.stringify({ aksi: "absen_ustadz_manual", nama_ustadz: nama, nama_kegiatan: keg })
            });
            let res = await r.json();
            if(res.status === "success") {
                Swal.fire('Berhasil', 'Kehadiran ustadz dicatat', 'success');
                muatTakzirUstadz();
            }
        } catch(e) { Swal.fire('Error', e.toString(), 'error'); }
    }

    // Perizinan (GS expects: nik, nama, jenis_izin, tgl_mulai, janji_kembali, no_hp_wali)
    async function submitPerizinan(e) {
        e.preventDefault();
        let sel = document.getElementById('izin-santri');
        let payload = {
            aksi: "input_perizinan",
            nik: sel.value,
            nama: sel.options[sel.selectedIndex].getAttribute('data-nama'),
            jenis_izin: document.getElementById('izin-jenis').value,
            no_hp_wali: document.getElementById('izin-wa-wali').value,
            tgl_mulai: document.getElementById('izin-tgl-mulai').value,
            janji_kembali: document.getElementById('izin-janji').value
        };
        
        Swal.fire({ title: 'Mengirim Data...', didOpen: () => Swal.showLoading() });
        try {
            let r = await fetch(URL_API, { method: 'POST', body: JSON.stringify(payload) });
            let res = await r.json();
            if(res.status === "success") {
                Swal.fire('Sukses', 'Izin tercatat & WA Terkirim', 'success');
                e.target.reset();
            }
        } catch(e) { Swal.fire('Error', e.toString(), 'error'); }
    }

    // Pelanggaran (GS expects: nik, nama, kategori, deskripsi)
    async function submitPelanggaran() {
        let sel = document.getElementById('pelanggaran-santri');
        let payload = {
            aksi: "input_pelanggaran",
            nik: sel.value,
            nama: sel.options[sel.selectedIndex].getAttribute('data-nama'),
            kategori: document.getElementById('pelanggaran-kategori').value,
            deskripsi: document.getElementById('pelanggaran-deskripsi').value
        };
        if(!payload.nik) return Swal.fire('Pilih Santri', '', 'warning');

        try {
            let r = await fetch(URL_API, { method: 'POST', body: JSON.stringify(payload) });
            let res = await r.json();
            Swal.fire('Tercatat', res.message, 'success');
        } catch(e) { Swal.fire('Error', e.toString(), 'error'); }
    }

    // Dispensasi (GS expects: nik, nama, kategori, bukti_foto)
    async function submitDispensasi() {
        let sel = document.getElementById('disp-santri');
        let fileInput = document.getElementById('disp-file-foto');
        let base64 = "";

        if(fileInput.files.length > 0) {
            let reader = new FileReader();
            reader.onload = async (e) => {
                base64 = e.target.result;
                kirimDisp(sel.value, sel.options[sel.selectedIndex].getAttribute('data-nama'), base64);
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            kirimDisp(sel.value, sel.options[sel.selectedIndex].getAttribute('data-nama'), "-");
        }
    }

    async function kirimDisp(nik, nama, foto) {
        let payload = {
            aksi: "input_dispensasi",
            nik: nik,
            nama: nama,
            kategori: document.getElementById('disp-kategori').value,
            bukti_foto: foto // Sesuai GS: Url_Bukti_Foto / parameter.bukti_foto
        };
        Swal.fire({ title: 'Menyimpan...', didOpen: () => Swal.showLoading() });
        let r = await fetch(URL_API, { method: 'POST', body: JSON.stringify(payload) });
        let res = await r.json();
        Swal.fire('Sukses', res.message, 'success');
    }

    // Oprak (GS expects: nama_petugas, target_oprak, keterangan)
    async function submitOprak() {
        let payload = {
            aksi: "log_oprak",
            nama_petugas: document.getElementById('oprak-nama').value,
            target_oprak: document.getElementById('oprak-target').value,
            keterangan: document.getElementById('oprak-ket').value
        };
        if(!payload.nama_petugas) return Swal.fire('Nama Petugas Wajib', '', 'warning');
        
        let r = await fetch(URL_API, { method: 'POST', body: JSON.stringify(payload) });
        let res = await r.json();
        Swal.fire('Sukses', res.message, 'success');
    }

    // Registrasi Wajah (GS expects: nik, vektor)
    async function ambilVektorWajah() {
        let nik = document.getElementById('reg-pilih-santri').value;
        if(!nik) return Swal.fire('Pilih Santri', '', 'warning');
        
        // Emulasi vektor 128-float
        let mockVector = Array.from({length: 128}, () => Math.random().toFixed(4)).join(',');

        let r = await fetch(URL_API, {
            method: 'POST',
            body: JSON.stringify({ aksi: "daftar_wajah_saja", nik: nik, vektor: mockVector })
        });
        let res = await r.json();
        Swal.fire('Kunci Wajah', res.message, 'success');
    }

    // 5. KAMERA MANAGER
    async function aktifkanKameraKiosk() {
        try {
            streamKameraKiosk = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('video-kiosk').srcObject = streamKameraKiosk;
            document.getElementById('loading-camera-txt').classList.add('hidden');
        } catch(e) {}
    }

    async function aktifkanKameraReg() {
        try {
            streamKameraReg = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('video-reg').srcObject = streamKameraReg;
        } catch(e) {}
    }

    function matikanSemuaKamera() {
        if(streamKameraKiosk) streamKameraKiosk.getTracks().forEach(t => t.stop());
        if(streamKameraReg) streamKameraReg.getTracks().forEach(t => t.stop());
    }
</script>
