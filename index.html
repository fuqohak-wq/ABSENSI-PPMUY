<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Pengurus - E-Pesantren</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-2xl flex flex-col gap-4 text-center">
        <div>
            <div class="w-14 h-14 bg-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-2 shadow-lg">
                <i class="fa-solid fa-shield-halved text-slate-950 text-2xl"></i>
            </div>
            <h1 class="text-base font-black text-amber-400 tracking-wider uppercase">E-PESANTREN CORE</h1>
            <p class="text-[11px] text-slate-400 font-bold uppercase tracking-widest mt-0.5">Otorisasi Manajemen Terpadu</p>
        </div>
        <form id="form-login" class="space-y-3 text-left">
            <div>
                <label class="text-[10px] font-black text-slate-400 tracking-wider uppercase block mb-1">Username Admin:</label>
                <input type="text" id="inp-user" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-xs font-bold text-white outline-none focus:border-amber-400" required>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 tracking-wider uppercase block mb-1">PIN / Password:</label>
                <input type="password" id="inp-pass" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-xs font-bold text-white outline-none focus:border-amber-400" required>
            </div>
            <button type="submit" id="btn-login" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-xl text-xs uppercase tracking-widest transition-all cursor-pointer">MASUK SISTEM</button>
        </form>
    </div>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwR-Ml0M6mCXj2yc_E0Ihll3V3HIDlithCuMYvIsxSrtZdhVDJNMFZ5WKb657o8di5x/exec";
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const b = document.getElementById('btn-login');
            b.disabled = true; b.innerText = "VALIDASI CLOUD...";
            
            const p = new URLSearchParams();
            p.append('aksi', 'login_admin');
            p.append('username', document.getElementById('inp-user').value);
            p.append('password', document.getElementById('inp-pass').value);

            try {
                let res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: p.toString() });
                let r = await res.json();
                if (r.status === "success") {
                    localStorage.setItem('session_nama', r.nama);
                    localStorage.setItem('session_role', r.role);
                    window.location.href = "dashboard.html";
                } else { alert(r.message); }
            } catch(err) { alert("Koneksi gagal atau masalah CORS!"); }
            finally { b.disabled = false; b.innerText = "MASUK SISTEM"; }
        });
    </script>
</body>
</html>
